<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Salik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<script src="https://effimalik.github.io/Testing/shared/apiConfig.js"></script>
<script src="https://effimalik.github.io/Testing/shared/cacheWatcher.js?v=1"></script>
<script src="https://effimalik.github.io/Testing/shared/code.js"></script>
<script src="https://effimalik.github.io/Testing/shared/cioView.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ═══ THEME — kept identical to the shared module chrome ═══ */
:root,[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;
  --surface:#21262d;--surface2:#2d333b;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--accent-glow:rgba(88,166,255,.28);
  --teal:#39d353;--teal-dim:rgba(57,211,83,.12);
  --amber:#e3b341;--amber-dim:rgba(227,179,65,.12);
  --red:#f85149;--red-dim:rgba(248,81,73,.12);
  --purple:#a371f7;--purple-dim:rgba(163,113,247,.12);
  --orange:#f0883e;--orange-dim:rgba(240,136,62,.12);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;
  --surface:#fff;--surface2:#e2e7ed;
  --border:#c8d0d9;--border2:#9aa5b1;
  --text:#0d1117;--text2:#3d454f;--text3:#5a6370;
  --accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--accent-glow:rgba(5,80,174,.22);
  --teal:#116329;--teal-dim:rgba(17,99,41,.13);
  --amber:#7d4e00;--amber-dim:rgba(125,78,0,.13);
  --red:#a8111b;--red-dim:rgba(168,17,27,.11);
  --purple:#6639c8;--purple-dim:rgba(102,57,200,.13);
  --orange:#953800;--orange-dim:rgba(149,56,0,.13);
  --shadow:0 1px 3px rgba(0,0,0,.10);--shadow-md:0 4px 16px rgba(0,0,0,.12);--shadow-lg:0 8px 32px rgba(0,0,0,.15);
}
[data-theme="purple"]{
  --bg:#0f0b1e;--bg2:#17112e;--bg3:#1e1840;
  --surface:#221a3a;--surface2:#2c2250;
  --border:#3a2e5e;--border2:#5a4890;
  --text:#e8e0ff;--text2:#a899d4;--text3:#7a6ca8;
  --accent:#c084fc;--accent-dim:rgba(192,132,252,.14);--accent-glow:rgba(192,132,252,.3);
  --teal:#4ade80;--teal-dim:rgba(74,222,128,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --purple:#c084fc;--purple-dim:rgba(192,132,252,.14);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.5);--shadow-md:0 4px 16px rgba(0,0,0,.6);--shadow-lg:0 8px 32px rgba(0,0,0,.7);
}
[data-theme="ocean"]{
  --bg:#071520;--bg2:#0d2035;--bg3:#112840;
  --surface:#143050;--surface2:#1a3d60;
  --border:#1e4a72;--border2:#2e6a9e;
  --text:#d6eeff;--text2:#7db8e8;--text3:#4a87b8;
  --accent:#38bdf8;--accent-dim:rgba(56,189,248,.14);--accent-glow:rgba(56,189,248,.3);
  --teal:#34d399;--teal-dim:rgba(52,211,153,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.5);--shadow-md:0 4px 16px rgba(0,0,0,.55);--shadow-lg:0 8px 32px rgba(0,0,0,.65);
}
[data-theme="slate"]{
  --bg:#0e1117;--bg2:#1a1f28;--bg3:#222836;
  --surface:#28303e;--surface2:#313c4e;
  --border:#3a4556;--border2:#556070;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#60a5fa;--accent-dim:rgba(96,165,250,.13);--accent-glow:rgba(96,165,250,.28);
  --teal:#4ade80;--teal-dim:rgba(74,222,128,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.45);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 8px 32px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;-webkit-text-size-adjust:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ═══ LAYOUT ═══ */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow-x:hidden;}
.portal-wrap{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:1400px;margin:0 auto;padding:14px;gap:14px;}

/* ═══ VIEW BAR ═══ */
.view-bar{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.vb-brand{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-lg);background:var(--accent-dim);color:var(--accent);border:1px solid var(--border);font-size:16px;}
.vb-spacer{flex:1;}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-lg);background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;transition:color .15s,border-color .15s,background .15s;}
.ib:hover{border-color:var(--accent);color:var(--accent);}

/* cache status indicator */
#cache-status{padding:0;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;cursor:pointer;border-radius:var(--radius-lg);background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:color .2s,border-color .2s,background .2s;}
#cache-status i{font-size:15px;line-height:1;}
#cache-status:not(:disabled):hover{color:var(--accent);border-color:var(--accent);}
#cache-status:disabled{cursor:not-allowed;opacity:.45;}
#cache-status[data-mode="checking"],#cache-status[data-mode="loading"]{cursor:progress;opacity:.8;}
#cache-status.ready{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
#cache-status.ready:hover{color:#fff;filter:brightness(1.12);}
#cache-status:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* info popover (subtitle, cache status, Salik account) */
.vb-actions{position:relative;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.info-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:300;width:min(340px,calc(100vw - 28px));display:none;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);}
.info-pop.show{display:flex;}
.info-row{display:flex;flex-direction:column;gap:3px;}
.info-row .k{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;}
.info-row .v{font-size:12px;color:var(--text2);word-break:break-word;}
.info-row .v.ok{color:var(--teal);}
.info-row .v.warn{color:var(--amber);}
.ib[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
#cache-status i.spin{animation:spin 1s linear infinite;}
#cache-status.ok{color:var(--teal);border-color:rgba(57,211,83,.35);background:var(--teal-dim);}
#cache-status.bad{color:var(--red);border-color:rgba(248,81,73,.35);background:var(--red-dim);}
@keyframes spin{to{transform:rotate(360deg);}}

/* ═══ FIELD / FORM ═══ */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;}
.field select,.field input[type=text]{padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:12.5px;}
.field select:focus,.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.config-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.config-row .field{gap:2px;}
.config-row .field label{font-size:9.5px;}
.config-row .field select{padding:5px 8px;font-size:12px;}

/* ═══ BUTTONS / BADGES ═══ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1.5px solid;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;line-height:1;}
.btn i{font-size:15px;flex-shrink:0;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.badge.purple{background:rgba(163,113,247,.18);color:#a371f7;border:1px solid rgba(163,113,247,.3);}
.badge.ok{background:var(--teal-dim);color:var(--teal);}
.badge.warn{background:var(--amber-dim);color:var(--amber);}
.badge.bad{background:var(--red-dim);color:var(--red);}

/* ═══ RESULTS: tabs + flat table ═══ */
.tab-nav{display:flex;gap:3px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3px;width:fit-content;}
.tab-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:none;background:transparent;color:var(--text2);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;}
.tab-btn .count{font-family:var(--mono);font-weight:500;font-size:10.5px;background:var(--surface2);border-radius:20px;padding:1px 7px;}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow);}
.tab-btn.active .count{background:rgba(255,255,255,.25);color:#fff;}
.tab-btn:not(.active):hover{background:var(--surface2);color:var(--text);}

.results-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);overflow:hidden;}
.panel-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;}
.panel-toolbar .search-input{font-family:var(--mono);font-size:12px;border:1.5px solid var(--border2);border-radius:var(--radius);padding:7px 11px;width:220px;background:var(--surface2);color:var(--text);}
.panel-toolbar .search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.panel-toolbar .label{font-size:12px;color:var(--text3);}
.table-scroll{max-height:max(320px,calc(100vh - 260px));max-height:max(320px,calc(100dvh - 260px));overflow:auto;}

.log-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.log-table th{padding:9px 14px;text-align:left;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);background:var(--bg3);cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:2;}
.log-table th:hover{color:var(--accent);}
.log-table th .arrow{opacity:.5;margin-left:3px;}
.log-table td{padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-family:var(--mono);white-space:nowrap;}
.log-table tbody tr:hover{background:var(--surface2);}
.log-table td.num{text-align:right;}

.empty-state{padding:60px 20px;text-align:center;color:var(--text3);font-size:13px;}
.empty-state i{font-size:32px;display:block;margin-bottom:10px;opacity:.4;}

footer.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text3);padding:0 4px;flex-wrap:wrap;gap:8px;}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);padding:10px 16px;border-radius:var(--radius-lg);font-size:12.5px;font-weight:500;z-index:999;opacity:0;transform:translateY(10px);transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);max-width:340px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--teal-dim);color:var(--teal);border-color:rgba(57,211,83,.25);}
.toast.error{background:var(--red-dim);color:var(--red);border-color:rgba(248,81,73,.25);}
.spinner{animation:spin 1s linear infinite;display:inline-flex;}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1280px){
  /* row 1: brand … info + "+"   ·   row 2: options   ·   row 3: tabs */
  .view-bar{gap:8px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));}
  .vb-brand{order:1;}
  .vb-spacer{order:2;}
  .vb-actions{order:3;}
  .config-row{order:6;flex:1 1 100%;}
  .config-row .field{flex:1 1 110px;min-width:0;}
  .config-row .field select{width:100%;}
  .config-row .field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tab-nav{order:5;flex:1 1 100%;width:100%;overflow-x:auto;scrollbar-width:none;}
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-btn{flex:1 0 auto;}
}
@media(max-width:700px){
  .portal-wrap{padding:8px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:10px;}
  .panel-toolbar{padding:10px 12px;}
  .panel-toolbar .search-input{width:100%;flex:1 1 100%;}
  .toolbar-actions{width:100%;}
  .toolbar-actions .label{flex:1 1 100%;}
  .toolbar-actions .btn{flex:1;justify-content:center;}
  .table-scroll{max-height:65vh;max-height:65dvh;}
  .log-table th,.log-table td{padding:7px 10px;}
  footer.meta{flex-direction:column;}
  .toast{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:none;}
}
@media(max-width:520px){
  .config-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .config-row .field:last-child{grid-column:1/-1;}
  .tab-btn{padding:7px 10px;}
  .empty-state{padding:40px 14px;}
}
/* touch screens: bigger targets, and 16px inputs so iOS doesn't zoom on focus */
@media(pointer:coarse){
  .ib,#cache-status,.vb-brand{width:40px;height:40px;}
  .field select,.field input[type=text],.panel-toolbar .search-input,.config-row .field select{font-size:16px;padding:8px 10px;}
  .tab-btn{padding:9px 14px;}
  .btn-sm{padding:9px 12px;}
}
</style>
</head>
<body>

<div class="view-bar">
  <div class="vb-brand"><i class="ti ti-road"></i></div>
  <!-- tabs — shown once the fleet log cache has loaded -->
  <div class="tab-nav" id="tabNav" style="display:none;">
    <button class="tab-btn active" data-tab="log">Fleet Log <span class="count" id="cntLog">0</span></button>
    <button class="tab-btn" data-tab="summary">Summary <span class="count" id="cntSummary">0</span></button>
    <button class="tab-btn" data-tab="details">Trip Details <span class="count" id="cntDetails">0</span></button>
    <button class="tab-btn" data-tab="exceptions">Exceptions <span class="count" id="cntExceptions">0</span></button>
    <button class="tab-btn" data-tab="sessions">Checkout Sessions <span class="count" id="cntSessions">0</span></button>
  </div>

  <!-- options — visible once a PDF is loaded; changing them re-runs reconciliation automatically -->
  <div class="config-row" id="configRow" style="display:none;" title="Reconciles automatically when changed">
    <div class="field">
      <label>Grace before checkout</label>
      <select id="graceBefore" title="Exception window: how long before a rider's check-out to still catch a Salik trip.">
        <option value="0">0 min</option>
        <option value="5">5 min</option>
        <option value="10" selected>10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
      </select>
    </div>
    <div class="field">
      <label>Grace after check-in</label>
      <select id="graceAfter" title="Exception window: how long after a rider's check-in to still catch a Salik trip.">
        <option value="0">0 min</option>
        <option value="5">5 min</option>
        <option value="10" selected>10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
      </select>
    </div>
    <div class="field">
      <label>Assign boundary trips to</label>
      <select id="exceptionAssignTo" title="A trip inside both grace windows sits between two riders. Fill down assigns it to the check-out person (the rider taking it out next); fill up assigns it to the check-in person (the rider who just returned it).">
        <option value="checkout" selected>Check-out person</option>
        <option value="checkin">Check-in person</option>
      </select>
    </div>
    <div class="field">
      <label>Item type</label>
      <select id="itemTypeFilter">
        <option value="Bike" selected>Bike</option>
        <option value="Car">Car</option>
        <option value="ALL">All vehicle types</option>
      </select>
    </div>
  </div>

  <div class="vb-spacer"></div>

  <div class="vb-actions">
  <button type="button" class="ib" id="btnInfo" title="Information" aria-label="Information" aria-expanded="false"><i class="ti ti-info-circle"></i></button>
  <!-- "+" : inactive until the fleet log cache is available; then active — press to load it, step 2 follows -->
  <button type="button" id="cache-status" data-mode="checking" title="Checking for cache&hellip;" aria-label="Add Salik PDF" onclick="onPlusClick()" disabled><i class="ti ti-loader spin"></i></button>

  <div class="info-pop" id="infoPop" role="dialog" aria-label="Information">
    <div class="info-row"><span class="k">About</span><span class="v" id="vbSub">Toll trips &times; fleet check-in / check-out log</span></div>
    <div class="info-row"><span class="k">Fleet log cache</span><span class="v" id="infoCache">Checking for cache&hellip;</span></div>
    <div class="info-row" id="pdfRow" style="display:none;"><span class="k">Salik PDF</span><span class="v" id="infoPdf"></span></div>
    <div class="info-row" id="acctRow" style="display:none;"><span class="k">Salik account</span><span id="acctBadge" class="badge purple" style="align-self:flex-start;"></span></div>
  </div>
  </div>
</div>

<div class="portal-wrap">

  <!-- STEP 3 (automatic): results -->
  <div id="resultsArea" style="display:none;flex-direction:column;gap:10px;">
    <div class="results-panel">
      <div class="panel-toolbar">
        <input type="text" class="search-input" id="searchBox" placeholder="Filter rows&hellip;">
        <div class="toolbar-actions">
          <span class="label" id="rowCountLabel"></span>
          <button class="btn btn-ghost btn-sm" id="btnExportCsv"><i class="ti ti-file-type-csv"></i> Export CSV</button>
          <button class="btn btn-primary btn-sm" id="btnExportXlsx"><i class="ti ti-file-spreadsheet"></i> Export Excel</button>
          <button class="btn btn-ghost btn-sm" id="btnSaveSheet"><i class="ti ti-cloud-upload"></i> Save to Sheet</button>
        </div>
      </div>
      <div class="table-scroll" id="tableHost"></div>
    </div>
    <footer class="meta">
      <span id="metaLeft"></span>
      <span id="metaRight"></span>
    </footer>
  </div>

  <div id="emptyResults" class="empty-state">
    <i class="ti ti-circle-dashed"></i>
    <span id="emptyMsg">Checking for the fleet log cache&hellip;</span>
  </div>

</div>

<input type="file" id="pdfInput" accept="application/pdf" hidden>
<div class="toast" id="toast" role="alert">
  <i id="toast-icon" class="ti ti-circle-check"></i>
  <span id="toast-msg">Saved</span>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
 *  Cache layer: shared watcher with safe local fallback.
 *  Copied unmodified from the shared module structure —
 *  guarantees AP2CacheWatcher.readKey(key) always works,
 *  whether or not the shared cacheWatcher.js actually loaded.
 * ═══════════════════════════════════════════════════════ */
const _IDB_NAME  = 'ap2_fleet_cache';
const _IDB_STORE = 'datasets';

if (typeof window.AP2CacheWatcher === 'undefined') {
  console.warn('[salik] cacheWatcher.js did not load — using local fallback');
  window.AP2CacheWatcher = (function () {
    let _conn = null;
    function _open() {
      if (_conn) return Promise.resolve(_conn);
      return new Promise((res, rej) => {
        let done = false;
        const req = indexedDB.open(_IDB_NAME);
        const t = setTimeout(() => { if (!done) { done = true; rej(new Error('idb-open-timeout')); } }, 2000);
        req.onsuccess = e => { if (!done) { done = true; clearTimeout(t); _conn = e.target.result; res(_conn); } };
        req.onerror   = e => { if (!done) { done = true; clearTimeout(t); rej(e.target.error); } };
      });
    }
    return {
      init() {},
      subscribe() { return () => {}; },
      notifyNow() {},
      getStatus() { return { healthy: false, mode: 'local-fallback', lastError: 'cacheWatcher.js not loaded' }; },
      async readKey(key) {
        try {
          const db  = await _open();
          if (!db.objectStoreNames.contains(_IDB_STORE)) return null;
          const rec = await new Promise((res, rej) => {
            const r = db.transaction(_IDB_STORE, 'readonly').objectStore(_IDB_STORE).get(key);
            r.onsuccess = () => res(r.result || null);
            r.onerror   = () => rej(r.error);
          });
          return (rec && rec.data) ? rec.data : null;
        } catch (e) {
          if (e && e.name === 'NotFoundError') return null;
          console.warn('[salik] fallback read failed:', e.message);
          return null;
        }
      }
    };
  })();
}

/* ===================== STATE ===================== */
const state = {
  cioRaw: null,
  logRows: [],
  loading: false,
  addMode: 'checking',
  watcherInit: false,
  probeTimer: null,
  subscribed: false,
  sessions: [],
  salikRows: [],
  pdfMeta: {},
  results: { log: [], summary: [], details: [], exceptions: [], sessions: [] },
  sort: { log: { key: 'ts', dir: 'desc' } },
  activeTab: 'log'
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg, type){
  const t = $('#toast'), icon = $('#toast-icon'), label = $('#toast-msg');
  t.className = 'toast show' + (type ? ' ' + type : '');
  icon.className = 'ti ' + (type === 'error' ? 'ti-alert-circle' : type === 'success' ? 'ti-circle-check' : 'ti-info-circle');
  label.textContent = msg;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.classList.remove('show'); }, 2800);
}

// "+" : inactive (spinner / greyed) until the fleet log cache is loaded; then active — press to pick the Salik PDF
function setCacheStatus(mode, info){
  const el = $('#cache-status');
  state.addMode = mode;
  el.dataset.mode = mode;
  el.className = mode === 'ok' ? 'ready' : '';
  el.disabled = mode !== 'ok';
  el.title = mode === 'ok' ? 'Add Salik PDF' : mode === 'off' ? 'Waiting for the fleet log cache' : 'Loading fleet log cache\u2026';
  el.innerHTML = (mode === 'checking' || mode === 'loading') ? '<i class="ti ti-loader spin"></i>' : '<i class="ti ti-plus"></i>';
  const ic = $('#infoCache');
  ic.textContent = info || '';
  ic.className = 'v ' + (mode === 'ok' ? 'ok' : mode === 'off' ? 'warn' : '');
  const em = $('#emptyMsg');
  if (em && mode !== 'ok') em.textContent = mode === 'off' ? 'Fleet log cache not available yet \u2014 open the fleet app in this browser. This page keeps checking.' : 'Checking for the fleet log cache\u2026';
}

/* ===================== STEP 1: fleet log cache ===================== */
function normalizeCioValue(val){
  let arr = null;
  if (Array.isArray(val)) arr = val;
  else if (val && Array.isArray(val.data)) arr = val.data;
  else if (val && val.value && Array.isArray(val.value.data)) arr = val.value.data;
  if (!arr) throw new Error('Unrecognized ap2_cioLog shape — expected an array of log rows or {data:[...]}.');
  return arr;
}

// Secondary fallback: scan every object store in ap2_fleet_cache for the key,
// in case the shared watcher's single-store assumption doesn't match this browser.
async function scanAllStoresForCio(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(_IDB_NAME);
    req.onerror = () => reject(new Error('Could not open IndexedDB "' + _IDB_NAME + '".'));
    req.onsuccess = (e) => {
      const db = e.target.result;
      const storeNames = Array.from(db.objectStoreNames);
      if (storeNames.length === 0){ db.close(); reject(new Error('Database exists but has no object stores.')); return; }
      let found = null, remaining = storeNames.length;
      const tx = db.transaction(storeNames, 'readonly');
      storeNames.forEach(storeName => {
        const getReq = tx.objectStore(storeName).get('ap2_cioLog');
        getReq.onsuccess = () => {
          if (getReq.result !== undefined && found === null) found = { store: storeName, value: getReq.result };
          if (--remaining === 0){ db.close(); found ? resolve(found) : reject(new Error('No object store contained key "ap2_cioLog". Checked: ' + storeNames.join(', '))); }
        };
        getReq.onerror = () => { if (--remaining === 0){ db.close(); found ? resolve(found) : reject(new Error('Error reading object stores.')); } };
      });
    };
  });
}

async function readCioRaw(){
  if (!state.watcherInit){
    if (typeof AP2CacheWatcher.init === 'function') AP2CacheWatcher.init();
    state.watcherInit = true;
  }
  let raw = await AP2CacheWatcher.readKey('ap2_cioLog');
  let sourceLabel = 'shared cache watcher';
  if (!raw){
    const found = await scanAllStoresForCio();
    raw = found.value;
    sourceLabel = 'store "' + found.store + '"';
  }
  return { arr: normalizeCioValue(raw), sourceLabel };
}

// Checked on open, then every 5 s while the cache is missing. Once found it loads automatically and "+" turns active.
async function probeCache(){
  if (state.addMode !== 'checking' && state.addMode !== 'off') return;
  return loadCache();
}

async function loadCache(){
  if (state.loading) return;
  state.loading = true;
  clearTimeout(state.probeTimer);
  if (state.addMode !== 'off') setCacheStatus('loading', 'Reading cache\u2026');
  try{
    const { arr, sourceLabel } = await readCioRaw();
    state.cioRaw = arr;
    onCioLoaded(arr, sourceLabel, false);
    if (typeof AP2CacheWatcher.subscribe === 'function' && !state.subscribed){
      state.subscribed = true;
      AP2CacheWatcher.subscribe('ap2_cioLog', (updated) => {
        try{ const upArr = normalizeCioValue(updated); state.cioRaw = upArr; onCioLoaded(upArr, 'live update', true); }
        catch(e){ /* ignore malformed live updates */ }
      });
    }
  }catch(err){
    setCacheStatus('off', 'Cache not available \u2014 ' + err.message);
    state.probeTimer = setTimeout(probeCache, 5000);
  }finally{ state.loading = false; }
}

// the + button: opens the file picker for the Salik PDF
function onPlusClick(){ if (state.addMode === 'ok') $('#pdfInput').click(); }

function onCioLoaded(arr, sourceLabel, quiet){
  state.sessions = buildSessions(arr);
  state.logRows = arr
    .filter(r => Array.isArray(r) && r.length >= 6 && r[0])
    .map(r => ({ ts: new Date(r[0]).getTime(), ref: r[1], riderId: r[2], action: r[3], itemType: r[4], itemId: r[5] }))
    .filter(r => !isNaN(r.ts));
  setCacheStatus('ok', arr.length + ' log entries (' + sourceLabel + ') \u00b7 ' + state.sessions.length + ' checkout sessions');
  recompute();
  if (!quiet) showToast('Fleet log loaded \u2014 press + to add the Salik PDF.', 'success');
}

/* Log row: [isoTimestamp, ref, riderId, action ("Check In"|"Check Out"), itemType, itemId] */
function buildSessions(rows){
  const clean = rows
    .filter(r => Array.isArray(r) && r.length >= 6 && r[0])
    .map(r => ({ ts: new Date(r[0]).getTime(), ref: r[1], riderId: r[2], action: r[3], itemType: r[4], itemId: r[5] }))
    .filter(r => !isNaN(r.ts))
    .sort((a,b) => a.ts - b.ts);

  const byItem = {};
  clean.forEach(r => { const key = String(r.itemId); (byItem[key] = byItem[key] || []).push(r); });

  const sessions = [];
  let lastKnownTs = 0;
  clean.forEach(r => { if (r.ts > lastKnownTs) lastKnownTs = r.ts; });

  Object.keys(byItem).forEach(itemId => {
    const events = byItem[itemId];
    let openCheckout = null;
    events.forEach(ev => {
      if (ev.action === 'Check Out'){
        if (openCheckout){
          sessions.push({ itemId, itemType: openCheckout.itemType, riderId: openCheckout.riderId,
            checkOutTs: openCheckout.ts, checkInTs: ev.ts, open: false,
            checkOutRef: openCheckout.ref, checkInRef: ev.ref, note: 'closed by next checkout (no explicit check-in found)' });
        }
        openCheckout = ev;
      } else if (ev.action === 'Check In'){
        if (openCheckout){
          sessions.push({ itemId, itemType: openCheckout.itemType, riderId: openCheckout.riderId,
            checkOutTs: openCheckout.ts, checkInTs: ev.ts, open: false,
            checkOutRef: openCheckout.ref, checkInRef: ev.ref, note: '' });
          openCheckout = null;
        }
      }
    });
    if (openCheckout){
      sessions.push({ itemId, itemType: openCheckout.itemType, riderId: openCheckout.riderId,
        checkOutTs: openCheckout.ts, checkInTs: lastKnownTs, open: true,
        checkOutRef: openCheckout.ref, checkInRef: null, note: 'still checked out — window extended to last log entry' });
    }
  });

  return sessions;
}

/* ===================== STEP 2: PDF parsing ===================== */
async function parsePdf(file){
  const buf = await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

  let fullText = '';
  let meta = { accountNo: null, periodFrom: null, periodTo: null, totalTrips: null, totalAmount: null };

  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }));
    const lines = {};
    items.forEach(it => { const key = Math.round(it.y); (lines[key] = lines[key] || []).push(it); });
    const sortedYs = Object.keys(lines).map(Number).sort((a,b) => b - a);
    sortedYs.forEach(y => {
      const lineItems = lines[y].sort((a,b) => a.x - b.x);
      const lineText = lineItems.map(li => li.str).join(' ').replace(/\s+/g,' ').trim();
      if (lineText) fullText += lineText + '\n';
    });

    if (p === 1){
      const accMatch = fullText.match(/Account No:\s*(\d+)/);
      if (accMatch) meta.accountNo = accMatch[1];
      const periodMatch = fullText.match(/From\s+(\d{2}-\d{2}-\d{4})\s+To\s+(\d{2}-\d{2}-\d{4})/);
      if (periodMatch){ meta.periodFrom = periodMatch[1]; meta.periodTo = periodMatch[2]; }
    }
  }

  const totalsMatch = fullText.match(/TotalTrips:\s*([\d,]+)\s+TotalAmount\(AED\):\s*([\d,.]+)/);
  if (totalsMatch){
    meta.totalTrips = parseInt(totalsMatch[1].replace(/,/g,''), 10);
    meta.totalAmount = parseFloat(totalsMatch[2].replace(/,/g,''));
  }

  const rowRe = /(\d{11})\s+(\d{2} \w{3} \d{4})\s+(\d{2}:\d{2}:\d{2} [AP]M)\s+(\d{2} \w{3} \d{4})\s+(.+?)\s+(\d+)\s+(\S+)\s+([\d.]+)(?=\s|$)/g;
  const rows = [];
  let m;
  while ((m = rowRe.exec(fullText)) !== null){
    const [_, txId, tripDateStr, tripTimeStr, postDateStr, location, tagNumber, plate, amountStr] = m;
    const tripDt = parseSalikDateTime(tripDateStr, tripTimeStr);
    rows.push({ transactionId: txId, tripDateStr, tripTimeStr, tripTs: tripDt.getTime(), postDateStr,
      location: location.trim(), tagNumber, plate: plate.trim(), amount: parseFloat(amountStr) });
  }

  const seen = new Set();
  const deduped = rows.filter(r => { if (seen.has(r.transactionId)) return false; seen.add(r.transactionId); return true; });

  return { rows: deduped, meta };
}

function parseSalikDateTime(dateStr, timeStr){
  const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const [d, monStr, y] = dateStr.split(' ');
  const tm = timeStr.match(/(\d{2}):(\d{2}):(\d{2}) ([AP]M)/);
  let [_, hh, mm, ss, ap] = tm;
  hh = parseInt(hh, 10);
  if (ap === 'AM'){ if (hh === 12) hh = 0; } else { if (hh !== 12) hh += 12; }
  return new Date(parseInt(y,10), months[monStr], parseInt(d,10), hh, parseInt(mm,10), parseInt(ss,10));
}

/* ===================== reconciliation + views ===================== */
function recompute(){
  if (!state.cioRaw) return;
  const graceBefore = parseInt($('#graceBefore').value, 10) * 60000;
  const graceAfter = parseInt($('#graceAfter').value, 10) * 60000;
  const itemTypeFilter = $('#itemTypeFilter').value;
  const assignTo = $('#exceptionAssignTo').value; // 'checkout' = check-out person (fill down) | 'checkin' = check-in person (fill up)
  state.results = reconcile(state.sessions, state.salikRows, { graceBefore, graceAfter, itemTypeFilter, assignTo });
  state.results.log = state.logRows.filter(r => itemTypeFilter === 'ALL' || r.itemType === itemTypeFilter);
  renderResults();
}

// Pure function: given sessions + salik trips + options, returns {summary, details, exceptions, sessions}.
//
// A session is "PROPER" when a Salik trip falls strictly inside the recorded
// check-out \u2192 check-in window (no grace) \u2014 it's simply "the data says so".
//
// A session is an "EXCEPTION" when a trip only falls inside the grace zone
// around a check-out or a check-in \u2014 i.e. the item wasn't officially checked
// out yet (or was already checked back in) when the toll was triggered.
// These are resolved with fill-up / fill-down, spreadsheet-style:
//   \u2022 fill down \u2014 the trip is just BEFORE a session's check-out \u2192 brings the
//     NEXT (coming) rider's ID/plate onto it \u2014 i.e. the check-out person.
//   \u2022 fill up   \u2014 the trip is just AFTER a session's check-in \u2192 brings the
//     PREVIOUS rider's ID/plate onto it \u2014 i.e. the check-in person.
// When a trip sits in both zones at once (a genuine hand-over overlap between
// two riders), opts.assignTo decides which one wins: 'checkout' (default)
// prefers the check-out / fill-down person, 'checkin' prefers the check-in /
// fill-up person.
function reconcile(allSessions, salikRows, opts){
  const graceBefore = opts.graceBefore || 0;
  const graceAfter = opts.graceAfter || 0;
  const itemTypeFilter = opts.itemTypeFilter || 'ALL';
  const assignTo = opts.assignTo || 'checkout';

  let sessions = allSessions.slice();
  if (itemTypeFilter !== 'ALL') sessions = sessions.filter(s => s.itemType === itemTypeFilter);

  const sessionsByPlate = {};
  sessions.forEach(s => { const key = String(s.itemId).trim(); (sessionsByPlate[key] = sessionsByPlate[key] || []).push(s); });
  const tripsByPlate = {};
  salikRows.forEach(t => { (tripsByPlate[t.plate] = tripsByPlate[t.plate] || []).push(t); });

  const seenTxIds = new Set();
  const details = [];
  const sessionTripCounts = new Map();

  function pushDetail(s, trip, matchType, fillDirection){
    seenTxIds.add(trip.transactionId);
    const sKey = s.checkOutRef + '|' + s.itemId;
    sessionTripCounts.set(sKey, (sessionTripCounts.get(sKey)||0) + 1);
    details.push({ riderId: s.riderId, plate: trip.plate, itemId: s.itemId, transactionId: trip.transactionId,
      tripTs: trip.tripTs, amount: trip.amount, location: trip.location,
      checkOutTs: s.checkOutTs, checkInTs: s.checkInTs, sessionOpen: s.open,
      matchType, fillDirection: fillDirection || '' });
  }

  // PASS 1 \u2014 Proper: strictly inside the actual check-out\u2192check-in window, no grace.
  sessions.forEach(s => {
    const candidates = tripsByPlate[String(s.itemId).trim()] || [];
    candidates.forEach(trip => {
      if (seenTxIds.has(trip.transactionId)) return;
      if (trip.tripTs >= s.checkOutTs && trip.tripTs <= s.checkInTs){
        pushDetail(s, trip, 'proper');
      }
    });
  });

  // PASS 2 \u2014 Exception: whatever's left, resolved via the grace-zone fill up/down.
  const nearestBy = (list, key, ts) => list.slice().sort((a,b) => Math.abs(a[key]-ts) - Math.abs(b[key]-ts))[0];
  Object.keys(tripsByPlate).forEach(plate => {
    const plateSessions = sessionsByPlate[plate];
    if (!plateSessions) return;
    tripsByPlate[plate].forEach(trip => {
      if (seenTxIds.has(trip.transactionId)) return;
      // fill-down candidates: session about to start \u2014 trip is shortly BEFORE its check-out (check-out person)
      const preCandidates = plateSessions.filter(s => trip.tripTs >= s.checkOutTs - graceBefore && trip.tripTs < s.checkOutTs);
      // fill-up candidates: session just ended \u2014 trip is shortly AFTER its check-in (check-in person)
      const postCandidates = plateSessions.filter(s => trip.tripTs > s.checkInTs && trip.tripTs <= s.checkInTs + graceAfter);

      let chosen = null, fillDirection = null;
      if (preCandidates.length && postCandidates.length){
        // ambiguous hand-over zone \u2014 defer to the assignTo preference
        if (assignTo === 'checkin'){ chosen = nearestBy(postCandidates, 'checkInTs', trip.tripTs); fillDirection = 'fill up'; }
        else { chosen = nearestBy(preCandidates, 'checkOutTs', trip.tripTs); fillDirection = 'fill down'; }
      } else if (preCandidates.length){
        chosen = nearestBy(preCandidates, 'checkOutTs', trip.tripTs); fillDirection = 'fill down';
      } else if (postCandidates.length){
        chosen = nearestBy(postCandidates, 'checkInTs', trip.tripTs); fillDirection = 'fill up';
      }
      if (chosen) pushDetail(chosen, trip, 'exception', fillDirection);
    });
  });

  const exceptions = [];
  salikRows.forEach(trip => {
    if (!seenTxIds.has(trip.transactionId)){
      const hadAnySessionForPlate = !!sessionsByPlate[trip.plate];
      exceptions.push({ type: hadAnySessionForPlate ? 'Outside any checkout window' : 'No checkout session for this plate',
        transactionId: trip.transactionId, plate: trip.plate, tripTs: trip.tripTs,
        amount: trip.amount, location: trip.location });
    }
  });

  const summaryMap = new Map();
  details.forEach(d => {
    const key = d.riderId + '|' + d.plate;
    if (!summaryMap.has(key)) summaryMap.set(key, { riderId: d.riderId, plate: d.plate, count: 0, totalAmount: 0 });
    const row = summaryMap.get(key);
    row.count += 1; row.totalAmount += d.amount;
  });
  const summary = Array.from(summaryMap.values()).sort((a,b) => b.count - a.count);

  const sessionRows = sessions.map(s => {
    const sKey = s.checkOutRef + '|' + s.itemId;
    return { itemId: s.itemId, itemType: s.itemType, riderId: s.riderId, checkOutTs: s.checkOutTs, checkInTs: s.checkInTs,
      open: s.open, tripsMatched: sessionTripCounts.get(sKey) || 0, note: s.note };
  }).sort((a,b) => b.checkOutTs - a.checkOutTs);

  return { summary, details, exceptions, sessions: sessionRows };
}

/* ===================== RENDERING ===================== */
const TAB_DEFS = {
  log: { sheet: 'Fleet log', cols: [
    {key:'ts', label:'Time', fmt: v => fmtTs(v)}, {key:'ref', label:'Ref'}, {key:'riderId', label:'Rider ID'},
    {key:'action', label:'Action', badge: v => v === 'Check Out' ? 'warn' : 'ok'},
    {key:'itemType', label:'Type'}, {key:'itemId', label:'Item ID'}
  ]},
  summary: { cols: [
    {key:'riderId', label:'Rider ID'}, {key:'plate', label:'Plate'},
    {key:'count', label:'Salik (Count)', num:true},
    {key:'totalAmount', label:'Amount (AED)', num:true, fmt: v => v.toFixed(2)}
  ]},
  details: { cols: [
    {key:'riderId', label:'Rider ID'}, {key:'plate', label:'Plate'}, {key:'itemId', label:'Item ID'},
    {key:'transactionId', label:'Transaction ID'}, {key:'tripTs', label:'Trip Date/Time', fmt: v => fmtTripTs(v)},
    {key:'amount', label:'Amount (AED)', num:true, fmt: v => v.toFixed(2)}, {key:'location', label:'Location'},
    {key:'matchType', label:'Match', fmt: v => v === 'proper' ? 'Proper' : 'Exception', badge: v => v === 'proper' ? 'ok' : 'warn'},
    {key:'fillDirection', label:'Assigned via', fmt: v => v === 'fill down' ? 'Fill down \u00b7 check-out person' : v === 'fill up' ? 'Fill up \u00b7 check-in person' : '\u2014'}
  ]},
  exceptions: { cols: [
    {key:'type', label:'Reason', badge: v => v.startsWith('No checkout') ? 'bad' : 'warn'},
    {key:'transactionId', label:'Transaction ID'}, {key:'plate', label:'Plate'},
    {key:'tripTs', label:'Trip Date/Time', fmt: v => fmtTripTs(v)},
    {key:'amount', label:'Amount (AED)', num:true, fmt: v => v.toFixed(2)}, {key:'location', label:'Location'}
  ]},
  sessions: { cols: [
    {key:'itemId', label:'Item ID'}, {key:'itemType', label:'Type'}, {key:'riderId', label:'Rider ID'},
    {key:'checkOutTs', label:'Check Out', fmt: v => fmtTs(v)}, {key:'checkInTs', label:'Check In', fmt: v => fmtTs(v)},
    {key:'tripsMatched', label:'Salik Trips', num:true},
    {key:'open', label:'Status', fmt: v => v ? 'still out' : 'closed', badge: v => v ? 'warn' : 'ok'}
  ]}
};

function fmtTs(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// same as fmtTs but keeps seconds \u2014 used for the merged Trip Date/Time column, since the
// source Salik PDF timestamps are precise to the second.
function fmtTripTs(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function renderResults(){
  $('#emptyResults').style.display = 'none';
  $('#resultsArea').style.display = 'flex';
  $('#tabNav').style.display = 'flex';
  $('#configRow').style.display = '';
  [['Log','log'],['Summary','summary'],['Details','details'],['Exceptions','exceptions'],['Sessions','sessions']]
    .forEach(([id,k]) => { $('#cnt' + id).textContent = state.results[k].length; });
  renderTable(state.activeTab, $('#searchBox').value);

  const hasPdf = state.salikRows.length > 0;
  $('#metaLeft').textContent = state.logRows.length + ' fleet log entries \u00b7 ' + state.sessions.length + ' checkout sessions' +
    (hasPdf ? ' \u00b7 ' + state.salikRows.length + ' trips from PDF \u00b7 ' + state.results.details.length + ' matched \u00b7 ' + state.results.exceptions.length + ' exceptions' : '');
  $('#metaRight').textContent = 'Updated ' + new Date().toLocaleString();
  if (hasPdf) showToast('Reconciled \u2014 ' + state.results.details.length + ' matched, ' + state.results.exceptions.length + ' exceptions.', 'success');
}

function renderTable(tabName, searchTerm){
  const def = TAB_DEFS[tabName];
  let rows = state.results[tabName].slice();

  if (searchTerm){
    const s = searchTerm.toLowerCase();
    rows = rows.filter(r => def.cols.some(c => String(c.fmt ? c.fmt(r[c.key]) : r[c.key]).toLowerCase().includes(s)));
  }

  const sortState = state.sort[tabName];
  if (sortState){
    rows.sort((a,b) => {
      const av = a[sortState.key], bv = b[sortState.key];
      let cmp;
      if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
      else cmp = String(av).localeCompare(String(bv));
      return sortState.dir === 'asc' ? cmp : -cmp;
    });
  }

  $('#rowCountLabel').textContent = rows.length + ' row' + (rows.length===1?'':'s');

  if (rows.length === 0){
    const needPdf = !searchTerm && state.salikRows.length === 0 && ['summary','details','exceptions'].includes(tabName);
    $('#tableHost').innerHTML = '<div class="empty-state"><i class="ti ti-mood-empty"></i>' + (needPdf ? 'Press + to add the Salik PDF.' : 'No rows' + (searchTerm ? ' match "' + escapeHtml(searchTerm) + '"' : ' yet') + '.') + '</div>';
    return;
  }

  let html = '<table class="log-table"><thead><tr>';
  def.cols.forEach(c => {
    let arrow = '';
    if (sortState && sortState.key === c.key) arrow = sortState.dir === 'asc' ? '&uarr;' : '&darr;';
    html += `<th data-key="${c.key}" data-tab="${tabName}">${c.label}<span class="arrow">${arrow}</span></th>`;
  });
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    def.cols.forEach(c => {
      let v = r[c.key];
      let display = c.fmt ? c.fmt(v) : v;
      if (c.badge){
        html += `<td><span class="badge ${c.badge(v)}">${escapeHtml(String(display))}</span></td>`;
      } else {
        html += `<td class="${c.num?'num':''}">${escapeHtml(String(display ?? ''))}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  $('#tableHost').innerHTML = html;

  $$('#tableHost thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key, tab = th.dataset.tab;
      const cur = state.sort[tab];
      let dir = 'asc';
      if (cur && cur.key === key && cur.dir === 'asc') dir = 'desc';
      state.sort[tab] = { key, dir };
      renderTable(tab, $('#searchBox').value);
    });
  });
}

/* ===================== EXPORT ===================== */
function toCsv(rows, cols){
  const header = cols.map(c => c.label).join(',');
  const lines = rows.map(r => cols.map(c => {
    let v = r[c.key];
    if (c.fmt) v = c.fmt(v);
    v = String(v ?? '');
    if (v.includes(',') || v.includes('"')) v = '"' + v.replace(/"/g,'""') + '"';
    return v;
  }).join(','));
  return [header, ...lines].join('\n');
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportActiveTabCsv(){
  const tab = state.activeTab;
  const def = TAB_DEFS[tab];
  const csv = toCsv(state.results[tab], def.cols);
  downloadFile('salik_' + tab + '_' + dateStamp() + '.csv', csv, 'text/csv');
  showToast('Exported ' + tab + '.csv', 'success');
}

function dateStamp(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

function exportAllXlsx(){
  const wb = XLSX.utils.book_new();
  ['summary','details','exceptions','sessions','log'].forEach(tab => {
    const def = TAB_DEFS[tab];
    const rows = state.results[tab];
    const aoa = [def.cols.map(c => c.label)];
    rows.forEach(r => { aoa.push(def.cols.map(c => { let v = r[c.key]; if (c.fmt) v = c.fmt(v); return v; })); });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, def.sheet || tab.charAt(0).toUpperCase()+tab.slice(1));
  });
  XLSX.writeFile(wb, 'salik_reconciliation_' + dateStamp() + '.xlsx');
  showToast('Exported salik_reconciliation_' + dateStamp() + '.xlsx', 'success');
}

/* ===================== SAVE TO GOOGLE SHEET =====================
 * Same method as dedEngine.html's saveBatch(): session comes from
 * sessionStorage('ap_session'), the Web App URL comes from the shared
 * API_URL constant (apiConfig.js), and rows are sent as an array of
 * arrays matching the target sheet's fixed column order \u2014 not as
 * column-keyed objects.
 *
 * ASSUMPTION \u2014 the 'salikDump' sheet's column order. I don't have that
 * schema, so this sends:
 *   Transaction ID | Rider ID | Plate | Item ID | Trip Date/Time | Amount |
 *   Location | Match Type | Assigned Via | Pushed At | Pushed By
 * Tell me the real column order for ap2_salikDump and I'll fix this array.
 */
function getSession() {
  try { return JSON.parse(sessionStorage.getItem('ap_session') || '{}'); } catch (_) { return {}; }
}

const SALIK_GS = { SHEET_NAME: 'salikDump', webAppUrl: (typeof API_URL !== 'undefined' ? API_URL : '') };

async function saveToSheet(){
  if (!SALIK_GS.webAppUrl){ showToast('API_URL is not available \u2014 check that apiConfig.js loaded.', 'error'); return; }

  // salikDump columns match the Trip Details rows, so always save those,
  // whichever tab is currently open.
  const rows = state.results.details;
  if (!rows || !rows.length){ showToast('No Trip Details rows to save \u2014 add the Salik PDF first.', 'error'); return; }

  const session = getSession();
  const pushedAt = new Date().toLocaleString('en-GB', { hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }).replace(',', '');
  const pushedBy = session.email || session.name || '';

  const gridRows = rows.map(r => [
    r.transactionId || '',
    r.riderId || '',
    r.plate || '',
    r.itemId || '',
    fmtTripTs(r.tripTs),
    typeof r.amount === 'number' ? r.amount : parseFloat(r.amount) || 0,
    r.location || '',
    r.matchType === 'proper' ? 'Proper' : r.matchType === 'exception' ? 'Exception' : (r.type || ''),
    r.fillDirection || '',
    pushedAt,
    pushedBy
  ]);

  const payload = {
    action:    'appendRows',
    type:      SALIK_GS.SHEET_NAME,
    sheetName: SALIK_GS.SHEET_NAME,
    sessionId: session.sessionId || '',
    token:     session.token || '',
    rows:      gridRows
  };

  const btn = $('#btnSaveSheet');
  const origHtml = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader spin"></i> Saving\u2026';
  try{
    const res = await fetch(SALIK_GS.webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const rawText = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}: ${rawText.slice(0,200)}`);
    let data;
    try { data = JSON.parse(rawText); }
    catch (e) { throw new Error('Apps Script returned non-JSON: ' + rawText.slice(0,300)); }
    if (data.status !== 'ok' && data.success !== true) throw new Error(data.message || data.error || JSON.stringify(data));

    showToast('\u2713 Saved ' + gridRows.length + ' Trip Details row(s) to Google Sheets (salikDump)', 'success');
  }catch(err){
    showToast('Save failed: ' + err.message, 'error');
  }finally{
    btn.disabled = false; btn.innerHTML = origHtml;
  }
}

/* ===================== EVENTS ===================== */
$('#pdfInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = ''; // lets the same file be picked again
  if (!file) return;
  showToast('Parsing PDF\u2026 this can take a few seconds for large reports.');
  try{
    const { rows, meta } = await parsePdf(file);
    state.salikRows = rows;
    state.pdfMeta = meta;
    $('#pdfRow').style.display = 'flex';
    const ip = $('#infoPdf');
    ip.textContent = file.name + ' \u2014 ' + rows.length + ' trips parsed' + (meta.totalTrips ? ' (PDF reports ' + meta.totalTrips + ')' : '');
    ip.className = 'v ' + (rows.length === meta.totalTrips ? 'ok' : 'warn');
    if (meta.accountNo){
      $('#acctRow').style.display = 'flex';
      $('#acctBadge').textContent = 'Acct ' + meta.accountNo + (meta.periodFrom ? ' \u00b7 ' + meta.periodFrom + '\u2013' + meta.periodTo : '');
    }
    activateTab('summary');
    recompute();
  }catch(err){
    showToast('Could not parse PDF: ' + err.message, 'error');
  }
});

// changing the reconciliation options re-runs automatically too
['#graceBefore', '#graceAfter', '#itemTypeFilter', '#exceptionAssignTo'].forEach(sel => {
  $(sel).addEventListener('change', recompute);
});

function activateTab(name){
  state.activeTab = name;
  $$('.tab-btn').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('#searchBox').value = '';
  renderTable(name, '');
}
$$('.tab-btn').forEach(tab => tab.addEventListener('click', () => activateTab(tab.dataset.tab)));

$('#searchBox').addEventListener('input', (e) => { renderTable(state.activeTab, e.target.value); });
$('#btnExportCsv').addEventListener('click', exportActiveTabCsv);
$('#btnExportXlsx').addEventListener('click', exportAllXlsx);
$('#btnSaveSheet').addEventListener('click', saveToSheet);

/* re-check for the cache when the user comes back to this tab */
window.addEventListener('focus', () => { if (state.addMode === 'off') probeCache(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.addMode === 'off') probeCache(); });

/* info popover */
const infoBtn = $('#btnInfo'), infoPop = $('#infoPop');
function toggleInfo(force){
  const show = force !== undefined ? force : !infoPop.classList.contains('show');
  infoPop.classList.toggle('show', show);
  infoBtn.setAttribute('aria-expanded', String(show));
}
infoBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleInfo(); });
document.addEventListener('click', (e) => { if (!infoPop.contains(e.target)) toggleInfo(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleInfo(false); });

/* ═══════════════════════════════════════════════════════
 *  INIT
 * ═══════════════════════════════════════════════════════ */
async function init(){
  setCacheStatus('checking', 'Checking for cache…');
  await probeCache(); // "+" becomes active once the cache is available; pressing it loads the cache
}
document.addEventListener('DOMContentLoaded', init);
</script>
