/* ═══════════ Ticket accessors ═══════════ */
function allTicketIds(){ return [...new Set(EVENTS.map(r=>r.ticketId))]; }
function ticketEvents(tid){ return EVENTS.filter(r=>r.ticketId===tid).sort((a,b)=>a.eventId-b.eventId); }
function ticketTimeline(tid){ return ticketEvents(tid); }
function master(tid){ return TICKET_MASTER[tid] || null; }
function isTerminal(status){ return status==='RESOLVED'; }
function ticketTitle(tid){ const m=master(tid); return (m && m.notes) || 'Untitled ticket'; }
// Same calendar day check as demo fast-forward's "now" (nowMs()), so this
// tracks the demo clock instead of real wall-clock time when it's been
// fast-forwarded.
function isSameCalendarDay(msA, msB){
  const a = dubaiParts(msA), b = dubaiParts(msB);
  return a.year===b.year && a.month===b.month && a.day===b.day;
}
// Tickets that: (1) this user either CREATED or DELEGATED (i.e. performed a
// TRANSFERRED event on — routing it to a department queue or straight to a
// person), (2) were marked RESOLVED today, (3) have the ticLog/Ticket
// "notify" column set to YES. Newest first. Event_ID doubles as an
// epoch-ms timestamp (see event-log parsing above), so the RESOLVED
// event's own eventId is used as its "done at" time.
function todaysNotifiableResolutions(userId){
  if(!userId) return [];
  const now = nowMs();
  const out = [];
  allTicketIds().forEach(tid=>{
    const m = master(tid);
    if(!m) return;
    const iCreated = m.createdBy===userId;
    const iDelegated = !iCreated && ticketEvents(tid).some(e=> e.action==='TRANSFERRED' && e.performedBy===userId);
    if(!iCreated && !iDelegated) return;
    let latestResolved = null;
    EVENTS.forEach(e=>{
      if(e.ticketId===tid && e.action==='RESOLVED' && (!latestResolved || e.eventId>latestResolved.eventId)) latestResolved = e;
    });
    if(!latestResolved) return;
    if(!isSameCalendarDay(latestResolved.eventId, now)) return;
    if(!notifyFlagFor(tid, latestResolved)) return;
    out.push({ticketId:tid, resolvedEvent:latestResolved, via: iCreated ? 'created' : 'delegated'});
  });
  out.sort((a,b)=>b.resolvedEvent.eventId - a.resolvedEvent.eventId);
  return out;
}
function ticketDescription(tid){
  const evs = ticketEvents(tid);
  const created = evs.find(e=>e.action==='CREATED');
  return (created && created.detail) || (master(tid) && master(tid).notes) || '';
}
// currentOwner(): the CURRENT, changing state of a ticket — status and who
// it's with come straight off the latest event row (no derivation/regex
// needed, the real log already carries Status per row). Fixed facts
// (Subject Employee/E2, Requester, original Priority) come from the
// ticket's master row and never change, exactly per the Fixed/Changing
// split in the requirement (§9).
function currentOwner(tid){
  const evs = ticketEvents(tid);
  if(!evs.length) return null;
  const latest = evs[evs.length-1];
  const m = master(tid) || {};
  return {
    status: latest.status || 'NEW',
    assignedTo: latest.to,
    performedBy: latest.performedBy,
    action: latest.action,
    eventId: latest.eventId,
    priority: m.priority || 'Medium',
    subjectId: m.subjectId || '',       // Subject Employee (E2) — fixed
    subjectType: m.subjectType || 'Employee',
    createdBy: m.createdBy || (evs[0] && evs[0].performedBy) || '',
  };
}

/* ═══════════ Activity-trail accessors — "I did X" / "my department did X"
   These read the whole event log for a given action, not just the
   ticket's current state, so a ticket you accepted or transferred still
   shows up here even after it's since moved on to someone else. ═══════════ */
function ticketsWhereIActed(actorId, action){
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=> e.action===action && e.performedBy===actorId)
  );
}
function ticketsWhereDeptActed(deptId, action){
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=>{
      if(e.action!==action) return false;
      const s = staff(e.performedBy);
      return s && s.dept===deptId;
    })
  );
}
function deptRaised(deptId){
  return allTicketIds().filter(tid=>{
    const m = master(tid);
    if(!m || !m.createdBy) return false;
    const s = staff(m.createdBy);
    return s && s.dept===deptId;
  });
}
// A TRANSFERRED event's `to` is either a department name (isDeptToken) or
// a person code/email — this is how "Transferred" (to a department queue)
// is split from "Delegated" (directly to a person).
function isTransferToDept(e){ return isDeptToken(e.to); }
function actedTransferred(actorId, kind){ // kind: 'dept' | 'person'
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=> e.action==='TRANSFERRED' && e.performedBy===actorId &&
      (kind==='dept' ? isTransferToDept(e) : !isTransferToDept(e)))
  );
}
function deptActedTransferred(deptId, kind){
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=>{
      if(e.action!=='TRANSFERRED') return false;
      const s = staff(e.performedBy);
      if(!s || s.dept!==deptId) return false;
      return kind==='dept' ? isTransferToDept(e) : !isTransferToDept(e);
    })
  );
}
// "Accepted" also absorbs anything I/my department Transferred or
// Delegated that has SINCE been accepted by the recipient — once accepted
// it's no longer sitting open under Transferred/Delegated, it moves here.
function myAccepted(u){
  const selfAccepted = ticketsWhereIActed(u.id,'ACCEPTED');
  const nowAccepted = [...actedTransferred(u.id,'dept'), ...actedTransferred(u.id,'person')]
    .filter(tid=> currentOwner(tid).status!=='NEW');
  return [...new Set([...selfAccepted, ...nowAccepted])];
}
// Transferred (by me) — anything I sent out, whether to a department queue
// or straight to a person, that's still sitting unclaimed.
function myTransferred(u){
  return [...actedTransferred(u.id,'dept'), ...actedTransferred(u.id,'person')]
    .filter(tid=> currentOwner(tid).status==='NEW');
}
// Delegated (to me) — anything someone else put directly in my hands (at
// creation or via a later transfer) that I haven't accepted yet.
function myDelegated(u){
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.status==='NEW' && o.assignedTo===u.id && o.performedBy!==u.id;
  });
}
function deptAccepted(deptId){
  const selfAccepted = ticketsWhereDeptActed(deptId,'ACCEPTED');
  const nowAccepted = [...deptActedTransferred(deptId,'dept'), ...deptActedTransferred(deptId,'person')]
    .filter(tid=> currentOwner(tid).status!=='NEW');
  return [...new Set([...selfAccepted, ...nowAccepted])];
}
function deptTransferred(deptId){ return deptActedTransferred(deptId,'dept').filter(tid=> currentOwner(tid).status==='NEW'); }
function deptDelegated(deptId){ return deptActedTransferred(deptId,'person').filter(tid=> currentOwner(tid).status==='NEW'); }
// Everything still open and relevant to a person — accepted or not — used
// for the nav badge count and the profile "Open" stat.
function openForMe(u){
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.assignedTo===u.id && !isTerminal(o.status);
  });
}
// "Attention" (My Portal tab) = tickets sitting with me by name that I
// haven't accepted yet — the moment I accept one it moves fully into
// "Accepted" below and drops out of this list (Done / Delegate / Transfer
// all live on the ticket from there).
function myAttention(u){
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.assignedTo===u.id && o.status==='NEW';
  });
}
// Department Attention = only what's still sitting unclaimed in the queue
// (no specific person assigned yet). The moment someone accepts one, it's
// assigned to them by name and moves to THEIR My Portal instead — a
// ticket needing attention lives in exactly one place, never both.
function openForDept(deptId){
  const d = dept(deptId);
  if(!d) return [];
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.status==='NEW' && deptNameOfTarget(o.assignedTo)===d.name;
  });
}
// Row label that makes it obvious whether a ticket is still sitting
// unclaimed (before ACCEPTED) or actively with someone (after).
function openRowSubLabel(tid){
  const o = currentOwner(tid);
  if(o.status==='NEW') return `Unclaimed — waiting in ${deptNameOfTarget(o.assignedTo)}`;
  return `With ${nameOf(o.assignedTo)}`;
}

/* ═══════════ Reminder engine (computed live from the event log) ═══════════
   A REMINDER event's Detail carries its own due date/time ("Reminder:
   10-Aug-2026 15:00"); Event_ID is deliberately NOT used for this — it's
   the flow-ordering timestamp, not necessarily wall-clock accurate far
   into a demo, whereas the Detail's due date is the actual commitment
   made on the ticket. A REMINDER is "live" (can go overdue) until either
   a REMINDER_ATTENDED, a newer REMINDER, or a terminal/hold status
   supersedes it. */
function latestLiveReminder(tid){
  const evs = ticketEvents(tid);
  let live = null;
  for(const e of evs){
    if(e.action==='REMINDER') live = e;
    else if(e.action==='REMINDER_ATTENDED') live = null;
  }
  return live;
}
function overdueInfo(tid){
  const owner = currentOwner(tid);
  if(!owner) return {overdue:false};
  if(isTerminal(owner.status) || owner.status==='ON HOLD') return {overdue:false};
  const r = latestLiveReminder(tid);
  if(!r) return {overdue:false};
  const dueAt = parseReminderDetail(r.detail);
  if(!dueAt) return {overdue:false};
  const now = nowMs();
  if(now < dueAt) return {overdue:false, dueAt};
  return {overdue:true, elapsed: now-dueAt, dueAt};
}
function tickReminderEngine(){
  if(demoOffsetMs<=0) return; // only once the demo clock has been fast-forwarded
  allTicketIds().forEach(tid=>{
    const od = overdueInfo(tid);
    if(!od.overdue) return;
    const evs = ticketEvents(tid);
    const last = evs[evs.length-1];
    if(last.action==='REMINDER_ALERT') return; // already alerted for this reminder
    fireReminderAlert(tid);
  });
}

/* ═══════════ Mutations (append-only) ═══════════
   Writes now persist to the real backend — the same Apps Script /exec
   endpoint auth.js and dataLayer.js already talk to for reads — instead of
   staying browser-local. Every mutation below:
     1. Builds + commits its event row into EVENTS/TICKET_MASTER immediately
        (optimistic — the UI never blocks on network latency), then paints it.
     2. Awaits postAction(), which POSTs to /exec with this session's
        sessionId/token (from window.Auth, set on login by the OpsDeck
        suite's own login.html).
     3. On success: leaves the optimistic row in place — the next real
        cache read will supersede it with the server's canonical row anyway.
     4. On failure: rolls the optimistic row back out, re-renders, and
        rethrows so the caller (a modal's Confirm handler, the New Ticket
        drawer's Submit) can surface the error and let the user retry. */
const API_BASE = 'https://script.google.com/macros/s/AKfycbwrHCi1-Ur0L3Rns8sAPNVLkRH4UIXAxt3t6tQB-rnjtBDIMZPzGf5PNCOwaDMZYClI/exec';

// One write call. Sent as text/plain (not application/json) so Apps
// Script's doPost never triggers a CORS preflight — the same trick
// auth.js's destroySession beacon already uses against this exact endpoint.
// sessionId/token ride on every write so the backend authenticates the
// call itself; the client-supplied actorId is a display convenience only,
// never the thing the server should trust for who-did-this.
async function postAction(action, payload){
  const creds = window.Auth && window.Auth.getCredentials ? window.Auth.getCredentials() : null;
  if(!creds || !creds.sessionId || !creds.token){
    throw new Error('Your session has expired — please sign in again.');
  }
  let res;
  try{
    res = await fetch(API_BASE, {
      method: 'POST',
      headers: {'Content-Type':'text/plain'}, // avoid CORS preflight against /exec
      body: JSON.stringify({action, sessionId:creds.sessionId, token:creds.token, ...payload}),
    });
  }catch(networkErr){
    throw new Error('Could not reach the server — check your connection and try again.');
  }
  if(!res.ok) throw new Error(`Server error (HTTP ${res.status}) on "${action}".`);
  let json;
  try{ json = await res.json(); }
  catch(e){ throw new Error(`Server returned an unreadable response for "${action}".`); }
  if(!json || json.success===false){
    throw new Error((json && (json.error||json.message)) || `Server rejected "${action}".`);
  }
  return json;
}

let seq = 0;
// Real backend Event_IDs aren't guaranteed to be JS Date.now()-ms values —
// they can use a different numeric scale (e.g. a YYYYMMDDHHMMSS-style
// stamp), which can land far above a real-time ms value. If a new local
// event's id were just "now", it could sort as OLDER than a ticket's own
// real Created row, and currentOwner() (which trusts the highest eventId)
// would then keep reading the ticket as still NEW even after Accept/Done/
// Delegate — which is exactly the bug this fixes. maxKnownEventId tracks
// the highest eventId seen from ANY source (real cache rows, synthesized
// rows, overlay rows) so every new local event is guaranteed to sort after
// all of them, regardless of what scale the backend's IDs use.
let maxKnownEventId = 0;
function trackMaxEventId(list){
  (list||[]).forEach(e=>{ const v = Number(e && e.eventId) || 0; if(v > maxKnownEventId) maxKnownEventId = v; });
}
function genEventId(){
  maxKnownEventId = Math.max(maxKnownEventId + 1, nowMs() + (seq++ % 900));
  return maxKnownEventId;
}
function nextTicketId(){
  let max = 5000;
  allTicketIds().forEach(tid=>{
    const m = String(tid).match(/(\d+)\s*$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'TK-' + (max+1);
}
function appendEvent({ticketId, action, status, from, performedBy, to, detail}){
  const row = {eventId:genEventId(), ticketId, action, status, from:from||'', performedBy:performedBy||'', to:to||'', detail:detail||'', local:true};
  EVENTS.push(row);
  LOCAL_EVENTS.push(row);
  saveOverlay();
  return row;
}
// Undo an appendEvent() — used when the matching server write fails, so a
// rejected mutation never leaves a "ghost" event behind in this browser.
function rollbackEvent(row){
  EVENTS = EVENTS.filter(e=>e!==row);
  LOCAL_EVENTS = LOCAL_EVENTS.filter(e=>e!==row);
  saveOverlay();
}

// Ticket creation: captures the fixed E2 (subjectEmployeeId) and lets the
// creator DELEGATE it straight to a department queue OR directly to a
// specific person in one step (requirement §5 vs §6, chosen at creation).
async function createTicket({creatorId, title, description, priority, subjectType, subjectEmployeeId, targetType, target, notifyOnDone}){
  const ticketId = nextTicketId();
  const ev = appendEvent({
    ticketId, action:'CREATED', status:'NEW',
    from:'', performedBy:creatorId, to:target,
    detail: description || title,
  });
  const m = {
    ticketId, creationEventId: ev.eventId, createdBy:creatorId,
    subjectType: subjectType||'Employee', subjectId: subjectEmployeeId,
    assignedToInitial: target, assignmentType: targetType==='department' ? 'DEPARTMENT' : 'PERSON',
    priority: priority||'Medium', notes: title, local:true,
    // "Notify me when done" toggle picked in the New Ticket drawer — stored
    // in the same notifyRaw slot the real ap2_ticLog cache's YES/NO column
    // would fill, so notifyFlagFor()/todaysNotifiableResolutions() treat a
    // locally-created ticket exactly like one that arrived from the cache.
    notifyRaw: notifyOnDone===false ? 'NO' : 'YES',
  };
  TICKET_MASTER[ticketId] = m;
  LOCAL_MASTERS[ticketId] = m;
  discoverDirectory(EVENTS, TICKET_MASTER);
  saveOverlay();
  safeRender(); // paint the new ticket immediately, before the server confirms
  try{
    await postAction('createTicket', {
      ticketId, eventId: ev.eventId, creatorId, title, description,
      priority: m.priority, subjectType: m.subjectType, subjectEmployeeId,
      targetType: m.assignmentType, target, notifyOnDone: m.notifyRaw,
    });
  }catch(err){
    rollbackEvent(ev);
    delete TICKET_MASTER[ticketId];
    delete LOCAL_MASTERS[ticketId];
    saveOverlay();
    discoverDirectory(EVENTS, TICKET_MASTER);
    safeRender();
    throw err;
  }
  return ticketId;
}

/* ═══════════ Identity — real login, not a switcher ═══════════
   Who's signed in comes from ap_session (written by the rest of the OpsDeck
   suite on login), exactly like the original OpsDeck.html — the log's
   role/department for that person is then resolved from the Users
   directory via metaFor(), same machinery the old "Acting as" bar used,
   just pinned to one real identity instead of being switchable. */
function _readSession(){
  try{
    const raw = sessionStorage.getItem('ap_session');
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    const s = Array.isArray(parsed) ? parsed[0] : parsed;
    if(!s || !s.email) return null;
    return s;
  }catch(e){ return null; }
}
// Fallback used only when this file is opened standalone (no ap_session yet)
// so the portal still renders something sensible while login is wired up —
// falls back to the first known user in the connected Users sheet.
const FALLBACK_SESSION = {};
let ME = null; // the signed-in staff id (email), set once at boot
function bootstrapIdentity(){
  const session = _readSession() || FALLBACK_SESSION;
  let email = String(session.email||'').trim();
  if(!email && USERS_LIST.length) email = USERS_LIST[0].email; // last-resort so the portal still renders
  const known = userFor(email);
  if(known) email = known.email; // normalize casing to match the real Users row
  return email || null;
}

/* ═══════════ Rendering ═══════════ */
// The Flow Finder Handler/Department single-select panels live inside
// the normal render tree (unlike the New Ticket drawer, which is appended
// straight to <body> and so survives a re-render untouched). That means an
// *unsolicited* re-render — the 15s auto-refresh below, or a background
// cache update landing mid-interaction — replaces the whole app.innerHTML
// while the panel is open, which can land exactly on a mousedown/click and
// make a checkbox appear to silently do nothing. A render triggered by the
// widget's own onchange (the user just checked a box) still needs to run
// to show the new chip — this guard is only for renders nobody asked for.
function flowMselOpenNow(){
  return state.view==='flow' && ['ffHandlerMsel','ffDeptMsel'].some(id => MSEL_UI[id] && MSEL_UI[id].open);
}
const app = document.getElementById('app');
// For *unsolicited* re-renders (background cache polling, the periodic
// timer below) — never for renders the widget itself asked for after a
// user action, which must still run so the UI reflects what they just did.
function safeRender(){
  if(flowMselOpenNow()) return;
  render();
}
function render(){
  tickReminderEngine();
  if(!state.currentUserId) state.currentUserId = ME || (STAFF.length ? STAFF[0].id : null);
  const u = currentUser();
  if(!u){
    app.innerHTML = `<div class="topbar"><div class="topbar-row1"><div class="brand"><span class="dot"></span>OpsDeck</div></div></div>
      <div class="page"><div class="empty"><b>Waiting on data.</b>No staff codes discovered from ap2_ticLog yet.</div></div>`;
    return;
  }
  app.innerHTML = `
    ${renderTopbar(u)}
    <div class="page">${renderView(u)}</div>
  `;

}
// Keeps --topbar-h in sync with the real rendered topbar (it can be one or
// two rows depending on viewport width / how many nav tabs wrap), so the
// New Ticket drawer — and anything else pinned under the topbar — sits
// right below it instead of overlapping it or guessing a fixed height.
function syncTopbarHeight(){
  const bar = document.querySelector('.topbar');
  if(!bar) return;
  document.documentElement.style.setProperty('--topbar-h', bar.offsetHeight + 'px');
}
window.addEventListener('resize', ()=>{ syncTopbarHeight(); });
// Cache reads (Users, ap2_employee) finish asynchronously and can land after
// the New Ticket drawer is already open. Follows docPortal's
// _refreshOpenDropdowns()/filterDrop() method: a live cache update never
// rebuilds the whole form. It patches only the piece(s) that are backed by
// that cache, in place — same input/list DOM nodes, same focus, same
// mid-interaction state — instead of replacing drawerBody.innerHTML wholesale.
// That whole-body rebuild was the bug: a cache update landing mid-click blew
// away the open Subject Employee list before the click could register, which
// looked like the dropdown "opening and closing" with nothing selected.
function refreshOpenDrawer(){
  const drawer = document.getElementById('ticketDrawer');
  const u = currentUser();
  if(!drawer || !u) return;

  // ap2_employee cache: mirrors docPortal's emp/bike dropdowns — if the
  // Subject Employee list is currently open, just re-filter it against the
  // latest EMPLOYEES with whatever's already typed (same pattern as
  // docPortal's `filterDrop(mode, document.getElementById(mode+'-search').value)`).
  // The input keeps its value and focus; nothing about the user's
  // in-progress click or keystroke is disturbed.
  const empInput = document.getElementById('ntSubjectInput');
  const empList = document.getElementById('ntSubjectList');
  if(empList && empList.classList.contains('open')){
    filterEmpDrop(empInput ? empInput.value : '');
  }
  // Cache-status ping: patched in place too, same as docPortal's
  // _updateCacheStatus() touching just the #cache-status dot/tooltip.
  const ping = drawer.querySelector('.cache-ping');
  if(ping){
    ping.classList.toggle('ok', EMPLOYEE_CACHE_OK);
    ping.classList.toggle('warn', !EMPLOYEE_CACHE_OK);
    ping.title = EMPLOYEE_CACHE_OK
      ? 'Employee roster loaded from ap2_employee cache'
      : 'ap2_employee cache unavailable — no employee roster loaded';
  }

  // Ticket-cache-derived department/person options: same non-destructive
  // refilter as the Subject Employee field above — if the "Route to" list
  // is currently open, re-run the filter against the latest
  // activeDeptOptions()/activePersonOptions() with whatever's already
  // typed. The input keeps its value and focus either way.
  const targetInput = document.getElementById('ntTargetInput');
  const targetList = document.getElementById('ntTargetList');
  if(targetList && targetList.classList.contains('open')){
    filterTargetDrop(targetInput ? targetInput.value : '');
  }
}

function ticketRow(tid, opts={}){

// ----- My Portal -----
function raisedByMe(u){
  // Tickets this person created (ticLog's Created_By), regardless of who
  // currently owns them — separate from "assigned to me now" below, so a
  // ticket doesn't just vanish from view the moment it's accepted/
  // transferred elsewhere.
  return allTicketIds().filter(tid=>{
    const m = master(tid);
    return m && m.createdBy===u.id;
  }).sort((a,b)=> currentOwner(b).eventId - currentOwner(a).eventId);
}
function activityRow(tid){
  // For "I accepted" / "I transferred" lists: state is about what happened
  // on the ticket, so show where it stands now rather than the default
  // "With X" (which would just repeat the current owner regardless of
  // whether it's still with the person viewing this list).
  const o = currentOwner(tid);
  return ticketRow(tid, {subLabel: isTerminal(o.status) ? `Resolved` : openRowSubLabel(tid)});
}
function renderMyPortal(u){
  const filter = state.myStatusFilter;
  const byEventDesc = (a,b)=> currentOwner(b).eventId - currentOwner(a).eventId;
  // "Attention" = tickets with me by name that I haven't accepted yet.
  // Once accepted, a ticket moves out of Attention and lives in Accepted
  // from then on — that's where Done / Delegate / Transfer happen.
  const sections = {
    attention: myAttention(u).slice().sort(byEventDesc),
    raised: raisedByMe(u).slice().sort(byEventDesc),
    accepted: myAccepted(u).sort(byEventDesc),
    transferred: myTransferred(u).sort(byEventDesc),
    delegated: myDelegated(u).sort(byEventDesc),
  };

  const body = filter==='all'
    ? mergedTicketList(sections)
    : (sections[filter] && sections[filter].length
        ? `<div class="ticket-list">${sections[filter].map(t=>activityRow(t)).join('')}</div>`
        : `<div class="empty"><b>Nothing here.</b>No tickets in ${categoryFilterLabel(filter)} right now.</div>`);

  return `
  <h1 class="page-title">My Portal</h1>
  <p class="page-sub">Tickets relevant to you, grouped by where they stand. Tap one to see the full timeline and respond.</p>
  ${categoryFilterBar(filter, 'mystatus')}
  ${body}
  `;
}

// "All" used to repeat every category (Attention/Raised/Accepted/
// Transferred/Delegated) as its own labelled sub-section — a ticket that's
// e.g. both something I raised AND currently have accepted showed up twice.
// This instead flattens every category into one deduped list, newest first,
// same as picking any single filter pill.
function mergedTicketList(sections){
  const seen = new Set();
  const ids = [];
  Object.values(sections).forEach(list=>{
    list.forEach(tid=>{ if(!seen.has(tid)){ seen.add(tid); ids.push(tid); } });
  });
  if(!ids.length) return `<div class="empty">Nothing here yet.</div>`;
  ids.sort((a,b)=> currentOwner(b).eventId - currentOwner(a).eventId);
  return `<div class="ticket-list">${ids.map(t=>activityRow(t)).join('')}</div>`;
}

function profileCard(u, extraClass=''){
  const d = u.dept ? dept(u.dept) : null;
  const openCt = openForMe(u).length;

    const o=currentOwner(tid); return o && o.assignedTo===u.id && isTerminal(o.status);

  const roleName = (userFor(u.id) && userFor(u.id).roleTitle) || (isGM(u.id) ? 'General Manager' : isManager(u.id) ? 'Manager' : 'Worker');

/* ═══════════ Flow Finder — Ticket, Subject Employee, Handler,
   Department, Status, Date range (requirement §10) */
function ticketTouchesDept(tid, deptIdOrName){
  const d = dept(deptIdOrName) || deptByName(deptIdOrName);
  if(!d) return false;
  return ticketEvents(tid).some(e=> deptNameOfTarget(e.to)===d.name || deptNameOfTarget(e.from)===d.name)
    || (d.id!=null && deptWorkers(d.id).some(w=> ticketEvents(tid).some(e=>e.performedBy===w.id || e.to===w.id)));
}
function uniqueSubjectEmployees(){
  const seen = new Set();
  Object.values(TICKET_MASTER).forEach(m=>{ if(m.subjectId) seen.add(m.subjectId); });
  return [...seen].sort();
}
function uniqueHandlers(){
  const seen = new Set();
  EVENTS.forEach(e=>{ if(isStaffCode(e.performedBy)) seen.add(e.performedBy); if(isStaffCode(e.to)) seen.add(e.to); });
  return [...seen].sort();
}

function ticketNumOf(tid){
  const m = String(tid||'').match(/(\d+)/);
  return m ? parseInt(m[1],10) : 0;
}

// Both Flow Finder popovers (category list, date range) live inside
// .ff-toolbar, which scrolls horizontally when the row is too wide for
// the screen. An absolutely-positioned panel would get clipped by that
// scroll container, so the panels are `position:fixed` in CSS and have
// their on-screen spot computed here from the trigger's real position —
// fixed elements aren't clipped by an ancestor's overflow, so the panel
// stays fully visible no matter how far the toolbar has scrolled.
function positionFfPanel(triggerEl, panelEl, align){
  if(!triggerEl || !panelEl) return;
  const r = triggerEl.getBoundingClientRect();
  const vw = window.innerWidth;
  panelEl.style.top = (r.bottom + 6) + 'px';
  const pw = panelEl.offsetWidth || 240;
  let left = align==='right' ? (r.right - pw) : r.left;
  left = Math.max(8, Math.min(left, vw - pw - 8));
  panelEl.style.left = left + 'px';
}
// Closes whichever Flow Finder popover is open when its scroll-anchor
// moves out from under it (toolbar scrolled horizontally, or the page
// itself scrolled/resized) instead of leaving it floating in the wrong
// spot — simpler and less jarring than re-tracking it live.
function ffPanelScrollGuard(){
  let closed = false;
  if(mselState('ffCatSel').open){ mselState('ffCatSel').open = false; mselState('ffCatSel').q=''; closed = true; }
  if(state.ffDateOpen){ state.ffDateOpen = false; closed = true; }
  if(closed) render();
}
function wireFfCategorySelect(){
  const id = 'ffCatSel';
  const root = document.getElementById(id);
  if(!root) return;
  const toggle = root.querySelector('[data-ffcat-toggle]');
  if(toggle) toggle.onclick = (e)=>{
    e.stopPropagation();
    const st = mselState(id);
    const wasOpen = st.open;
    mselCloseAllExcept(id);
    st.open = !wasOpen;
    if(!st.open) st.q = '';
    render();
    if(st.open){
      document.addEventListener('mousedown', mselOutsideHandler, true);
      setTimeout(()=>{ const inp = document.getElementById(id+'-search'); if(inp) inp.focus(); }, 0);
    }
  };
  const panel = root.querySelector('[data-ffcat-panel]');
  if(panel){
    panel.onmousedown = (e)=> e.stopPropagation();
    positionFfPanel(toggle, panel, 'left');
  }
  root.querySelectorAll('[data-ffcat-option]').forEach(opt=>{
    opt.onclick = (e)=>{
      e.stopPropagation();
      const val = opt.dataset.ffcatOption;
      if(val !== state.ffMode){
        state.ffMode = val; state.ffQuery=''; state.ffMulti=[]; state.ffSelectedTicket=null;
        // ffFrom/ffTo deliberately left alone — the date range is now
        // universal and should survive a category switch.
      }
      mselState(id).open = false;
      mselState(id).q = '';
      render();
    };
  });
  const search = document.getElementById(id+'-search');
  if(search) search.oninput = ()=>{ mselState(id).q = search.value; render(); };
}
function ffDateOutsideHandler(e){
  const wrap = document.getElementById('ffDateFilter');
  if(wrap && wrap.contains(e.target)) return;
  state.ffDateOpen = false;
  document.removeEventListener('mousedown', ffDateOutsideHandler, true);
  render();
}
function wireFfDateFilter(){
  const btn = document.querySelector('[data-ffdate-toggle]');
  if(btn) btn.onclick = (e)=>{
    e.stopPropagation();
    state.ffDateOpen = !state.ffDateOpen;
    render();
    if(state.ffDateOpen) document.addEventListener('mousedown', ffDateOutsideHandler, true);
  };
  const panel = document.querySelector('[data-ffdate-panel]');
  if(panel){
    panel.onmousedown = (e)=> e.stopPropagation();
    positionFfPanel(btn, panel, 'right');
  }
  const clearBtn = document.querySelector('[data-ffdate-clear]');
  if(clearBtn) clearBtn.onclick = (e)=>{ e.stopPropagation(); state.ffFrom=''; state.ffTo=''; render(); };
}
// Toolbar is a fresh DOM node every render, so its scroll listener needs
// re-attaching each time; the window resize listener only needs adding
// once (window persists across renders).
let _ffResizeGuardAttached = false;
function wireFfToolbarScrollGuard(){
  const toolbar = document.querySelector('.ff-toolbar');
  if(toolbar) toolbar.onscroll = ffPanelScrollGuard;
  if(!_ffResizeGuardAttached){
    window.addEventListener('resize', ffPanelScrollGuard);
    _ffResizeGuardAttached = true;
  }
}
// Flow Finder's own result row — same data as ticketRow() but with the
// ticket number pinned to the left as a badge (results are always sorted
// newest-ticket-first), used only inside Flow Finder so every other
// ticket list in the app keeps its original row layout untouched.
function flowTicketRow(tid){
  const owner = currentOwner(tid);
  const title = ticketTitle(tid);
  const od = overdueInfo(tid);
  return `
  <div class="ticket-row" data-open-ticket="${tid}">
    <div class="ff-tid-badge">#${escHtml(tid)}</div>
    <div class="pri-flag pri-${owner.priority}"></div>
    <div class="t-main">
      <div class="t-title">${escHtml(title)} ${owner.subjectType?`<span class="type-chip">${escHtml(owner.subjectType)}</span>`:''}</div>
      <div class="t-sub">For ${owner.subjectId ? nameOf(owner.subjectId) : '—'} · With ${nameOf(owner.assignedTo)} · raised by ${nameOf(owner.createdBy)}</div>
    </div>
    ${od.overdue ? `<div class="overdue-flag">⚠ overdue ${fmtDur(od.elapsed)}</div>` : ''}
    <div class="status-chip ${statusClass(owner.status)}">${statusDisplayLabel(owner.status)}</div>
  </div>`;
}
function renderFlowFinder(u){
  const scoped = isManager(u.id) && u.dept;
  let matches = [];

  if(state.ffMode==='ticket'){
    matches = allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      if(!state.ffQuery) return true;
      const q = state.ffQuery.toLowerCase();
      if(String(tid).toLowerCase().includes(q)) return true;
      if(ticketTitle(tid).toLowerCase().includes(q)) return true;
      const m = master(tid);
      if(m && m.subjectId && m.subjectId.toLowerCase().includes(q)) return true;
      return ticketEvents(tid).some(e=>
        nameOf(e.to).toLowerCase().includes(q) || nameOf(e.performedBy).toLowerCase().includes(q)
      );
    });
  } else if(state.ffMode==='subjectEmployee'){
    matches = state.ffQuery ? allTicketIds().filter(tid=>{
      const m = master(tid); return m && m.subjectId===state.ffQuery;
    }) : [];
  } else if(state.ffMode==='handler'){
    matches = state.ffMulti.length ? allTicketIds().filter(tid=>{
      return ticketEvents(tid).some(e=> state.ffMulti.includes(e.performedBy) || state.ffMulti.includes(e.to));
    }) : [];
  } else if(state.ffMode==='department'){
    // Every user with a home department is scoped to it here — not just
    // managers — so "Department" always opens straight onto every ticket
    // that has touched their own department. Only users without a
    // department (e.g. GM) get the picker, and even then it's one
    // department at a time.
    const targetDeptIds = u.dept ? [u.dept] : state.ffMulti;
    matches = targetDeptIds.length ? allTicketIds().filter(tid=> targetDeptIds.some(id=>ticketTouchesDept(tid, id))) : [];
  } else if(state.ffMode==='status'){
    // Shows every (in-scope) ticket until a status is picked, then narrows.
    matches = allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      if(!state.ffQuery) return true;
      return currentOwner(tid).status===state.ffQuery;
    });
  }

  // Date range used to be its own mode ("Date range") that replaced whatever
  // other filter was active. It's now a standing refinement — available
  // under every category at once instead of a separate subtab item — so it
  // runs here, after the mode-specific matches, on top of whichever
  // category produced them.
  if(state.ffFrom || state.ffTo){
    const fromMs = state.ffFrom ? new Date(state.ffFrom+'T00:00:00').getTime() : null;
    const toMs = state.ffTo ? new Date(state.ffTo+'T23:59:59').getTime() : null;
    matches = matches.filter(tid=>{
      const created = ticketEvents(tid)[0];
      if(!created) return false;
      if(fromMs && created.eventId < fromMs) return false;
      if(toMs && created.eventId > toMs) return false;
      return true;
    });
  }

  const sortedMatches = matches.slice().sort((a,b)=> ticketNumOf(b) - ticketNumOf(a));
  const resultsHtml = sortedMatches.length ? sortedMatches.map(t=>flowTicketRow(t)).join('') :
    `<div class="empty"><b>No matches.</b>Try a different search.</div>`;

  // Same source as the "+" New Ticket window's dropdowns (activeDeptOptions
  // / activePersonOptions, the active Users cache) — not just whoever
  // happens to already appear in the ticket log.
  const handlerOptions = activePersonOptions().filter(p => !u.dept || (dept(u.dept) && p.deptName && p.deptName.toLowerCase()===dept(u.dept).name.toLowerCase()));
  const departmentOptions = activeDeptOptions();

  let queryControl;
  if(state.ffMode==='ticket'){
    queryControl = `<input type="text" id="ffQuery" placeholder="Search by ticket #, title, or Subject Employee (E-code)…" value="${state.ffQuery.replace(/"/g,'&quot;')}">`;
  } else if(state.ffMode==='subjectEmployee'){
    // Sourced from the ap2_employee cache (same roster + same search-box
    // pattern as the New Ticket "+" drawer's Subject Employee field),
    // instead of only whatever E-codes already happen to appear in tickets.
    queryControl = `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;">
      ${ffSubjDropShell()}
      <span class="cache-ping ${EMPLOYEE_CACHE_OK?'ok':'warn'}" title="${EMPLOYEE_CACHE_OK?'Employee roster loaded from ap2_employee cache':'ap2_employee cache unavailable — no employee roster loaded'}" style="flex-shrink:0;margin-left:0;margin-right:10px;"></span>
    </div>`;
  } else if(state.ffMode==='handler'){
    const opts = handlerOptions.map(p=>({value:p.email, label:p.name, sub:p.email}));
    queryControl = `<div style="flex:1;">${renderMultiSelect('ffHandlerMsel', opts, state.ffMulti, {
      single:true,
      placeholder: opts.length ? 'Select a handler…' : (u.dept ? 'No handlers in your department yet' : 'No handlers yet'),
      searchPlaceholder:'Search by name or email…'
    })}</div>`;
  } else if(state.ffMode==='department'){
    queryControl = u.dept
      ? `<div class="hint">Showing every ticket for ${dept(u.dept).name} — your department.</div>`
      : `<div style="flex:1;">${renderMultiSelect('ffDeptMsel', departmentOptions.map(d=>({value:d.name, label:d.name})), state.ffMulti, {
          single:true,
          placeholder: departmentOptions.length ? 'Select a department…' : 'No departments yet',
          searchPlaceholder:'Search departments…'
        })}</div>`;
  } else if(state.ffMode==='status'){
    queryControl = `<select id="ffQuery">
      <option value="">All statuses</option>
      ${TICKET_STATUSES.map(v=>`<option value="${v}" ${state.ffQuery===v?'selected':''}>${statusDisplayLabel(v)}</option>`).join('')}
    </select>`;
  }

  return `
  ${!SUBJECT_EMPLOYEE_COLUMN_SEEN ? `<div class="empty" style="text-align:left;padding:12px 14px;margin-bottom:14px;border-color:var(--amber-dim);">
    <b style="color:var(--amber);font-size:13px;">No Subject Employee (E2) values found yet.</b>
    The connected ticLog master rows have a Subject_ID column, but nothing in it is filled in yet — searches by Subject Employee won't return anything until a ticket carries one.
  </div>` : ''}
  <div class="ff-header-row">
    <h1 class="page-title">Flow Finder</h1>
    <div class="ff-filters-col">
      <div class="ff-caption">
        <span class="ff-cap-icon">${FF_CAT_ICONS[state.ffMode]||''}</span>
        Searching by <strong>${escHtml(ffCategoryLabel(state.ffMode))}</strong>${(state.ffFrom||state.ffTo) ? ` <span class="ff-cap-dates">· ${escHtml(state.ffFrom||'any date')} → ${escHtml(state.ffTo||'any date')}</span>` : ''}
      </div>
      <div class="ff-toolbar">
        <div class="ff-toolbar-scroll">
          <div class="ff-searchbox">
            ${renderFfCategorySelect()}
            <span class="ff-box-divider"></span>
            <div class="ff-query-wrap">${queryControl}</div>
          </div>
          ${renderFfDateFilter()}
        </div>
      </div>
    </div>
  </div>
  ${state.ffSelectedTicket ? renderTimelineView(state.ffSelectedTicket, u) : `<div class="ff-results">${resultsHtml}</div>`}
  `;
}

/* ═══════════ Flow Finder "Subject Employee" search dropdown ═══════════
   Same plain search-box + highlighted list pattern as the New Ticket "+"
   drawer's Subject Employee field (empSearchDropShell et al.), pulling
   from the same ap2_employee cache (EMPLOYEES) — kept as its own set of
   functions/DOM ids so the New Ticket drawer code above is untouched. */
function ffSubjSelectedLabel(){
  const id = state.ffQuery;
  if(!id) return '';
  const e = EMPLOYEES.find(x=>String(x.id)===String(id));
  return e ? employeeLabel(e) : id;
}
function ffSubjDropShell(){
  return `
  <div class="emp-drop" id="ffSubjectDrop">
    <input type="text" class="emp-drop-input" id="ffSubjectInput" autocomplete="off"
      placeholder="${EMPLOYEES.length?'Search by ID or name…':'No employees in cache'}"
      value="${escAttr(ffSubjSelectedLabel())}">
    <div class="dropdown-list" id="ffSubjectList"></div>
  </div>`;
}
function filterFfSubjDrop(q){
  const list = document.getElementById('ffSubjectList');
  if(!list) return;
  const lq = q.toLowerCase().trim();
  const hits = (lq ? EMPLOYEES.filter(e=>String(e.id).toLowerCase().includes(lq)||e.name.toLowerCase().includes(lq)) : EMPLOYEES).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!EMPLOYEES.length){
    html = `<div class="di no-match">No employees in cache</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No employees found</div>`;
  }else{
    html = hits.map(e=>`<div class="di" data-ff-emp-id="${escAttr(e.id)}">
        <div class="dn">${hl(e.name)}</div>
        <div class="ds">ID: ${hl(String(e.id))}</div>
      </div>`).join('');
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ffSubjectDrop'); if(wrap) wrap.classList.add('open');
}
function openFfSubjDrop(){
  const input = document.getElementById('ffSubjectInput');
  filterFfSubjDrop(input ? input.value : '');
}
function closeFfSubjDrop(){
  const list = document.getElementById('ffSubjectList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ffSubjectDrop'); if(wrap) wrap.classList.remove('open');
}
function selectFfSubjDrop(id){
  state.ffQuery = String(id);
  closeFfSubjDrop();
  render();
}

function kindOfAction(action){
  if(action==='CREATED') return 'created';
  if(action==='TRANSFERRED' || action==='ASSIGNED') return 'forward';
  if(action==='ACCEPTED') return 'accept';
  if(action==='ON_HOLD') return 'hold';
  if(action==='RESUMED') return 'resume';
  if(action==='COMMENT') return 'comment';
  if(action==='REMINDER' || action==='REMINDER_ALERT') return 'reminder';
  if(action==='REMINDER_ATTENDED') return 'result';
  if(action==='RESOLVED') return 'resolved';
  return 'forward';
}
function kindIcon(k){
  return {created:'◆', forward:'→', accept:'✓', hold:'⏸', resume:'▶', comment:'💬', reminder:'⏰', result:'↩', resolved:'✓'}[k] || '•';
}

function renderTimelineView(tid, u){
  const rows = ticketTimeline(tid);
  const m = master(tid);
  const owner = currentOwner(tid);
  let items = '';
  rows.forEach((r,i)=>{
    const k = kindOfAction(r.action);
    const gap = i>0 ? fmtDur(r.eventId - rows[i-1].eventId) : null;
    const whoLine = `${nameOf(r.performedBy)}${r.to && r.to!==r.performedBy ? ` → ${nameOf(r.to)}` : ''}`;
    items += `
    <div class="tl-item k-${k}">
      ${gap ? `<div class="tl-gap">+${gap}</div>` : ''}
      <div class="tl-dot">${kindIcon(k)}</div>
      <div class="tl-card">
        <div class="tl-head">
          <span class="tl-action">${actionLabel(r.action)}</span>
          <span class="tl-ts">${fmtTs(r.eventId)}</span>
        </div>
        <div class="tl-who">${whoLine} · <span class="status-chip ${statusClass(r.status)}" style="padding:1px 7px;font-size:10px;">${statusDisplayLabel(r.status)}</span></div>
        ${r.detail ? `<div class="tl-notes">${escHtml(r.detail)}</div>` : ''}
      </div>
    </div>`;
  });
  const backLabel = state.ffReturnView ? `← Back to ${viewLabel(state.ffReturnView)}` : '← Back to results';
  return `
  <button class="btn btn-ghost btn-sm" id="ffBack">${backLabel}</button>
  <div class="card" style="margin-top:12px;">
    <div class="kicker">Ticket #${tid}</div>
    <h2 style="font-family:var(--font-display);margin:0 0 4px;">${escHtml(ticketTitle(tid))}</h2>
    <p class="page-sub" style="margin-bottom:2px;">
      <b style="color:var(--text-dim);">Subject Employee (E2):</b> ${owner.subjectId ? nameOf(owner.subjectId) : '<span style="color:var(--red);">not recorded</span>'}
      &nbsp;·&nbsp; Requester: ${owner.createdBy ? nameOf(owner.createdBy) : '—'}
      &nbsp;·&nbsp; Priority: ${owner.priority}
    </p>
    <p class="page-sub" style="margin-bottom:0;">Every logged event for this ticket, oldest to newest. Event_ID doubles as the timestamp (down to the second).</p>
    <div class="tl-wrap"><div class="timeline">${items}</div></div>
  </div>
  ${renderRespondPanel(tid, u)}
  `;
}

/* ═══════════ Respond panel — permission gate covers every real action:
   Accept (from a dept queue or a direct hand-off), Comment, Hold/Resume,
   Set/Attend Reminder, Transfer (to dept or delegate to a person),
   Resolve. */
function respondPermission(tid, u){
  const owner = currentOwner(tid);
  if(!owner) return {mode:'none'};
  if(isTerminal(owner.status)) return {mode:'none'};
  if(isGM(u.id)) return {mode:'none'}; // GM: read-only oversight
  if(owner.status==='NEW'){
    if(owner.createdBy===u.id) return {mode:'none'}; // creator can't accept their own ticket
    const target = owner.assignedTo;
    if(isDeptToken(target)){
      const td = deptByName(target);
      if(isManager(u.id) && u.dept && td && td.id===u.dept) return {mode:'accept-dept'};
      if(!isManager(u.id) && u.dept && td && td.id===u.dept) return {mode:'accept-dept'};
      return {mode:'none'};
    }
    if(target===u.id) return {mode:'accept-direct'};
    return {mode:'none'};
  }
  if(owner.assignedTo===u.id){
    return {mode:'full', ticketStatus:owner.status};
  }
  const ownerStaff = staff(owner.assignedTo);
  if(isManager(u.id) && u.dept && ownerStaff && ownerStaff.dept===u.dept){
    return {mode:'oversee'};
  }
  return {mode:'none'};
}

function renderRespondPanel(tid, u){
  const perm = respondPermission(tid, u);
  const owner = currentOwner(tid);
  if(perm.mode==='none') return '';
  if(perm.mode==='accept-dept' || perm.mode==='accept-direct'){
    return `
    <div class="card" style="margin-top:14px;">
      <div class="section-label" style="margin-top:0;">New ticket — accept it?</div>
      <p class="hint" style="margin-bottom:10px;">${perm.mode==='accept-dept' ? `Unclaimed in ${nameOf(owner.assignedTo)}. Any member of that department can accept it.` : `Directly transferred to you. Accept it to start working, or hand it off again.`}</p>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" data-respond="accept" data-tid="${tid}">Accept</button>
      </div>
    </div>`;
  }
  if(perm.mode==='oversee'){
    return `
    <div class="card" style="margin-top:14px;">
      <div class="section-label" style="margin-top:0;">Manager oversight</div>
      <p class="hint" style="margin-bottom:10px;">Currently with ${nameOf(owner.assignedTo)}. You can transfer it within ${u.dept ? dept(u.dept).name : 'your team'}.</p>
      <div class="btn-row">
        <button class="btn btn-sm" data-respond="delegate" data-tid="${tid}">Reassign</button>
      </div>
    </div>`;
  }
  // full: owner === current actor
  return `
  <div class="card" style="margin-top:14px;">
    <div class="section-label" style="margin-top:0;">Respond to this ticket</div>
    <div class="btn-row">
      ${owner.status==='ON HOLD' ? `<button class="btn btn-primary btn-sm" data-respond="resume" data-tid="${tid}">Resume</button>` : ''}
      <button class="btn btn-amber btn-sm" data-respond="reminder" data-tid="${tid}">Set reminder</button>
      ${overdueInfo(tid).overdue ? `<button class="btn btn-sm" data-respond="attend" data-tid="${tid}">Attend reminder</button>` : ''}
      <button class="btn btn-sm" data-respond="delegate" data-tid="${tid}">Delegate</button>
      <button class="btn btn-primary btn-sm" data-respond="resolve" data-tid="${tid}">Done</button>
    </div>
  </div>`;
}

// ----- Org Overview (GM) -----
// Every ticket, org-wide, whose latest reminder has gone overdue and
// hasn't been attended yet — no department scoping, no status filter.
// This is what "Pending" means for GM/CEO/CFO/Head-tier oversight: things
// that were promised a follow-up and haven't gotten one.
function orgPendingTickets(){
  return allTicketIds().filter(tid => overdueInfo(tid).overdue);
}
function renderOrgOverview(u){
  const pending = orgPendingTickets();
  const groups = DEPARTMENTS.map(d=>{
    const tids = allTicketIds().filter(tid=> deptNameOfTarget(currentOwner(tid).assignedTo)===d.name);
    return {dept:d, tids};
  });
  return `
  <h1 class="page-title">Org Overview</h1>
  <p class="page-sub">Read-only view across every department's tickets, wherever they currently sit — nothing here is filtered by department or status. Use Flow Finder to inspect any of them in detail.</p>
  <div class="section-label" style="color:var(--red);">Pending — reminders triggered, not yet attended (${pending.length})</div>
  ${pending.length
    ? `<div class="ticket-list">${pending.map(t=>ticketRow(t, {subLabel:`With ${nameOf(currentOwner(t).assignedTo)} · ${deptNameOfTarget(currentOwner(t).assignedTo)}`})).join('')}</div>`
    : `<div class="empty">Nothing overdue across the whole org right now.</div>`}
  ${groups.map(g=>`
    <div class="section-label">${g.dept.name} (${g.tids.length})</div>
    ${g.tids.length ? `<div class="ticket-list">${g.tids.map(t=>ticketRow(t)).join('')}</div>` : `<div class="empty">Nothing currently in ${g.dept.name}.</div>`}
  `).join('')}
  `;
}
