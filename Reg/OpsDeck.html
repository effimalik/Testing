// ---------- "Ticket done" notification ----------
// Shown when a ticket the current user created gets marked Done
// (RESOLVED). Stays on screen (no auto-dismiss) until the user either
// clicks it — which jumps straight to that ticket's Flow Finder timeline —
// or dismisses it with the close (x) button.
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
function notifyTicketDone(ticketId){
  const wrap = document.getElementById('notifWrap');
  if(!wrap) return;
  const m = master(ticketId);
  const title = m && m.notes ? m.notes : ticketId;
  const el = document.createElement('div');
  el.className = 'notif-box';
  el.innerHTML = `
    <span class="notif-icon">${ICON_CHECK}</span>
    <span class="notif-body">
      <div class="notif-title">${escHtml(ticketId)} is now Done</div>
      <div class="notif-sub">${escHtml(title)} — click to view in Flow Finder</div>
    </span>
    <button type="button" class="notif-close" aria-label="Dismiss">✕</button>`;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.notif-close')){ el.remove(); return; }
    el.remove();
    openTicketInFlow(ticketId);
  });
  wrap.appendChild(el);
}

/* ═══════════ Respond modal — one modal, branches per action ═══════════ */
function openRespondModal(kind, tid){
  const actor = currentUser();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  const titles = {
    accept:'Accept ticket', resume:'Resume',
    reminder:'Set reminder', attend:'Attend reminder', delegate:'Delegate ticket',
    resolve:'Done',
  };
  let extra = '';
  let needsComment = true;
  // Delegate target-type toggle — same Department/Person pattern as the
  // New Ticket drawer's "Route to" pills.
  let delegateTargetType = 'department';
  function delegateTargetFieldHtml(type){
    if(type==='department'){
      const deptOpts = activeDeptOptions();
      return `<select id="rm-target">${deptOpts.map(d=>`<option value="${escAttr(deptIdFor(d.name))}">${escHtml(d.name)}</option>`).join('')}</select>`;
    }
    const people = activePersonOptions().filter(p=>p.email!==actor.id);
    return `<select id="rm-target">${people.map(p=>`<option value="${escAttr(p.email)}">${escHtml(p.name)} — ${escHtml(p.email)}${p.deptName?` — ${escHtml(p.deptName)}`:''}</option>`).join('')}</select>`;
  }
  // Reminder due-date picker: quick presets + a clean split date/time
  // pair (native datetime-local renders inconsistently across browsers).
  function reminderDateTimeParts(ms){
    const d = dubaiParts(ms);
    return {
      date: `${d.year}-${pad(d.month+1)}-${pad(d.day)}`,
      time: `${pad(d.hour)}:${pad(d.minute)}`,
    };
  }
  function applyReminderPreset(preset){
    let ms;
    if(preset==='30m') ms = nowMs()+30*60000;
    else if(preset==='1h') ms = nowMs()+3600000;
    else { // '1d' — next day, 10:00 AM UAE time, not "24h from now"
      const p = dubaiParts(nowMs());
      ms = dubaiToMs(p.year, p.month, p.day+1, 10, 0);
    }
    const parts = reminderDateTimeParts(ms);
    const dateInput = backdrop.querySelector('#rm-date');
    const timeInput = backdrop.querySelector('#rm-time');
    if(dateInput) dateInput.value = parts.date;
    if(timeInput) timeInput.value = parts.time;
  }
  if(kind==='reminder'){
    const defaultDue = nowMs()+3600000; // 1 hour out, same as the "1 hour" preset
    const parts = reminderDateTimeParts(defaultDue);
    extra = `<div class="field">
      <label>Remind at (UAE time)</label>
      <div class="filter-pills" id="rmReminderPresets" style="margin-bottom:10px;">
        <button type="button" class="filter-btn" data-rm-preset="30m">30 min</button>
        <button type="button" class="filter-btn" data-rm-preset="1h">1 hour</button>
        <button type="button" class="filter-btn" data-rm-preset="1d">Tomorrow 10 AM</button>
      </div>
      <div class="dt-row">
        <input type="date" id="rm-date" value="${parts.date}">
        <input type="time" id="rm-time" value="${parts.time}">
      </div>
      <div class="dt-hint" id="rmReminderHint"></div>
    </div>`;
    needsComment = false;
  } else if(kind==='delegate'){
    extra = `<div class="field">
      <label>Route to</label>
      <div class="filter-pills route-toggle" id="rmTargetPills" role="radiogroup" aria-label="Route to" style="margin-bottom:10px;">
        <button type="button" class="filter-btn active" data-rm-target-type="department" role="radio" aria-checked="true" title="Department" aria-label="Department">${ICON_DEPARTMENT}</button>
        <button type="button" class="filter-btn" data-rm-target-type="person" role="radio" aria-checked="false" title="Person" aria-label="Person">${ICON_PERSON}</button>
      </div>
      <div id="rmTargetWrap">${delegateTargetFieldHtml(delegateTargetType)}</div>
    </div>`;
  } else if(kind==='accept' || kind==='resolve'){
    needsComment = false;
  }
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${titles[kind]}</h3>
      <p class="modal-sub">#${tid} · ${escHtml(ticketTitle(tid))}</p>
      ${extra}
      <div class="field"><label>Comment${needsComment?' (required)':' (optional)'}</label><textarea id="rm-comment" placeholder="What's the update?"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rm-cancel">Cancel</button>
        <button class="btn btn-primary" id="rm-confirm">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  if(kind==='reminder'){
    const dateInput = backdrop.querySelector('#rm-date');
    const timeInput = backdrop.querySelector('#rm-time');
    const hint = backdrop.querySelector('#rmReminderHint');
    const fmtHint = ()=>{
      if(!dateInput.value || !timeInput.value){ hint.textContent=''; return; }
      const [y,mo,da] = dateInput.value.split('-').map(Number);
      const [hh,mm] = timeInput.value.split(':').map(Number);
      if([y,mo,da,hh,mm].some(n=>isNaN(n))){ hint.textContent=''; return; }
      const ms = dubaiToMs(y, mo-1, da, hh, mm, 0);
      const d = dubaiParts(ms);
      const wd = WEEKDAY_ABBR[d.weekdayIdx];
      const mon = MONTH_ABBR[d.month];
      let h = d.hour, ampm = h>=12?'PM':'AM'; h = h%12 || 12;
      hint.textContent = `Reminder set for ${wd}, ${d.day}-${mon}-${d.year} at ${h}:${pad(d.minute)} ${ampm} (UAE time)`;
    };
    backdrop.querySelectorAll('[data-rm-preset]').forEach(b=>{
      b.onclick = ()=>{
        backdrop.querySelectorAll('[data-rm-preset]').forEach(x=>x.classList.toggle('active', x===b));
        applyReminderPreset(b.dataset.rmPreset);
        fmtHint();
      };
    });
    dateInput.oninput = ()=>{ backdrop.querySelectorAll('[data-rm-preset]').forEach(x=>x.classList.remove('active')); fmtHint(); };
    timeInput.oninput = ()=>{ backdrop.querySelectorAll('[data-rm-preset]').forEach(x=>x.classList.remove('active')); fmtHint(); };
    fmtHint();
  }
  if(kind==='delegate'){
    backdrop.querySelectorAll('[data-rm-target-type]').forEach(b=>{
      b.onclick = ()=>{
        delegateTargetType = b.dataset.rmTargetType;
        backdrop.querySelectorAll('[data-rm-target-type]').forEach(x=>{
          x.classList.toggle('active', x===b);
          x.setAttribute('aria-checked', x===b ? 'true' : 'false');
        });
        document.getElementById('rmTargetWrap').innerHTML = delegateTargetFieldHtml(delegateTargetType);
      };
    });
  }
  backdrop.querySelector('#rm-cancel').onclick=()=>backdrop.remove();
  backdrop.querySelector('#rm-confirm').onclick=async ()=>{
    const confirmBtn = backdrop.querySelector('#rm-confirm');
    const comment = backdrop.querySelector('#rm-comment').value.trim();
    if(needsComment && !comment){ toast('A comment is required before you can respond.'); return; }
    const actorId = state.currentUserId;
    confirmBtn.disabled = true; // block double-submit while the write is in flight
    try{
      if(kind==='accept'){
        await acceptTicket({ticketId:tid, actorId});
        toast('Ticket accepted.');
      } else if(kind==='resume'){
        await resumeTicket({ticketId:tid, actorId, note:comment});
        toast('Resumed.');
      } else if(kind==='reminder'){
        const dateVal = backdrop.querySelector('#rm-date').value;
        const timeVal = backdrop.querySelector('#rm-time').value;
        if(!dateVal || !timeVal){ toast('Pick a date and time first.'); confirmBtn.disabled=false; return; }
        const [y,mo,da] = dateVal.split('-').map(Number);
        const [hh,mm] = timeVal.split(':').map(Number);
        if([y,mo,da,hh,mm].some(n=>isNaN(n))){ toast('Pick a valid date and time.'); confirmBtn.disabled=false; return; }
        const dueAtMs = dubaiToMs(y, mo-1, da, hh, mm, 0);
        await setReminder({ticketId:tid, actorId, dueAtMs});
        toast('Reminder set.');
      } else if(kind==='attend'){
        await attendReminder({ticketId:tid, actorId, note:comment});
        toast('Reminder attended.');
      } else if(kind==='delegate'){
        const targetVal = backdrop.querySelector('#rm-target').value;
        if(delegateTargetType==='department'){
          await transferTicket({ticketId:tid, actorId, targetType:'department', target:dept(targetVal).name, reason:comment});
          toast(`Transferred to ${dept(targetVal).name} — waiting for someone to accept.`);
        } else {
          await transferTicket({ticketId:tid, actorId, targetType:'person', target:targetVal, reason:comment});
          toast(`Delegated to ${nameOf(targetVal)} — waiting for them to accept.`);
        }
      } else if(kind==='resolve'){
        await resolveTicket({ticketId:tid, actorId, comment});
        toast('Done.');
        // The creator gets the "now Done" corner box only if the ticLog/Ticket
        // cache's Notify column is YES for this ticket — same flag that drives
        // the bell dropdown. It'll also show up in the bell dropdown either way
        // once render() runs, but this box is the just-happened-live nudge.
        const m = master(tid);
        const justResolved = EVENTS.filter(e=>e.ticketId===tid && e.action==='RESOLVED').sort((a,b)=>b.eventId-a.eventId)[0];
        if(m && m.createdBy===actorId && notifyFlagFor(tid, justResolved)) notifyTicketDone(tid);
      }
      backdrop.remove();
      render();
    }catch(err){
      // Mutation already rolled its optimistic event back out of EVENTS —
      // just tell the person and let them retry from the still-open modal.
      toast(err && err.message ? err.message : 'Something went wrong — please try again.');
      confirmBtn.disabled = false;
    }
  };
}

/* ═══════════ Wiring ═══════════ */
function wireGlobal(){
  document.querySelectorAll('[data-ff]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.ff==='reset') demoOffsetMs = 0;
      else demoOffsetMs += parseInt(b.dataset.ff,10);
      render();
    };
  });
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick=()=>{ state.view=b.dataset.view; state.ffSelectedTicket=null; render(); };
  });
  document.querySelectorAll('[data-mystatus]').forEach(b=>{
    b.onclick=()=>{ state.myStatusFilter=b.dataset.mystatus; render(); };
  });
  document.querySelectorAll('[data-deptstatus]').forEach(b=>{
    b.onclick=()=>{ state.deptStatusFilter=b.dataset.deptstatus; render(); };
  });
  window.__mselRefresh = render;
  wireFfCategorySelect();
  wireFfDateFilter();
  wireFfToolbarScrollGuard();
  ['ffHandlerMsel','ffDeptMsel'].forEach(id=>{
    if(document.getElementById(id)){
      wireMultiSelect(id, ()=>state.ffMulti, (v)=>{ state.ffMulti = v; }, render, {single:true});
    }
  });
  const ffq = document.getElementById('ffQuery');
  if(ffq){
    const ev = state.ffMode==='ticket' ? 'input' : 'change';
    ffq.addEventListener(ev, ()=>{ state.ffQuery = ffq.value; render(); });
  }
  const ffFrom = document.getElementById('ffFrom');
  if(ffFrom) ffFrom.addEventListener('change', ()=>{ state.ffFrom = ffFrom.value; render(); });
  const ffTo = document.getElementById('ffTo');
  if(ffTo) ffTo.addEventListener('change', ()=>{ state.ffTo = ffTo.value; render(); });
  const ffSubjInput = document.getElementById('ffSubjectInput');
  if(ffSubjInput){
    ffSubjInput.oninput = ()=> filterFfSubjDrop(ffSubjInput.value);
    ffSubjInput.onfocus = ()=> openFfSubjDrop();
    ffSubjInput.onblur = ()=> setTimeout(closeFfSubjDrop, 160);
  }
  const ffSubjList = document.getElementById('ffSubjectList');
  if(ffSubjList){
    ffSubjList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-ff-emp-id]');
      if(row) selectFfSubjDrop(row.dataset.ffEmpId);
    });
  }
  document.querySelectorAll('[data-open-ticket]').forEach(row=>{
    row.onclick=()=>{ openTicketInFlow(row.dataset.openTicket); };
  });
  const ffBack = document.getElementById('ffBack');
  if(ffBack) ffBack.onclick=()=>{
    state.ffSelectedTicket = null;
    if(state.ffReturnView){ state.view = state.ffReturnView; state.ffReturnView = null; }
    render();
  };
  document.querySelectorAll('[data-respond]').forEach(b=>{
    b.onclick=()=> openRespondModal(b.dataset.respond, b.dataset.tid);
  });
  const newTicketBtn = document.getElementById('newTicketBtn');
  if(newTicketBtn) newTicketBtn.onclick = openNewTicketDrawer;
  const notifBellBtn = document.getElementById('notifBellBtn');
  if(notifBellBtn) notifBellBtn.onclick = (e)=>{ e.stopPropagation(); state.notifOpen = !state.notifOpen; render(); };
  const notifDropdown = document.getElementById('notifDropdown');
  if(notifDropdown){
    notifDropdown.addEventListener('click', e=>{
      e.stopPropagation();
      const dismissKey = e.target.closest('[data-notif-dismiss]');
      if(dismissKey){ notifDismissed.add(dismissKey.dataset.notifDismiss); render(); return; }
      const openRow = e.target.closest('[data-notif-open]');
      if(openRow){ state.notifOpen = false; openTicketInFlow(openRow.dataset.notifOpen); }
    });
  }
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.onclick = (e)=>{ e.stopPropagation(); state.profileOpen = !state.profileOpen; render(); };
}
// Click anywhere outside the bell/dropdown or profile trigger/dropdown
// closes whichever is open — wired once, not re-bound on every render
// (unlike the handlers above, which live inside the innerHTML that gets
// replaced each render).
document.addEventListener('click', (e)=>{
  let changed = false;
  if(state.notifOpen && !e.target.closest('.bell-wrap')){ state.notifOpen = false; changed = true; }
  if(state.profileOpen && !e.target.closest('.profile-wrap')){ state.profileOpen = false; changed = true; }
  if(changed) render();
});

/* ═══════════ New Ticket drawer ═══════════
   Captures the fixed E2 (Subject Employee) up front, and lets creation
   itself be a delegation: route straight to a Department queue OR
   directly to a named Person — both supported, matching TK-5001 (dept)
   and TK-5002 (direct-to-person) in the real sample data. */
let newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:'', notifyOnDone:true};
/* ═══════════ Employee search dropdown — same render method as docPortal's
   filterDrop: plain search box + highlighted name/id list, instead of the
   checkbox multi-select. Used only for the New Ticket "Subject Employee"
   field (ap2_employee cache). ═══════════ */
/* ═══════════ Employee search dropdown — same render method as docPortal's
   filterDrop: plain search box + highlighted name/id list, instead of the
   checkbox multi-select. Used only for the New Ticket "Subject Employee"
   field (ap2_employee cache).
   Like docPortal, the input/list DOM nodes are rendered once and then
   patched directly (list.innerHTML=...) rather than being torn down and
   rebuilt on every keystroke/click — a full-page re-render mid-mousedown
   was racing against the click and closing the dropdown before the
   selection registered. */
function empDropSelectedLabel(){
  const id = newTicketForm.subjectEmployee;
  if(!id) return '';
  const e = EMPLOYEES.find(x=>String(x.id)===String(id));
  return e ? employeeLabel(e) : id;
}
function empSearchDropShell(){
  return `
  <div class="emp-drop" id="ntSubjectDrop">
    <input type="text" class="emp-drop-input" id="ntSubjectInput" autocomplete="off"
      placeholder="${EMPLOYEES.length?'Search by ID or name…':'No employees in cache'}"
      value="${escAttr(empDropSelectedLabel())}">
    <div class="dropdown-list" id="ntSubjectList"></div>
  </div>`;
}
function filterEmpDrop(q){
  const list = document.getElementById('ntSubjectList');
  if(!list) return;
  const lq = q.toLowerCase().trim();
  const hits = (lq ? EMPLOYEES.filter(e=>String(e.id).toLowerCase().includes(lq)||e.name.toLowerCase().includes(lq)) : EMPLOYEES).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!EMPLOYEES.length){
    html = `<div class="di no-match">No employees in cache</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No employees found</div>`;
  }else{
    html = hits.map(e=>`<div class="di" data-emp-drop-id="${escAttr(e.id)}">
        <div class="dn">${hl(e.name)}</div>
        <div class="ds">ID: ${hl(String(e.id))}</div>
      </div>`).join('');
  }
  if(lq && !hits.some(e=>String(e.id).toLowerCase()===lq)){
    html += `<div class="di emp-drop-add" data-emp-drop-add="1"><i class="ti ti-plus"></i><span>Use "${escHtml(q.trim())}" as new employee code</span></div>`;
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ntSubjectDrop'); if(wrap) wrap.classList.add('open');
}
function openEmpDrop(){
  const input = document.getElementById('ntSubjectInput');
  filterEmpDrop(input ? input.value : '');
}
function closeEmpDrop(){
  const list = document.getElementById('ntSubjectList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ntSubjectDrop'); if(wrap) wrap.classList.remove('open');
}
function selectEmpDrop(id){
  newTicketForm.subjectEmployee = String(id);
  const input = document.getElementById('ntSubjectInput');
  if(input) input.value = empDropSelectedLabel();
  closeEmpDrop();
}

/* ═══════════ Target (Department / Person) search dropdown — same
   single-search-box method as the Subject Employee field above, used for
   the New Ticket "Route to" picker. Replaces the old checkbox-panel-style
   multi-select (which needed an extra click to open, then typing into a
   second, nested search box — the pattern flagged as unprofessional).
   Options come from activeDeptOptions()/activePersonOptions() depending on
   newTicketForm.targetType. ═══════════ */
function targetDropOptions(){
  return newTicketForm.targetType==='department'
    ? activeDeptOptions().map(d=>({value:d.name, label:d.name, sub:''}))
    : activePersonOptions().map(p=>({value:p.email, label:p.name, sub:p.email}));
}
function targetDropSelectedLabel(){
  const val = newTicketForm.target;
  if(!val) return '';
  if(newTicketForm.targetType==='department') return val;
  const u = userFor(val);
  return u ? u.name : val;
}
function targetSearchDropShell(){
  const f = newTicketForm;
  const opts = targetDropOptions();
  const placeholder = opts.length
    ? (f.targetType==='department' ? 'Search departments…' : 'Search by name or email…')
    : (f.targetType==='department' ? 'No departments yet — type to add one' : 'No people available');
  return `
  <div class="emp-drop" id="ntTargetDrop">
    <input type="text" class="emp-drop-input" id="ntTargetInput" autocomplete="off"
      placeholder="${escAttr(placeholder)}"
      value="${escAttr(targetDropSelectedLabel())}">
    <div class="dropdown-list" id="ntTargetList"></div>
  </div>`;
}
function filterTargetDrop(q){
  const list = document.getElementById('ntTargetList');
  if(!list) return;
  const f = newTicketForm;
  const opts = targetDropOptions();
  const lq = q.toLowerCase().trim();
  const hits = (lq ? opts.filter(o=> o.label.toLowerCase().includes(lq) || (o.sub||'').toLowerCase().includes(lq)) : opts).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!opts.length && f.targetType!=='department'){
    html = `<div class="di no-match">No people available</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No matches</div>`;
  }else{
    html = hits.map(o=>`<div class="di" data-target-drop-value="${escAttr(o.value)}">
        <div class="dn">${hl(o.label)}</div>
        ${o.sub?`<div class="ds">${hl(o.sub)}</div>`:''}
      </div>`).join('');
  }
  if(f.targetType==='department' && lq && !hits.some(o=>o.label.toLowerCase()===lq)){
    html += `<div class="di emp-drop-add" data-target-drop-add="1"><span>+ Use "${escHtml(q.trim())}" as new department name</span></div>`;
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ntTargetDrop'); if(wrap) wrap.classList.add('open');
}
function openTargetDrop(){
  const input = document.getElementById('ntTargetInput');
  filterTargetDrop(input ? input.value : '');
}
function closeTargetDrop(){
  const list = document.getElementById('ntTargetList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ntTargetDrop'); if(wrap) wrap.classList.remove('open');
}
function selectTargetDrop(value){
  newTicketForm.target = String(value);
  const input = document.getElementById('ntTargetInput');
  if(input) input.value = targetDropSelectedLabel();
  closeTargetDrop();
}

function newTicketFormHtml(u){
  const f = newTicketForm;
  return `
    <div class="field">
      <label>Subject Employee (E2)
        <span class="cache-ping ${EMPLOYEE_CACHE_OK?'ok':'warn'}" title="${EMPLOYEE_CACHE_OK?'Employee roster loaded from ap2_employee cache':'ap2_employee cache unavailable — no employee roster loaded'}"></span>
      </label>
      ${empSearchDropShell()}
    </div>
    <div class="field">

      <label>Ticket name</label>
      <input type="text" id="nt-title" placeholder="e.g. SIM package renewal" value="${f.title.replace(/"/g,'&quot;')}">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="nt-desc" placeholder="What's going on, and what do you need?">${f.description}</textarea>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Priority</label>
        <select id="nt-priority">
          ${['Critical','High','Medium','Low'].map(p=>`<option ${f.priority===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Route to</label>
        <div class="filter-pills route-toggle" role="radiogroup" aria-label="Route to">
          <button type="button" class="filter-btn ${f.targetType==='department'?'active':''}" data-target-type="department" role="radio" aria-checked="${f.targetType==='department'}" title="Department" aria-label="Department">${ICON_DEPARTMENT}</button>
          <button type="button" class="filter-btn ${f.targetType==='person'?'active':''}" data-target-type="person" role="radio" aria-checked="${f.targetType==='person'}" title="Person" aria-label="Person">${ICON_PERSON}</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>${f.targetType==='department' ? 'Department' : 'Delegate to'}</label>
      <div id="ntTargetWrap">${targetSearchDropShell()}</div>
      <span class="hint">${f.targetType==='department' ? "Sits as NEW in that department's queue until someone accepts it." : "Still goes to NEW — they'll need to Accept it, exactly like a department hand-off."}</span>
    </div>
    <div class="field">
      <label>Notify me when done</label>
      <div class="filter-pills" role="radiogroup" aria-label="Notify me when done">
        <button type="button" class="filter-btn ${f.notifyOnDone?'active':''}" data-notify-flag="yes" role="radio" aria-checked="${f.notifyOnDone===true}">Yes</button>
        <button type="button" class="filter-btn ${!f.notifyOnDone?'active':''}" data-notify-flag="no" role="radio" aria-checked="${f.notifyOnDone===false}">No</button>
      </div>
      <span class="hint">If Yes, you'll get a same-day alert here the moment this ticket is marked Done — whether you keep it, delegate it, or route it to a department.</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="nt-submit">Create ticket</button>
      <button class="btn btn-ghost" id="nt-reset">Clear</button>
    </div>`;
}
function openNewTicketDrawer(){
  if(document.getElementById('ticketDrawer')) return;
  const u = currentUser();
  const drawer = document.createElement('aside');
  drawer.className = 'ticket-drawer';
  drawer.id = 'ticketDrawer';
  drawer.innerHTML = `
    <div class="drawer-head">
      <div>
        <h2>New Ticket</h2>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody">${newTicketFormHtml(u)}</div>`;
  document.body.appendChild(drawer);
  document.body.classList.add('drawer-open');
  requestAnimationFrame(()=>{ requestAnimationFrame(()=> drawer.classList.add('open')); });
  document.addEventListener('keydown', newTicketDrawerEscHandler);
  document.addEventListener('mousedown', newTicketDrawerOutsideClick);
  wireNewTicketDrawerFields(u);
  document.getElementById('drawerClose').onclick = closeNewTicketDrawer;
}
function newTicketDrawerEscHandler(e){ if(e.key==='Escape') closeNewTicketDrawer(); }
function newTicketDrawerOutsideClick(e){
  const drawer = document.getElementById('ticketDrawer');
  const fab = document.getElementById('newTicketBtn');
  if(!drawer) return;
  if(drawer.contains(e.target) || (fab && fab.contains(e.target))) return;
  closeNewTicketDrawer();
}
function closeNewTicketDrawer(){
  const drawer = document.getElementById('ticketDrawer');
  if(!drawer) return;
  drawer.classList.remove('open');
  document.body.classList.remove('drawer-open');
  document.removeEventListener('keydown', newTicketDrawerEscHandler);
  document.removeEventListener('mousedown', newTicketDrawerOutsideClick);
  setTimeout(()=>{ drawer.remove(); }, 220);
}
function refreshNewTicketDrawer(u){
  const body = document.getElementById('drawerBody');
  if(!body) return;
  body.innerHTML = newTicketFormHtml(u);
  wireNewTicketDrawerFields(u);
}
function wireNewTicketDrawerFields(u){
  const empInput = document.getElementById('ntSubjectInput');
  if(empInput){
    empInput.oninput = ()=> filterEmpDrop(empInput.value);
    empInput.onfocus = ()=> openEmpDrop();
    empInput.onblur = ()=> setTimeout(closeEmpDrop, 160);
  }
  const empList = document.getElementById('ntSubjectList');
  if(empList){
    empList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-emp-drop-id]');
      if(row){ selectEmpDrop(row.dataset.empDropId); return; }
      const addRow = e.target.closest('[data-emp-drop-add]');
      if(addRow){ const empInput2 = document.getElementById('ntSubjectInput'); selectEmpDrop((empInput2?empInput2.value:'').trim()); }
    });
  }
  const t = document.getElementById('nt-title'); if(t) t.oninput = ()=>{ newTicketForm.title = t.value; };
  const d = document.getElementById('nt-desc'); if(d) d.oninput = ()=>{ newTicketForm.description = d.value; };
  const p = document.getElementById('nt-priority'); if(p) p.onchange = ()=>{ newTicketForm.priority = p.value; };
  document.querySelectorAll('[data-target-type]').forEach(b=>{
    b.onclick = ()=>{ newTicketForm.targetType = b.dataset.targetType; newTicketForm.target=''; refreshNewTicketDrawer(u); };
  });
  document.querySelectorAll('[data-notify-flag]').forEach(b=>{
    b.onclick = ()=>{ newTicketForm.notifyOnDone = (b.dataset.notifyFlag==='yes'); refreshNewTicketDrawer(u); };
  });
  const targetInput = document.getElementById('ntTargetInput');
  if(targetInput){
    targetInput.oninput = ()=> filterTargetDrop(targetInput.value);
    targetInput.onfocus = ()=> openTargetDrop();
    targetInput.onblur = ()=> setTimeout(closeTargetDrop, 160);
  }
  const targetList = document.getElementById('ntTargetList');
  if(targetList){
    targetList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-target-drop-value]');
      if(row){ selectTargetDrop(row.dataset.targetDropValue); return; }
      const addRow = e.target.closest('[data-target-drop-add]');
      if(addRow){ const targetInput2 = document.getElementById('ntTargetInput'); selectTargetDrop((targetInput2?targetInput2.value:'').trim()); }
    });
  }
  const submit = document.getElementById('nt-submit');
  if(submit) submit.onclick = async ()=>{
    const f = newTicketForm;
    let subjectEmployee = f.subjectEmployee;
    if(!subjectEmployee){ toast('Select (or enter) the Subject Employee (E2) — who this ticket is about.'); return; }
    if(!f.title.trim()){ toast('Give this a name first.'); return; }
    let target = f.target;
    if(f.targetType==='department' && target==='__new__'){ target = (f.targetNew||'').trim(); }
    if(!target){ toast(f.targetType==='department' ? 'Choose or name a department.' : 'Choose who to delegate this to.'); return; }
    submit.disabled = true; // block double-submit while the write is in flight
    try{
      const tid = await createTicket({
        creatorId: state.currentUserId, title:f.title, description:f.description||'(no description provided)',
        priority:f.priority, subjectType:'Employee', subjectEmployeeId:subjectEmployee,
        targetType:f.targetType, target, notifyOnDone:f.notifyOnDone,
      });
      toast(`Ticket ${tid} created for ${subjectEmployee}, routed to ${nameOf(target)}.`);
      newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:'', notifyOnDone:true};
      closeNewTicketDrawer();
      openTicketInFlow(tid);
    }catch(err){
      // createTicket already rolled its optimistic event back out of
      // EVENTS/TICKET_MASTER — just tell the person and let them retry
      // from the still-open drawer.
      toast(err && err.message ? err.message : 'Something went wrong — please try again.');
      submit.disabled = false;
    }
  };
  const reset = document.getElementById('nt-reset');
  if(reset) reset.onclick = ()=>{ newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:'', notifyOnDone:true}; refreshNewTicketDrawer(u); };
}

// periodic re-render so overdue flags stay live without user action
setInterval(()=>{
  if(state.view==='my' || state.view==='dept' || (state.view==='flow' && !state.ffSelectedTicket) || state.view==='org'){
    safeRender();
  }
}, 15000);

// ---------- Boot ----------
loadStaffMeta();
loadOverlay();
applyOverlay();          // show this browser's own local tickets immediately, if any
trackMaxEventId(EVENTS); // seed the counter from any local rows saved in a previous session
ME = bootstrapIdentity();
discoverDirectory(EVENTS, TICKET_MASTER);
state.currentUserId = ME;
render();
loadTickets();            // then read the real ap2_ticLog cache (IndexedDB) and merge it in — Users
                          // rows arrive with it, so re-resolve identity once real data is in.
loadEmployees();          // ap2_employee cache, for the New Ticket Subject Employee picker
async function _reboundIdentityAfterLoad(){
  ME = bootstrapIdentity();
  if(!state.currentUserId || state.currentUserId===ME) return;
  state.currentUserId = ME;
  discoverDirectory(EVENTS, TICKET_MASTER);
  safeRender();
}
setTimeout(_reboundIdentityAfterLoad, 400);
