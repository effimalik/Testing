<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsDeck — Ticket &amp; Task Portal</title>
<script src="https://effimalik.github.io/Testing/shared/auth.js?v=5"></script>
<script src="https://effimalik.github.io/Testing/shared/code.js"></script>
<script src="https://effimalik.github.io/Testing/shared/dataLayer.js"></script>
<script src="https://effimalik.github.io/Testing/shared/devPre.js"></script>
<script src="https://effimalik.github.io/Testing/shared/cacheWatcher.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1720;
    --bg-grid: #131D27;
    --panel:#172029;
    --panel-raised:#1D2833;
    --panel-hover:#212E3A;
    --border:#28333F;
    --border-soft:#1E2830;
    --text:#EAEEF2;
    --text-dim:#B3BEC9;
    --text-muted:#7C8998;
    --teal:#4FD1C5;
    --teal-dim:#2C4A48;
    --amber:#F2A93B;
    --amber-dim:#4A3A1E;
    --red:#E8574B;
    --red-dim:#4A2420;
    --blue:#5B8DEF;
    --blue-dim:#22314F;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --font-body:'Inter', sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0/100% 28px,
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
  }
  ::selection{background:var(--teal-dim);color:var(--text);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;flex-direction:column;gap:10px;
    padding:14px 24px;
    background:rgba(15,23,32,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .topbar-row1{display:flex;align-items:center;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:0.2px;flex-shrink:0;}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 2.2s ease-in-out infinite;}
  .cache-ping{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:middle;animation:pulse 2.2s ease-in-out infinite;}
  .cache-ping.ok{background:var(--teal);box-shadow:0 0 8px var(--teal);}
  .cache-ping.warn{background:var(--amber);box-shadow:0 0 8px var(--amber);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .topbar-spacer{flex:1;}
  nav.tabs{
    display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:1px;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:none;border:none;color:var(--text-muted);font-size:13.5px;font-weight:500;
    padding:8px 14px;border-radius:7px;transition:all .15s;position:relative;white-space:nowrap;flex-shrink:0;
  }
  nav.tabs button:hover{color:var(--text);background:var(--panel-raised);}
  nav.tabs button.active{color:var(--bg);background:var(--teal);}
  .badge-count{
    display:inline-block;min-width:16px;padding:0 4px;margin-left:6px;border-radius:20px;
    background:var(--red);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;
  }
  nav.tabs button.active .badge-count{background:rgba(15,23,32,.55);color:#fff;}
  .userbox{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .userbox select{
    background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:7px;
    padding:7px 10px;font-size:13px;max-width:190px;
  }
  .role-pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);border:1px solid var(--teal-dim);background:var(--teal-dim);padding:3px 8px;border-radius:20px;font-family:var(--font-mono);white-space:nowrap;flex-shrink:0;}

  @media (max-width:760px){
    .topbar{padding:12px 14px;}
    .topbar-row1{flex-wrap:wrap;row-gap:10px;}
    .userbox{width:100%;justify-content:space-between;order:3;}
    .userbox select{max-width:none;flex:1;}
    nav.tabs{width:100%;order:2;}
    .topbar-spacer{display:none;}
  }

  /* ---------- Layout ---------- */
  .page{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
  .grid2{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start;}
  @media (max-width:820px){.grid2{grid-template-columns:1fr;}}

  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;
  }
  .profile-card .avatar{
    width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:19px;background:var(--panel-raised);
    color:var(--teal);border:1px solid var(--border);margin-bottom:14px;
  }
  .profile-card h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
  .profile-card .role-line{color:var(--text-muted);font-size:13px;margin:0 0 14px;}
  .profile-card .meta-row{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-top:1px solid var(--border-soft);color:var(--text-dim);}
  .profile-card .meta-row span:first-child{color:var(--text-muted);}
  .stat-strip{display:flex;gap:10px;margin-top:14px;}
  .stat-chip{flex:1;background:var(--panel-raised);border:1px solid var(--border-soft);border-radius:8px;padding:9px 8px;text-align:center;}
  .stat-chip .n{font-family:var(--font-mono);font-size:18px;font-weight:600;}
  .stat-chip .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .access-chip{font-size:10px;font-family:var(--font-mono);border:1px solid var(--border-soft);color:var(--text-dim);background:var(--panel-raised);padding:3px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;}
  .access-chip .flags{color:var(--teal);font-weight:700;letter-spacing:1px;}
  .access-chip.no-access{color:var(--text-muted);}
  .access-chip.no-access .flags{display:none;}

  h1.page-title{font-family:var(--font-display);font-size:24px;margin:0 0 4px;}
  .page-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 20px;}
  .section-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* ---------- Ticket rows ---------- */
  .ticket-list{display:flex;flex-direction:column;gap:8px;}
  .ticket-row{
    background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.12s;
  }
  .ticket-row:hover{background:var(--panel-hover);border-color:#37444F;}
  .pri-flag{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0;}
  .pri-High{background:var(--red);}
  .pri-Medium{background:var(--amber);}
  .pri-Low{background:var(--teal);}
  .t-main{flex:1;min-width:0;}
  .t-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;}
  .t-title .tid{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);font-weight:400;}
  .t-sub{font-size:12px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .type-chip{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-mono);padding:2px 6px;border-radius:4px;border:1px solid var(--border);color:var(--text-dim);}
  .status-chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .st-Open{background:var(--blue-dim);color:var(--blue);}
  .st-Forwarded{background:var(--blue-dim);color:var(--blue);}
  .st-InProgress{background:var(--blue-dim);color:var(--blue);}
  .st-Pending{background:var(--amber-dim);color:var(--amber);}
  .st-Postponed{background:var(--amber-dim);color:var(--amber);}
  .st-Resolved{background:var(--teal-dim);color:var(--teal);}
  .st-Done{background:var(--teal-dim);color:var(--teal);}
  /* Real ap2_ticLog status vocabulary: NEW / IN PROGRESS / ON HOLD / RESOLVED
     (statusClass() strips spaces, so "IN PROGRESS" -> st-INPROGRESS etc.) */
  .st-NEW{background:var(--blue-dim);color:var(--blue);}
  .st-INPROGRESS{background:var(--blue-dim);color:var(--blue);}
  .st-ONHOLD{background:var(--amber-dim);color:var(--amber);}
  .st-RESOLVED{background:var(--teal-dim);color:var(--teal);}
  .overdue-flag{
    font-family:var(--font-mono);font-size:10.5px;color:#fff;background:var(--red);
    padding:3px 8px;border-radius:5px;display:flex;align-items:center;gap:5px;animation:ring 1.6s ease-in-out infinite;
  }
  @keyframes ring{0%,100%{transform:rotate(0);}20%{transform:rotate(-8deg);}40%{transform:rotate(8deg);}60%{transform:rotate(-4deg);}80%{transform:rotate(4deg);}}
  .empty{
    text-align:center;padding:50px 20px;color:var(--text-muted);border:1px dashed var(--border);border-radius:var(--radius);font-size:13.5px;
  }
  .empty b{display:block;color:var(--text-dim);font-family:var(--font-display);font-size:16px;margin-bottom:6px;font-weight:600;}

  /* ---------- Buttons ---------- */
  .btn{border:1px solid var(--border);background:var(--panel-raised);color:var(--text);padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;transition:.12s;}
  .btn:hover{background:var(--panel-hover);border-color:#3A4753;}
  .btn-primary{background:var(--teal);color:#062522;border-color:var(--teal);font-weight:600;}
  .btn-primary:hover{background:#69dbd0;}
  .btn-amber{background:var(--amber);color:#2a1c04;border-color:var(--amber);font-weight:600;}
  .btn-amber:hover{background:#f7bb5c;}
  .btn-ghost{background:none;border-color:transparent;color:var(--text-muted);}
  .btn-ghost:hover{color:var(--text);background:var(--panel-raised);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-block{width:100%;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Tabs (dept portal) ---------- */
  .subtabs{display:flex;gap:4px;margin-bottom:16px;background:var(--panel-raised);padding:4px;border-radius:9px;width:fit-content;}

  /* ---------- Filter pills (status filter — same pattern as the fleet pages) ---------- */
  .filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-btn{
    display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;
    border:1.5px solid var(--border);background:var(--panel-raised);color:var(--text-dim);
    font-family:var(--font-body);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .filter-btn:hover{background:var(--panel-hover);color:var(--text);}
  .filter-btn.active{background:var(--teal-dim);color:var(--teal);border-color:var(--teal-dim);box-shadow:0 0 0 2px var(--teal-dim);}
  .subtabs button{background:none;border:none;color:var(--text-muted);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:6px;}
  .subtabs button.active{background:var(--panel);color:var(--text);}

  /* ---------- Forms ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .field input[type=text],.field textarea,.field select,.field input[type=date]{
    background:var(--panel-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:10px 11px;font-size:13.5px;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--teal);}
  .field textarea{resize:vertical;min-height:70px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;background:var(--panel-raised);border:1px solid var(--border);color:var(--text-dim);padding:9px;border-radius:7px;font-size:13px;font-weight:600;}
  .seg button.sel{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:-4px;}
  .warn-hint{font-size:11.5px;color:var(--amber);}

  /* ---------- Employee search dropdown (docPortal-style render method,
     used for ap2_employee cache — Subject Employee field only) ---------- */
  .emp-drop{position:relative;}
  .emp-drop-input{
    width:100%;background:var(--panel-raised);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:9px 11px;font-size:13.5px;
  }
  .emp-drop-input:focus{outline:none;border-color:var(--teal);}
  .emp-drop.open .emp-drop-input{border-color:var(--teal);}
  .dropdown-list{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
    background:var(--panel-raised);border:1px solid var(--border);border-radius:9px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);max-height:220px;overflow-y:auto;display:none;
  }
  .dropdown-list.open{display:block;}
  .dropdown-list .di{padding:8px 11px;cursor:pointer;border-radius:6px;margin:2px;}
  .dropdown-list .di:hover,.dropdown-list .di.sel{background:var(--panel-hover);}
  .dropdown-list .di .dn{font-size:13px;color:var(--text);font-weight:600;}
  .dropdown-list .di .ds{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .dropdown-list .di.no-match{color:var(--text-muted);text-align:center;cursor:default;font-size:12.5px;padding:12px 9px;}
  .dropdown-list .di.no-match:hover{background:none;}
  .dropdown-list .di.emp-drop-add{display:flex;align-items:center;gap:7px;color:var(--teal);font-weight:600;font-size:12.5px;border-top:1px solid var(--border-soft);}
  .dropdown-list .di em{color:var(--teal);font-style:normal;}

  /* ---------- Professional multi-select ---------- */
  .msel{position:relative;}
  .msel-control{
    display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;
    background:var(--panel-raised);border:1px solid var(--border);border-radius:7px;
    padding:8px 11px;min-height:40px;transition:border-color .12s;
  }
  .msel-control:hover{border-color:#3A4753;}
  .msel.open .msel-control{border-color:var(--teal);}
  .msel-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .msel-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--teal-dim);color:var(--teal);
    border:1px solid var(--teal-dim);border-radius:20px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600;
    max-width:100%;
  }
  .msel-chip span.msel-chip-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
  .msel-chip-x{
    all:unset;display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;border-radius:50%;font-size:9px;line-height:1;cursor:pointer;color:var(--teal);
    background:rgba(79,209,197,.16);flex-shrink:0;
  }
  .msel-chip-x:hover{background:rgba(79,209,197,.32);}
  .msel-placeholder{color:var(--text-muted);font-size:13.5px;padding:2px 0;}
  .msel-caret{color:var(--text-muted);font-size:10px;flex-shrink:0;padding-top:3px;user-select:none;}
  .msel-panel{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
    background:var(--panel-raised);border:1px solid var(--border);border-radius:9px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);padding:8px;
  }
  .msel-search{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:6px;
  }
  .msel-search:focus{outline:none;border-color:var(--teal);}
  .msel-options{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;}
  .msel-option{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;font-size:13px;
    cursor:pointer;color:var(--text-dim);
  }
  .msel-option:hover{background:var(--panel-hover);color:var(--text);}
  .msel-option input[type=checkbox],.msel-option input[type=radio]{accent-color:var(--teal);width:14px;height:14px;flex-shrink:0;cursor:pointer;}
  .msel-option .msel-opt-sub{color:var(--text-muted);font-size:11px;margin-left:auto;padding-left:8px;flex-shrink:0;}
  .msel-empty{padding:12px 9px;color:var(--text-muted);font-size:12.5px;text-align:center;}
  .msel-footer{display:flex;justify-content:space-between;align-items:center;padding:6px 3px 2px;border-top:1px solid var(--border-soft);margin-top:4px;}
  .msel-footer button{all:unset;color:var(--teal);font-size:11.5px;font-weight:600;cursor:pointer;}
  .msel-footer button:hover{text-decoration:underline;}
  .msel-count{color:var(--text-muted);font-size:11px;}
  .msel-addrow{display:flex;gap:6px;padding:6px 3px 2px;border-top:1px solid var(--border-soft);margin-top:4px;}
  .msel-addrow input{
    flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:7px 9px;font-size:12.5px;
  }
  .msel-addrow input:focus{outline:none;border-color:var(--teal);}
  .msel-addrow button{
    background:var(--teal);color:#062522;border:none;border-radius:6px;padding:0 12px;font-size:12px;font-weight:700;cursor:pointer;
  }

  /* ---------- Flow finder ---------- */
  .ff-searchbar{display:flex;gap:8px;margin-bottom:16px;}
  .ff-searchbar select, .ff-searchbar input{flex:0 0 auto;}
  .ff-results{display:flex;flex-direction:column;gap:8px;}

  .timeline{position:relative;padding-left:26px;margin-top:6px;}
  .timeline::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--border),var(--border) 70%,transparent);}
  .tl-item{position:relative;padding:0 0 26px 20px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{position:absolute;left:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--panel-raised);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;}
  .tl-item.k-created .tl-dot{border-color:var(--blue);color:var(--blue);}
  .tl-item.k-forward .tl-dot{border-color:var(--blue);color:var(--blue);}
  .tl-item.k-reminder .tl-dot{border-color:var(--amber);color:var(--amber);}
  .tl-item.k-result .tl-dot{border-color:var(--teal);color:var(--teal);}
  .tl-item.k-resolved .tl-dot{border-color:var(--teal);background:var(--teal);color:#062522;}
  .tl-gap{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);position:absolute;left:-90px;top:2px;width:60px;text-align:right;}
  .tl-card{background:var(--panel-raised);border:1px solid var(--border-soft);border-radius:8px;padding:11px 13px;}
  .tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .tl-action{font-weight:700;font-size:13.5px;}
  .tl-ts{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
  .tl-who{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .tl-notes{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .tl-wrap{padding-left:70px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(6,10,14,.7);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .fab-new{
    width:32px;height:32px;border-radius:50%;border:none;flex:none;
    background:var(--teal);color:#08171A;font-family:var(--font-body);
    font-size:19px;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(79,209,197,.25);transition:.15s;margin-right:2px;
  }
  .fab-new:hover{background:#63DBD0;transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,209,197,.35);}
  #app{transition:margin-right .22s ease;}
  body.drawer-open #app{margin-right:min(420px,92vw);}
  .ticket-drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);
    background:var(--panel);border-left:1px solid var(--border);
    box-shadow:-12px 0 32px rgba(0,0,0,.45);
    transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;overflow-y:auto;z-index:110;
  }
  .ticket-drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:20px 20px 16px;border-bottom:1px solid var(--border-soft);
    position:sticky;top:0;background:var(--panel);z-index:1;
  }
  .drawer-head h2{font-family:var(--font-display);font-size:18px;margin:0;}
  .drawer-close{
    width:28px;height:28px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel-raised);color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;transition:.12s;
  }
  .drawer-close:hover{color:var(--text);background:var(--panel-hover);}
  .drawer-body{padding:18px 20px 24px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:480px;width:100%;padding:22px;}
  .modal h3{font-family:var(--font-display);margin:0 0 4px;font-size:17px;}
  .modal .modal-sub{color:var(--text-muted);font-size:12.5px;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  /* ---------- Demo fast-forward control ---------- */
  .demo-clock{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .demo-clock .dc-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-right:2px;white-space:nowrap;}
  .demo-clock .dc-offset{font-family:var(--font-mono);font-size:10.5px;color:var(--amber);white-space:nowrap;}
  .demo-clock button{
    background:var(--panel-raised);border:1px solid var(--border);color:var(--text-dim);
    padding:5px 8px;border-radius:5px;font-family:var(--font-mono);font-size:11px;flex-shrink:0;
  }
  .demo-clock button:hover{color:var(--amber);border-color:var(--amber-dim);}
  @media (max-width:760px){
    .demo-clock{width:100%;order:4;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .demo-clock::-webkit-scrollbar{display:none;}
  }

  /* ---------- Page-wide responsive rules ---------- */
  @media (max-width:640px){
    .page{padding:20px 14px 60px;}
    .page-title{font-size:20px;}
    .form-grid{grid-template-columns:1fr;}
    .ticket-row{flex-wrap:wrap;}
    .t-main{min-width:160px;}
    .tl-wrap{padding-left:0;}
    .tl-gap{display:none;}
    .stat-strip{flex-wrap:wrap;}
    .ff-searchbar{flex-direction:column;}
    .modal{padding:18px;}
    nav.tabs button{font-size:12.5px;padding:7px 10px;}
  }

  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--panel-raised);border:1px solid var(--teal-dim);border-left:3px solid var(--teal);color:var(--text);padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slidein .25s ease;}
  @keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  .kicker{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
</style>

<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   OPSDECK — Ticket & Task Portal
   ---------------------------------------------------------------------
   REBUILT AROUND THE REAL ap2_ticLog CACHE SHAPE.

   The connected cache's .data object is { Ticket: [...], ticLog: [...] } —
   but those two arrays are the OPPOSITE of what their names suggest:

     payload.Ticket  — the real append-only FLOW/EVENT log. One row per
       event: Event_ID, Ticket_ID, Action, Status, From, Performed_By, To,
       Detail. This is what every timeline, status, and "who did what"
       view is built from.

     payload.ticLog  — the per-ticket MASTER/CREATION record. One row per
       ticket (not per event): Event_ID (points at the CREATED event),
       Ticket_ID, Created_By, Subject_Type, Subject_ID, Assigned_To,
       Assignment_Type, Priority, Status, Notes. This is where the FIXED
       facts about a ticket live — most importantly Subject_ID, which is
       the Subject Employee (E2) the earlier version of this file was
       missing entirely. It's really here now, so Flow Finder, the ticket
       list, and the New Ticket form all key off it directly.

   IDENTITY IN THE REAL DATA
   Every actor (Created_By, Performed_By, From, To, Assigned_To) is a
   short staff code like "M001".."M008" — management/operations people
   (E1/E3/E4... in the requirement doc). Every Subject Employee (E2) is a
   short code like "E101".."E105". Departments show up as plain names
   ("Finance","HR","SIM","Bike","Fleet","Payroll") wherever a code isn't
   one of the two patterns above. None of these come with real names —
   there's no separate roster in this cache — so this file builds its
   people/department directory straight out of whatever codes actually
   appear in the log (discoverDirectory below), the same "grows from the
   data, nothing hardcoded" approach the previous version used for emails.
   Because there's no login mapping from a real session to one of these
   M-codes, an "Acting as" bar (top of every view) lets you pick which
   discovered staff code you're operating as, and its role/department —
   this is what makes every scenario (worker/manager/GM, dept queues,
   oversight, Flow Finder scoping) actually reachable and testable.

   EVENT_ID AS DATE/TIME
   Per instruction, Event_ID doubles as both the sort key AND the literal
   timestamp for a flow event — it's treated as epoch milliseconds
   (new Date(Number(Event_ID))) everywhere a time is shown or a gap is
   computed, exactly like the cache's own top-level {ts:...} field is.

   TICKET LIFECYCLE (requirement §1–§11, now action-complete)
   CREATED → (queued to a Department OR delegated straight to a Person,
   chosen at creation time) → ACCEPTED (claims it) → COMMENT / ON_HOLD /
   RESUMED / REMINDER / REMINDER_ALERT (auto) / REMINDER_ATTENDED /
   TRANSFERRED (to another Department or delegated to another Person,
   which always re-queues to NEW pending Accept, matching the real
   TK-5002 sample exactly) → RESOLVED. Every action is one more append-
   only event row — nothing is ever edited or removed, only added.
   ========================================================================= */

// ---------- Time helpers ----------
let demoOffsetMs = 0;
function nowMs(){ return Date.now() + demoOffsetMs; }
function pad(n,l=2){ return String(n).padStart(l,'0'); }
function fmtTs(ms){
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtDur(ms){
  ms = Math.abs(ms);
  if(ms<1000) return ms+'ms';
  const s=Math.floor(ms/1000);
  if(s<60) return s+'s';
  const m=Math.floor(s/60);
  if(m<60) return m+'m '+(s%60)+'s';
  const h=Math.floor(m/60);
  if(h<48) return h+'h '+(m%60)+'m';
  const dd=Math.floor(h/24);
  return dd+'d '+(h%24)+'h';
}
function statusClass(s){ return 'st-'+String(s||'').replace(/\s+/g,''); }
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtReminderDetail(ms){
  const d = new Date(ms);
  return `Reminder: ${pad(d.getDate())}-${MONTH_ABBR[d.getMonth()]}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function parseReminderDetail(detail){
  const m = String(detail||'').match(/Reminder:\s*(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2})/);
  if(!m) return null;
  const monthIdx = MONTH_ABBR.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
  if(monthIdx<0) return null;
  return new Date(+m[3], monthIdx, +m[1], +m[4], +m[5], 0, 0).getTime();
}

/* ═══════════ Identity codes ═══════════
   Staff (management/ops, E1/E3/E4... in the requirement doc) = "M###".
   Subject Employee (E2) = "E###". Anything else that shows up in a
   From/To/Assigned_To slot is treated as a department name. */
function isEmailToken(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim()); }
function isStaffCode(v){ v=String(v||'').trim(); return /^M\d+$/i.test(v) || isEmailToken(v); }
function isSubjectCode(v){ return /^(emp|E)\d+$/i.test(String(v||'').trim()); }
function isPersonCode(v){ return isStaffCode(v) || isSubjectCode(v); }
function isDeptToken(v){ v=String(v||'').trim(); return !!v && !isPersonCode(v); }

/* ═══════════ Users directory (payload.Users — real names/roles/status) ═══════════
   Role strings come as either a bare tier ("GM","Manager","Visitor") or
   "Title | Department" ("Officer | Deliveroo"). Split them once here so
   every dropdown can show a real name and, where relevant, a department. */
let USERS = {};       // email(lowercase) -> {email, name, role, roleTitle, deptName, roleTier, status}
let USERS_LIST = [];
function roleTierOf(title){
  const t = String(title||'').trim().toLowerCase();
  if(t==='gm' || t==='general manager') return 'gm';
  if(t==='manager') return 'manager';
  return 'worker';
}
function parseUserRow(r){
  if(!r) return null;
  const email = String(_pick(r,['email','Email'])||'').trim();
  if(!email) return null;
  const name = String(_pick(r,['name','Name'])||'').trim() || email;
  const rawRole = String(_pick(r,['role','Role'])||'').trim();
  const parts = rawRole.split('|').map(s=>s.trim()).filter(Boolean);
  const roleTitle = parts[0] || rawRole;
  const deptName = parts[1] || '';
  return {
    email, name, role: rawRole, roleTitle, deptName,
    roleTier: roleTierOf(roleTitle),
    status: String(_pick(r,['status','Status'])||'').trim().toLowerCase() || 'active',
  };
}
function parseUsers(payload){
  USERS = {}; USERS_LIST = [];
  const rows = Array.isArray(payload && payload.Users) ? payload.Users : [];
  rows.map(parseUserRow).filter(Boolean).forEach(u=>{ USERS[u.email.toLowerCase()] = u; USERS_LIST.push(u); });
}
function userFor(v){ return USERS[String(v||'').trim().toLowerCase()] || null; }
// Display label for any person token: real name if known, else the raw code/email.
function nameLabel(v){
  const u = userFor(v);
  return u ? u.name : String(v||'');
}
// "Name — email" for pickers where seeing the address matters too.
function nameEmailLabel(v){
  const u = userFor(v);
  return u ? `${u.name} — ${u.email}` : String(v||'');
}

/* ═══════════ Employee directory (ap2_employee cache) ═══════════
   Real HR roster for the New Ticket "Subject Employee" picker — separate
   from SUBJECTS (the E101-style codes discovered in the ticket log).
   ap2_employee rows are plain arrays: [id, name, ...]. A lot of the raw
   cache is throwaway test rows (single lowercase words like "asif"/"sdc",
   or an all-lowercase name), so only rows that look like a real, properly
   cased name are kept; everything else — and duplicate ids — is dropped. */
let EMPLOYEES = [];           // [{id, name}], deduped, dummy rows removed
let EMPLOYEE_CACHE_OK = false; // true once ap2_employee has loaded with data
const REAL_NAME_RE = /^[A-Z][a-zA-Z'.-]*(\s[A-Z][a-zA-Z'.-]*)*$/;
function parseEmployeeRow(r){
  if(!Array.isArray(r)) return null;
  const id = String(r[0]==null?'':r[0]).trim();
  const name = String(r[1]==null?'':r[1]).trim();
  if(!id || !name || !REAL_NAME_RE.test(name)) return null; // drop dummy/test rows
  return {id, name};
}
function parseEmployees(rows){
  const seen = new Set(), out = [];
  (Array.isArray(rows)?rows:[]).forEach(r=>{
    const e = parseEmployeeRow(r);
    if(!e || seen.has(e.id)) return;
    seen.add(e.id);
    out.push(e);
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}
function employeeLabel(e){ return `${e.id} — ${e.name}`; }
async function loadEmployees(){
  try{
    const rows = await AP2CacheWatcher.readKey('ap2_employee');
    if(Array.isArray(rows) && rows.length){
      EMPLOYEES = parseEmployees(rows);
      EMPLOYEE_CACHE_OK = true;
    } else {
      EMPLOYEE_CACHE_OK = false;
    }
  }catch(e){
    EMPLOYEE_CACHE_OK = false;
  }
  render();
  refreshOpenDrawer();
}

/* ═══════════ Professional multi-select widget ═══════════
   Reusable checkbox-dropdown with chips + search, used wherever a picker
   needs to switch between "Department" and "Person" option sets and allow
   more than one value to be chosen at once (Flow Finder's Handler /
   Requester / Department filters, and the New Ticket "Route to" field). */
const MSEL_UI = {}; // id -> {open:bool, q:string}
function mselState(id){ if(!MSEL_UI[id]) MSEL_UI[id] = {open:false, q:''}; return MSEL_UI[id]; }
function mselCloseAllExcept(id){
  Object.keys(MSEL_UI).forEach(k=>{ if(k!==id) MSEL_UI[k].open = false; });
}
function escAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* options: [{value, label, sub?}]. selected: array of currently chosen values.
   opts.placeholder / opts.allowAdd (shows a "+ add custom value" row, used
   for "+ New department name…"). */
function renderMultiSelect(id, options, selected, opts){
  opts = opts || {};
  const st = mselState(id);
  const selSet = new Set((selected||[]).map(String));
  const selectedOptions = options.filter(o=>selSet.has(String(o.value)));
  const q = st.q.trim().toLowerCase();
  const filtered = q ? options.filter(o=> o.label.toLowerCase().includes(q) || (o.sub||'').toLowerCase().includes(q)) : options;
  const shown = opts.maxOptions ? filtered.slice(0, opts.maxOptions) : filtered;
  const truncated = opts.maxOptions && filtered.length > shown.length;
  return `
  <div class="msel${st.open?' open':''}" id="${id}">
    <div class="msel-control" data-msel-toggle="${id}">
      ${selectedOptions.length
        ? `<div class="msel-chips">${selectedOptions.map(o=>`<span class="msel-chip"><span class="msel-chip-label">${escHtml(o.label)}</span><button type="button" class="msel-chip-x" data-msel-remove="${id}" data-value="${escAttr(o.value)}" aria-label="Remove">✕</button></span>`).join('')}</div>`
        : `<span class="msel-placeholder">${escHtml(opts.placeholder||'Select…')}</span>`}
      <span class="msel-caret">${st.open?'▲':'▼'}</span>
    </div>
    ${st.open ? `
    <div class="msel-panel" data-msel-panel="${id}">
      <input type="text" class="msel-search" id="${id}-search" placeholder="${escAttr(opts.searchPlaceholder||'Search…')}" value="${escAttr(st.q)}">
      <div class="msel-options">
        ${shown.length ? shown.map(o=>`
          <label class="msel-option">
            <input type="${opts.single?'radio':'checkbox'}" ${opts.single?`name="${escAttr(id)}-radio"`:''} data-msel-check="${id}" value="${escAttr(o.value)}" ${selSet.has(String(o.value))?'checked':''}>
            <span>${escHtml(o.label)}</span>
            ${o.sub?`<span class="msel-opt-sub">${escHtml(o.sub)}</span>`:''}
          </label>`).join('') : `<div class="msel-empty">No matches</div>`}
        ${truncated ? `<div class="msel-empty">Showing top ${shown.length} of ${filtered.length} — keep typing to narrow it down</div>` : ''}
      </div>
      <div class="msel-footer">
        <span class="msel-count">${opts.single ? (selectedOptions.length?'1 selected':'none selected') : `${selectedOptions.length} selected`}</span>
        ${selectedOptions.length && !opts.single ? `<button type="button" data-msel-clear="${id}">Clear all</button>` : ''}
      </div>
      ${opts.allowAdd ? `
      <div class="msel-addrow">
        <input type="text" id="${id}-addinput" placeholder="${escAttr(opts.addPlaceholder||'+ Add custom value…')}" value="${escAttr(st.addVal||'')}">
        <button type="button" data-msel-addbtn="${id}">Add</button>
      </div>` : ''}
    </div>` : ''}
  </div>`;
}

/* Wires up a rendered multi-select. getSelected/setSelected read & write the
   backing array; onRefresh re-renders just enough of the DOM to reflect the
   new state (usually the caller's own refresh/render function). */
function wireMultiSelect(id, getSelected, setSelected, onRefresh, wopts){
  wopts = wopts || {};
  const root = document.getElementById(id);
  if(!root) return;
  const toggle = root.querySelector(`[data-msel-toggle="${id}"]`);
  if(toggle) toggle.onclick = (e)=>{
    e.stopPropagation();
    const st = mselState(id);
    const wasOpen = st.open;
    mselCloseAllExcept(id);
    st.open = !wasOpen;
    if(!st.open) st.q = '';
    onRefresh();
    if(st.open){
      document.addEventListener('mousedown', mselOutsideHandler, true);
      setTimeout(()=>{ const inp = document.getElementById(id+'-search'); if(inp){ inp.focus(); } }, 0);
    }
  };
  root.querySelectorAll(`[data-msel-remove="${id}"]`).forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const v = btn.dataset.value;
      setSelected(getSelected().filter(x=>String(x)!==String(v)));
      onRefresh();
    };
  });
  const panel = root.querySelector(`[data-msel-panel="${id}"]`);
  if(panel) panel.onmousedown = (e)=> e.stopPropagation();
  root.querySelectorAll(`[data-msel-check="${id}"]`).forEach(cb=>{
    cb.onchange = ()=>{
      if(wopts.single){
        setSelected(cb.checked ? [cb.value] : []);
        mselState(id).open = false;
        mselState(id).q = '';
        onRefresh();
        return;
      }
      let sel = getSelected().map(String);
      if(cb.checked){ if(!sel.includes(cb.value)) sel.push(cb.value); }
      else { sel = sel.filter(x=>x!==cb.value); }
      setSelected(sel);
      onRefresh();
    };
  });
  const search = document.getElementById(id+'-search');
  if(search){
    search.oninput = ()=>{ mselState(id).q = search.value; onRefresh(); };
  }
  const clearBtn = root.querySelector(`[data-msel-clear="${id}"]`);
  if(clearBtn) clearBtn.onclick = (e)=>{ e.stopPropagation(); setSelected([]); onRefresh(); };
  const addBtn = root.querySelector(`[data-msel-addbtn="${id}"]`);
  const addInput = document.getElementById(id+'-addinput');
  if(addInput) addInput.oninput = ()=>{ mselState(id).addVal = addInput.value; };
  if(addBtn) addBtn.onclick = (e)=>{
    e.stopPropagation();
    const val = (addInput ? addInput.value : '').trim();
    if(!val) return;
    if(wopts.single){
      setSelected([val]);
      mselState(id).open = false;
      mselState(id).q = '';
      mselState(id).addVal = '';
      onRefresh();
      return;
    }
    const sel = getSelected().map(String);
    if(!sel.includes(val)) sel.push(val);
    setSelected(sel);
    mselState(id).addVal = '';
    onRefresh();
  };
}
function mselOutsideHandler(e){
  const openId = Object.keys(MSEL_UI).find(k=>MSEL_UI[k].open);
  if(!openId) { document.removeEventListener('mousedown', mselOutsideHandler, true); return; }
  const root = document.getElementById(openId);
  if(root && root.contains(e.target)) return;
  MSEL_UI[openId].open = false;
  MSEL_UI[openId].q = '';
  document.removeEventListener('mousedown', mselOutsideHandler, true);
  if(typeof window.__mselRefresh === 'function') window.__mselRefresh();
}

let STAFF = [];        // [{id, dept, role}]
let SUBJECTS = [];     // [{id}]
let DEPARTMENTS = [];  // [{id, name}]
function staff(id){ return STAFF.find(s=>s.id===id); }
function subjectEmp(id){ return SUBJECTS.find(s=>s.id===id); }
function dept(id){ return DEPARTMENTS.find(d=>d.id===id); }
function deptByName(name){ return DEPARTMENTS.find(d=>d.name.toLowerCase()===String(name||'').toLowerCase()); }
function deptIdFor(name){
  const key = String(name||'').trim();
  if(!key) return null;
  let d = deptByName(key);
  if(!d){ d = {id:'D_'+key.replace(/[^a-z0-9]/gi,'').toUpperCase(), name:key}; DEPARTMENTS.push(d); }
  return d.id;
}

// Role/department are never given for an "M" code in this cache — there's
// no roster, only the flow log — so they're kept in an editable overlay
// (STAFF_META), seeded with a sensible default (manager, unassigned) so
// every view is reachable immediately, and adjustable from the "Acting
// as" bar to deliberately exercise the worker/manager/GM-scoped views.
const STAFF_META_KEY = 'opsdeck_staff_meta_v1';
let STAFF_META = {};
function loadStaffMeta(){
  try{ STAFF_META = JSON.parse(localStorage.getItem(STAFF_META_KEY) || '{}'); }catch(e){ STAFF_META = {}; }
}
function saveStaffMeta(){
  try{ localStorage.setItem(STAFF_META_KEY, JSON.stringify(STAFF_META)); }catch(e){}
}
function metaFor(id){
  const u = userFor(id);
  if(u){
    // Known Users-cache account — role/department always come live from the
    // cache. Never freeze this in STAFF_META: there's no "Acting as"
    // switcher to justify an override anymore, and a stale localStorage
    // entry from old testing would otherwise permanently mask the real
    // role/department every time this id shows up.
    return {role: u.roleTier, dept: u.deptName ? deptIdFor(u.deptName) : null};
  }
  if(!STAFF_META[id]){
    STAFF_META[id] = {role:'manager', dept:null}; // legacy/unknown M-code with no Users row — old default
  }
  return STAFF_META[id];
}

function registerStaff(id){
  if(!id || staff(id)) return;
  const m = metaFor(id);
  STAFF.push({id, role:m.role, dept:m.dept});
}
function registerSubject(id){
  if(!id || subjectEmp(id)) return;
  SUBJECTS.push({id});
}
function registerDeptToken(name){
  if(!name) return;
  deptIdFor(name);
}

function discoverDirectory(events, masters){
  STAFF = []; SUBJECTS = []; DEPARTMENTS = [];
  const touch = v=>{
    v = String(v||'').trim();
    if(!v) return;
    if(isStaffCode(v)) registerStaff(v);
    else if(isSubjectCode(v)) registerSubject(v);
    else registerDeptToken(v);
  };
  (events||[]).forEach(e=>{ touch(e.from); touch(e.performedBy); touch(e.to); });
  Object.values(masters||{}).forEach(m=>{ touch(m.createdBy); touch(m.assignedToInitial); touch(m.subjectId); });
  // Seed every known active user + their department too, so "Acting as",
  // department filters, and "Delegate to" pickers are populated from the
  // real roster (Users cache) even for people who haven't touched a ticket yet.
  USERS_LIST.forEach(u=>{
    if(u.status && u.status!=='active') return;
    if(u.deptName) deptIdFor(u.deptName);
    registerStaff(u.email);
  });
  // sync live role/dept from the (possibly just-edited) STAFF_META overlay

// nameOf() resolves any id/token this app ever stores in From/To/Assigned

/* ═══════════ CACHE — via shared cacheWatcher.js, with a safe fallback ═══════════ */
const _AP2_CACHE_KEY = 'ap2_ticLog';

if(typeof window.AP2CacheWatcher === 'undefined'){
  console.warn('[OpsDeck] cacheWatcher.js did not load — using local fallback');
  window.AP2CacheWatcher = (function(){
    const _IDB_NAME = 'ap2_fleet_cache', _IDB_STORE = 'datasets';
    let _conn = null;
    function _open(){
      if(_conn) return Promise.resolve(_conn);
      return new Promise((res, rej)=>{
        let done = false;
        const req = indexedDB.open(_IDB_NAME);
        const t = setTimeout(()=>{ if(!done){ done=true; rej(new Error('idb-open-timeout')); } }, 2000);
        req.onsuccess = e=>{ if(!done){ done=true; clearTimeout(t); _conn=e.target.result; res(_conn); } };
        req.onerror   = e=>{ if(!done){ done=true; clearTimeout(t); rej(e.target.error); } };
      });
    }
    return {
      init(){},
      subscribe(){ return ()=>{}; },
      notifyNow(){},
      getStatus(){ return {healthy:false, mode:'local-fallback', lastError:'cacheWatcher.js not loaded'}; },
      async readKey(key){
        try{
          const db = await _open();
          if(!db.objectStoreNames.contains(_IDB_STORE)) return null;
          const rec = await new Promise((res, rej)=>{
            const r = db.transaction(_IDB_STORE, 'readonly').objectStore(_IDB_STORE).get(key);
            r.onsuccess = ()=>res(r.result || null);
            r.onerror   = ()=>rej(r.error);
          });
          if(!rec || !rec.data) return null;
          if(Array.isArray(rec.data)) return rec.data.length ? rec.data : null;
          if(typeof rec.data==='object') return rec.data;
          return null;
        }catch(e){
          if(e && e.name==='NotFoundError') return null;
          console.warn('[OpsDeck] fallback read failed:', e.message);
          return null;
        }
      }
    };
  })();
}
async function _readCache(){ return AP2CacheWatcher.readKey(_AP2_CACHE_KEY); }

// Local-only overlay: tickets/events created *in this browser* aren't
// written back into the real cache (this page doesn't know the backend's
// write API) — they're kept in localStorage and replayed on top of
// whatever the real cache contains every time it (re)loads.
const LOCAL_OVERLAY_KEY = 'opsdeck_local_overlay_v2';
let LOCAL_EVENTS = [];   // same shape as a parsed event row, local:true
let LOCAL_MASTERS = {};  // ticketId -> master row, local:true
function saveOverlay(){
  try{ localStorage.setItem(LOCAL_OVERLAY_KEY, JSON.stringify({events:LOCAL_EVENTS, masters:LOCAL_MASTERS})); }catch(e){}
}
function loadOverlay(){
  try{
    const raw = JSON.parse(localStorage.getItem(LOCAL_OVERLAY_KEY)||'{}');
    LOCAL_EVENTS = Array.isArray(raw.events) ? raw.events : [];
    LOCAL_MASTERS = raw.masters && typeof raw.masters==='object' ? raw.masters : {};
  }catch(e){ LOCAL_EVENTS=[]; LOCAL_MASTERS={}; }
}
function applyOverlay(){
  LOCAL_EVENTS.forEach(e=>EVENTS.push(e));
  Object.keys(LOCAL_MASTERS).forEach(tid=>{ TICKET_MASTER[tid] = LOCAL_MASTERS[tid]; });
  EVENTS.sort((a,b)=>a.eventId-b.eventId);
}

/* ═══════════ Parsing ═══════════ */
function _pick(obj, keys){
  for(const k of keys){ if(obj[k]!==undefined && obj[k]!==null && obj[k]!=='') return obj[k]; }
  return '';
}
// payload.Ticket rows — the real flow/event log (misleadingly named).
function parseEventRow(r){
  if(!r) return null;
  const ticketId = String(_pick(r,['Ticket_ID','ticketId'])||'').trim();
  const action = String(_pick(r,['Action','action'])||'').trim();
  const eventIdRaw = _pick(r,['Event_ID','eventId']);
  const eventId = Number(eventIdRaw);
  if(!ticketId || !action || !eventIdRaw || Number.isNaN(eventId)) return null;
  return {
    eventId, ticketId, action,
    status: String(_pick(r,['Status','status'])||'').trim(),
    from: String(_pick(r,['From','from'])||'').trim(),
    performedBy: String(_pick(r,['Performed_By','performedBy'])||'').trim(),
    to: String(_pick(r,['To','to'])||'').trim(),
    detail: String(_pick(r,['Detail','detail'])||'').trim(),
    local: false,
  };
}
// payload.ticLog rows — the per-ticket master/creation record (misleadingly named).
function parseMasterRow(r){
  if(!r) return null;
  const ticketId = String(_pick(r,['Ticket_ID','ticketId'])||'').trim();
  if(!ticketId) return null;
  return {
    ticketId,
    creationEventId: Number(_pick(r,['Event_ID','eventId'])) || null,
    createdBy: String(_pick(r,['Created_By','createdBy'])||'').trim(),
    subjectType: String(_pick(r,['Subject_Type','subjectType'])||'Employee').trim(),
    subjectId: String(_pick(r,['Subject_ID','subjectId'])||'').trim(), // <-- Subject Employee (E2)
    assignedToInitial: String(_pick(r,['Assigned_To','assignedTo'])||'').trim(),
    assignmentType: String(_pick(r,['Assignment_Type','assignmentType'])||'').trim(),
    priority: String(_pick(r,['Priority','priority'])||'Medium').trim(),
    notes: String(_pick(r,['Notes','notes'])||'').trim(),
    local: false,
  };
}

let EVENTS = [];
let TICKET_MASTER = {};
let SUBJECT_EMPLOYEE_COLUMN_SEEN = false;

function rebuildFromRealCache(eventRowsRaw, masterRowsRaw){
  EVENTS = (eventRowsRaw||[]).map(parseEventRow).filter(Boolean);
  EVENTS.sort((a,b)=>a.eventId-b.eventId);
  TICKET_MASTER = {};
  (masterRowsRaw||[]).map(parseMasterRow).filter(Boolean).forEach(m=>{ TICKET_MASTER[m.ticketId]=m; });
  SUBJECT_EMPLOYEE_COLUMN_SEEN = Object.values(TICKET_MASTER).some(m=>m.subjectId);
  discoverDirectory(EVENTS, TICKET_MASTER);
  applyOverlay(); // replay this browser's own local tickets/events on top
  discoverDirectory(EVENTS, TICKET_MASTER); // re-scan including anything the overlay introduced
}

function ingestFromCachePayload(payload){
  if(!payload) return false;
  // payload.Ticket = flow/event log; payload.ticLog = per-ticket master.
  const eventRows = Array.isArray(payload.Ticket) ? payload.Ticket
    : (Array.isArray(payload) ? payload : null);
  if(!eventRows || !eventRows.length) return false;
  const masterRows = Array.isArray(payload.ticLog) ? payload.ticLog : [];
  parseUsers(payload);
  rebuildFromRealCache(eventRows, masterRows);
  return true;
}

async function loadTickets(){
  const alreadyHaveData = EVENTS.some(r=>!r.local);
  try{
    const payload = await _readCache();
    const applied = ingestFromCachePayload(payload);
    if(applied){
      render();
      refreshOpenDrawer();
    } else if(!alreadyHaveData){
      discoverDirectory(EVENTS, TICKET_MASTER);
      render();
    }
  }catch(err){
    console.error('[OpsDeck] loadTickets error:', err);
  }
}
let _emptyReadStreak = 0;
async function _applyFromCache(){
  try{
    const payload = await _readCache();
    const applied = ingestFromCachePayload(payload);
    if(applied){ _emptyReadStreak = 0; render(); refreshOpenDrawer(); }
    else if(EVENTS.some(r=>!r.local)){
      _emptyReadStreak++;
      if(_emptyReadStreak>=2){ EVENTS = EVENTS.filter(r=>r.local); TICKET_MASTER={}; discoverDirectory(EVENTS, TICKET_MASTER); applyOverlay(); render(); _emptyReadStreak=0; }
    }
  }catch(e){
    console.warn('[OpsDeck] background refresh error:', e.message);
  }
}
try{
  AP2CacheWatcher.init();
  AP2CacheWatcher.subscribe(()=>{ _applyFromCache(); });
}catch(e){
  console.warn('[OpsDeck] cacheWatcher wiring failed, continuing without live updates:', e.message);
}
window.addEventListener('message', (e)=>{
  if(!e.data) return;
  if(e.origin !== window.location.origin && e.origin !== 'null' && !e.origin.startsWith('https://effimalik.github.io')) return;
  if(e.data.type==='ap-theme' && e.data.theme){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  if(e.data.type==='ap-cache-preload' && e.data.datasets){
    const payload = e.data.datasets[_AP2_CACHE_KEY];
    if(ingestFromCachePayload(payload)){ render(); refreshOpenDrawer(); }
  }
  if(e.data.type==='ap-cache-ready' && e.data.key===_AP2_CACHE_KEY){
    if(ingestFromCachePayload(e.data.data)){ render(); refreshOpenDrawer(); }
  }
  if(e.data.type==='ap-cache-updated'){
    try{ window.parent.postMessage({type:'ap-cache-request', key:_AP2_CACHE_KEY}, '*'); }catch(err){}
  }
});
try{ window.parent.postMessage({type:'ap-cache-request', key:_AP2_CACHE_KEY}, '*'); }catch(e){}

/* ═══════════ Ticket accessors ═══════════ */
function allTicketIds(){ return [...new Set(EVENTS.map(r=>r.ticketId))]; }
function ticketEvents(tid){ return EVENTS.filter(r=>r.ticketId===tid).sort((a,b)=>a.eventId-b.eventId); }
function ticketTimeline(tid){ return ticketEvents(tid); }
function master(tid){ return TICKET_MASTER[tid] || null; }
function isTerminal(status){ return status==='RESOLVED'; }
function ticketTitle(tid){ const m=master(tid); return (m && m.notes) || 'Untitled ticket'; }
function ticketDescription(tid){
  const evs = ticketEvents(tid);
  const created = evs.find(e=>e.action==='CREATED');
  return (created && created.detail) || (master(tid) && master(tid).notes) || '';
}
// currentOwner(): the CURRENT, changing state of a ticket — status and who
// it's with come straight off the latest event row (no derivation/regex
// needed, the real log already carries Status per row). Fixed facts
// (Subject Employee/E2, Requester, original Priority) come from the
// ticket's master row and never change, exactly per the Fixed/Changing
// split in the requirement (§9).
function currentOwner(tid){
  const evs = ticketEvents(tid);
  if(!evs.length) return null;
  const latest = evs[evs.length-1];
  const m = master(tid) || {};
  return {
    status: latest.status || 'NEW',
    assignedTo: latest.to,
    performedBy: latest.performedBy,
    action: latest.action,
    eventId: latest.eventId,
    priority: m.priority || 'Medium',
    subjectId: m.subjectId || '',       // Subject Employee (E2) — fixed
    subjectType: m.subjectType || 'Employee',
    createdBy: m.createdBy || (evs[0] && evs[0].performedBy) || '',
  };
}

/* ═══════════ Reminder engine (computed live from the event log) ═══════════
   A REMINDER event's Detail carries its own due date/time ("Reminder:
   10-Aug-2026 15:00"); Event_ID is deliberately NOT used for this — it's
   the flow-ordering timestamp, not necessarily wall-clock accurate far
   into a demo, whereas the Detail's due date is the actual commitment
   made on the ticket. A REMINDER is "live" (can go overdue) until either
   a REMINDER_ATTENDED, a newer REMINDER, or a terminal/hold status
   supersedes it. */
function latestLiveReminder(tid){
  const evs = ticketEvents(tid);
  let live = null;
  for(const e of evs){
    if(e.action==='REMINDER') live = e;
    else if(e.action==='REMINDER_ATTENDED') live = null;
  }
  return live;
}
function overdueInfo(tid){
  const owner = currentOwner(tid);
  if(!owner) return {overdue:false};
  if(isTerminal(owner.status) || owner.status==='ON HOLD') return {overdue:false};
  const r = latestLiveReminder(tid);
  if(!r) return {overdue:false};
  const dueAt = parseReminderDetail(r.detail);
  if(!dueAt) return {overdue:false};
  const now = nowMs();
  if(now < dueAt) return {overdue:false, dueAt};
  return {overdue:true, elapsed: now-dueAt, dueAt};
}
function tickReminderEngine(){
  if(demoOffsetMs<=0) return; // only once the demo clock has been fast-forwarded
  allTicketIds().forEach(tid=>{
    const od = overdueInfo(tid);
    if(!od.overdue) return;
    const evs = ticketEvents(tid);
    const last = evs[evs.length-1];
    if(last.action==='REMINDER_ALERT') return; // already alerted for this reminder
    fireReminderAlert(tid);
  });
}

/* ═══════════ Mutations (append-only) ═══════════ */
let seq = 0;
function genEventId(){ return nowMs() + (seq++ % 900); }
function nextTicketId(){
  let max = 5000;
  allTicketIds().forEach(tid=>{
    const m = String(tid).match(/(\d+)\s*$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'TK-' + (max+1);
}
function appendEvent({ticketId, action, status, from, performedBy, to, detail}){
  const row = {eventId:genEventId(), ticketId, action, status, from:from||'', performedBy:performedBy||'', to:to||'', detail:detail||'', local:true};
  EVENTS.push(row);
  LOCAL_EVENTS.push(row);
  saveOverlay();
  return row;
}

// Ticket creation: captures the fixed E2 (subjectEmployeeId) and lets the
// creator DELEGATE it straight to a department queue OR directly to a
// specific person in one step (requirement §5 vs §6, chosen at creation).
function createTicket({creatorId, title, description, priority, subjectType, subjectEmployeeId, targetType, target}){
  const ticketId = nextTicketId();
  const ev = appendEvent({
    ticketId, action:'CREATED', status:'NEW',
    from:'', performedBy:creatorId, to:target,
    detail: description || title,
  });
  const m = {
    ticketId, creationEventId: ev.eventId, createdBy:creatorId,
    subjectType: subjectType||'Employee', subjectId: subjectEmployeeId,
    assignedToInitial: target, assignmentType: targetType==='department' ? 'DEPARTMENT' : 'PERSON',
    priority: priority||'Medium', notes: title, local:true,
  };
  TICKET_MASTER[ticketId] = m;
  LOCAL_MASTERS[ticketId] = m;
  discoverDirectory(EVENTS, TICKET_MASTER);
  saveOverlay();
  return ticketId;
}
function acceptTicket({ticketId, actorId}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'ACCEPTED', status:'IN PROGRESS', from:owner.assignedTo, performedBy:actorId, to:actorId, detail:'Ticket accepted.'});
}
// Transfer covers BOTH requirement flows: to a Department (re-queues,
// anyone in that department can accept) and Delegate directly to a Person
// (also re-queues to NEW — matching the real TK-5002 sample exactly,
// where even a direct hand-off to M005 still needed its own ACCEPTED
// event before work began).
function transferTicket({ticketId, actorId, targetType, target, reason}){
  const label = targetType==='department' ? deptNameOfTarget(target) : nameOf(target);
  appendEvent({
    ticketId, action:'TRANSFERRED', status:'NEW',
    from:actorId, performedBy:actorId, to:target,
    detail: reason || (targetType==='department' ? `Transferred to ${label} department.` : `Directly transferred to ${label}.`),
  });
}
function holdTicket({ticketId, actorId, reason}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'ON_HOLD', status:'ON HOLD', from:owner.assignedTo, performedBy:actorId, to:owner.assignedTo, detail:reason||'Put on hold.'});
}
function resumeTicket({ticketId, actorId, note}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'RESUMED', status:'IN PROGRESS', from:owner.assignedTo, performedBy:actorId, to:owner.assignedTo, detail:note||'Resumed.'});
}
function addComment({ticketId, actorId, comment}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'COMMENT', status:owner.status, from:owner.assignedTo, performedBy:actorId, to:owner.assignedTo, detail:comment});
}
function setReminder({ticketId, actorId, dueAtMs}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'REMINDER', status:owner.status, from:owner.assignedTo, performedBy:actorId, to:owner.assignedTo, detail:fmtReminderDetail(dueAtMs)});
}
function attendReminder({ticketId, actorId, note}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'REMINDER_ATTENDED', status:owner.status, from:owner.assignedTo, performedBy:actorId, to:owner.assignedTo, detail:note||'Reminder attended.'});
}
function fireReminderAlert(ticketId){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'REMINDER_ALERT', status:owner.status, from:owner.assignedTo, performedBy:owner.assignedTo, to:owner.assignedTo, detail:'Automated: reminder overdue, no response yet.'});
}
function resolveTicket({ticketId, actorId, comment}){
  const owner = currentOwner(ticketId);
  appendEvent({ticketId, action:'RESOLVED', status:'RESOLVED', from:owner.assignedTo, performedBy:actorId, to:owner.assignedTo, detail:comment||'Resolved.'});
}
