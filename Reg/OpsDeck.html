      <div class="brand"><span class="dot"></span>OpsDeck</div>
      <nav class="tabs">
        <button data-view="my" class="${state.view==='my'?'active':''}">My Portal${myCount?`<span class="badge-count">${myCount}</span>`:''}</button>
        ${manager && u.dept ? `<button data-view="dept" class="${state.view==='dept'?'active':''}">Department${dCount?`<span class="badge-count">${dCount}</span>`:''}</button>`:''}
        ${!gm && !manager ? `<button data-view="dept" class="${state.view==='dept'?'active':''}">Department tasks</button>`:''}
        <button data-view="flow" class="${state.view==='flow'?'active':''}">Flow Finder</button>
        ${gm ? `<button data-view="org" class="${state.view==='org'?'active':''}">Org Overview${orgCount?`<span class="badge-count">${orgCount}</span>`:''}</button>`:''}
      </nav>
      <div class="topbar-spacer"></div>
      <button class="fab-new" id="newTicketBtn" title="New Ticket" aria-label="New Ticket">+</button>
      <div class="userbox">
        <span class="role-pill">${roleLabel}</span>
        <span class="userbox-name">${nameOf(u.id)}${u.dept && dept(u.dept) ? ` · ${dept(u.dept).name}` : ''}</span>
      </div>
    </div>
    <div class="demo-clock" title="Fast-forward time to see the reminder engine escalate without waiting real hours">
      <span class="dc-label">Fast-forward</span>
      <button data-ff="900000">+15m</button>
      <button data-ff="3600000">+1h</button>
      <button data-ff="14400000">+4h</button>
      <button data-ff="reset">reset</button>
      ${demoOffsetMs>0 ? `<span class="dc-offset">+${fmtDur(demoOffsetMs)} ahead</span>` : ''}
    </div>
  </div>`;
}

function renderView(u){
  const manager = isManager(u.id), gm = isGM(u.id);
  if(!gm && state.view==='org') state.view='my';
  switch(state.view){
    case 'my': return renderMyPortal(u);
    case 'dept': return manager ? renderDeptPortal(u) : renderDeptReadOnly(u);
    case 'flow': return renderFlowFinder(u);
    case 'org': return renderOrgOverview(u);
    default: return '';
  }
}

// ----- Ticket row renderer -----
function actionLabel(action){
  return {
    CREATED:'Created', ASSIGNED:'Assigned', ACCEPTED:'Accepted', COMMENT:'Comment',
    ON_HOLD:'On hold', RESUMED:'Resumed', REMINDER:'Reminder set',
    REMINDER_ALERT:'Reminder overdue', REMINDER_ATTENDED:'Reminder attended',
    TRANSFERRED:'Transferred', RESOLVED:'Resolved',
  }[action] || action;
}
function ticketRow(tid, opts={}){
  const owner = currentOwner(tid);
  const title = ticketTitle(tid);
  const od = overdueInfo(tid);
  const subLabel = opts.subLabel || `With ${nameOf(owner.assignedTo)}`;
  return `
  <div class="ticket-row" data-open-ticket="${tid}">
    <div class="pri-flag pri-${owner.priority}"></div>
    <div class="t-main">
      <div class="t-title">${title} <span class="tid">#${tid}</span> ${owner.subjectType?`<span class="type-chip">${owner.subjectType}</span>`:''}</div>
      <div class="t-sub">For ${owner.subjectId ? nameOf(owner.subjectId) : '—'} · ${subLabel} · raised by ${nameOf(owner.createdBy)}</div>
    </div>
    ${od.overdue ? `<div class="overdue-flag">⚠ overdue ${fmtDur(od.elapsed)}</div>` : ''}
    <div class="status-chip ${statusClass(owner.status)}">${owner.status}</div>
  </div>`;
}

// ----- My Portal -----
function renderMyPortal(u){
  const mine = allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.assignedTo===u.id;
  }).sort((a,b)=> currentOwner(b).eventId - currentOwner(a).eventId);

  const filter = state.myStatusFilter;
  const filtered = mine.filter(tid=> matchesStatusFilter(currentOwner(tid).status, filter));

  const body = filter==='all'
    ? (()=>{
        const open = mine.filter(tid=>!isTerminal(currentOwner(tid).status));
        const done = mine.filter(tid=>isTerminal(currentOwner(tid).status));
        return `
        <div class="section-label">Needs attention (${open.length})</div>
        ${open.length ? `<div class="ticket-list">${open.map(t=>ticketRow(t)).join('')}</div>` : `<div class="empty"><b>All clear.</b>Nothing waiting on you right now.</div>`}
        ${done.length ? `
        <div class="section-label">Resolved (${done.length})</div>
        <div class="ticket-list">${done.map(t=>ticketRow(t)).join('')}</div>` : ''}`;
      })()
    : (filtered.length
        ? `<div class="ticket-list">${filtered.map(t=>ticketRow(t)).join('')}</div>`
        : `<div class="empty"><b>No matches.</b>Nothing with that status right now.</div>`);

  // Tickets sitting in MY department's queue, unclaimed (Status NEW, To =
  // my department) — the requirement's "New Ticket" queue (§2), reachable
  // straight from My Portal for a worker who isn't a manager too.
  const queue = u.dept ? allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.status==='NEW' && deptNameOfTarget(o.assignedTo)===dept(u.dept).name;
  }) : [];

  return `
  <div class="grid2">
    ${profileCard(u)}
    <div>
      <h1 class="page-title">My Portal</h1>
      <p class="page-sub">Tickets currently assigned to you. Tap one to see the full timeline and respond.</p>
      ${queue.length ? `
      <div class="section-label">New in ${dept(u.dept).name} — unclaimed (${queue.length})</div>
      <div class="ticket-list">${queue.map(t=>ticketRow(t,{subLabel:`New — waiting for someone to accept`})).join('')}</div>` : ''}
      <div class="section-label" style="margin-top:22px;">My tickets</div>
      ${statusFilterBar(filter, 'mystatus')}
      ${body}
    </div>
  </div>`;
}

function profileCard(u){
  const d = u.dept ? dept(u.dept) : null;
  const openCt = myOpenCount(u.id);
  const resolvedCt = allTicketIds().filter(tid=>{
    const o=currentOwner(tid); return o && o.assignedTo===u.id && isTerminal(o.status);
  }).length;
  const roleName = isGM(u.id) ? 'General Manager' : isManager(u.id) ? 'Manager' : 'Worker';
  return `
  <div class="card profile-card">
    <div class="avatar">${nameOf(u.id).slice(0,2).toUpperCase()}</div>
    <h2>${nameOf(u.id)}</h2>
    <p class="role-line">${roleName}${d?` · ${d.name}`:''}</p>
    <div class="meta-row"><span>Email / code</span><span>${u.id}</span></div>
    ${d ? `<div class="meta-row"><span>Department</span><span>${d.name}</span></div>` : ''}
    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${openCt}</div><div class="l">Open</div></div>
      <div class="stat-chip"><div class="n">${resolvedCt}</div><div class="l">Resolved</div></div>
    </div>
  </div>`;
}

// ----- Department Portal -----
function renderDeptPortal(u){
  if(!isManager(u.id) || !u.dept) return renderMyPortal(u);
  return renderDeptReadOnly(u, {manager:true});
}
function renderDeptReadOnly(u, opts={}){
  const d = u.dept ? dept(u.dept) : null;
  if(!d) return renderMyPortal(u);
  const inDept = allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && deptNameOfTarget(o.assignedTo)===d.name;
  }).concat(deptWorkers(u.dept).flatMap(w=>allTicketIds().filter(tid=>{
    const o = currentOwner(tid); return o && o.assignedTo===w.id;
  })));
  const uniqueIds = [...new Set(inDept)];
  const filter = state.deptStatusFilter;
  const filtered = uniqueIds.filter(tid=> matchesStatusFilter(currentOwner(tid).status, filter));
  const teamCount = deptWorkers(u.dept).length;
  return `
  <h1 class="page-title">${d.name} — Department</h1>
  <p class="page-sub">${opts.manager ? `Every ticket routed to ${d.name} (${teamCount} member${teamCount===1?'':'s'} on the team), unclaimed or with a teammate. Open one to accept or reassign.` : `Read-only view of tickets routed to ${d.name}. Your own items are in My Portal.`}</p>
  ${statusFilterBar(filter, 'deptstatus')}
  ${filtered.length ? `<div class="ticket-list">${filtered.map(t=>ticketRow(t)).join('')}</div>` : `<div class="empty"><b>Nothing here.</b>No tickets match that filter for ${d.name}.</div>`}
  `;
}

/* ═══════════ Flow Finder — Ticket ID, Subject Employee, Employee ID,
   Handler, Requester, Department, Status, Date range (requirement §10) */
function ticketTouchesDept(tid, deptId){
  const d = dept(deptId);
  if(!d) return false;
  return ticketEvents(tid).some(e=> deptNameOfTarget(e.to)===d.name || deptNameOfTarget(e.from)===d.name)
    || deptWorkers(deptId).some(w=> ticketEvents(tid).some(e=>e.performedBy===w.id || e.to===w.id));
}
function uniqueSubjectEmployees(){
  const seen = new Set();
  Object.values(TICKET_MASTER).forEach(m=>{ if(m.subjectId) seen.add(m.subjectId); });
  return [...seen].sort();
}
function uniqueHandlers(){
  const seen = new Set();
  EVENTS.forEach(e=>{ if(isStaffCode(e.performedBy)) seen.add(e.performedBy); if(isStaffCode(e.to)) seen.add(e.to); });
  return [...seen].sort();
}
function uniqueRequesters(){
  const seen = new Set();
  Object.values(TICKET_MASTER).forEach(m=>{ if(m.createdBy) seen.add(m.createdBy); });
  return [...seen].sort();
}

function renderFlowFinder(u){
  const scoped = isManager(u.id) && u.dept;
  const modeOpts = [
    ['ticket','Ticket'], ['subjectEmployee','Subject Employee'], ['handler','Handler'],
    ['requester','Requester'], ['department','Department'], ['status','Status'], ['daterange','Date range'],
  ];
  let matches = [];

  if(state.ffMode==='ticket'){
    matches = allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      if(!state.ffQuery) return true;
      const q = state.ffQuery.toLowerCase();
      if(String(tid).toLowerCase().includes(q)) return true;
      if(ticketTitle(tid).toLowerCase().includes(q)) return true;
      const m = master(tid);
      if(m && m.subjectId && m.subjectId.toLowerCase().includes(q)) return true;
      return ticketEvents(tid).some(e=>
        nameOf(e.to).toLowerCase().includes(q) || nameOf(e.performedBy).toLowerCase().includes(q)
      );
    });
  } else if(state.ffMode==='subjectEmployee'){
    matches = state.ffQuery ? allTicketIds().filter(tid=>{
      const m = master(tid); return m && m.subjectId===state.ffQuery;
    }) : [];
  } else if(state.ffMode==='handler'){
    matches = state.ffMulti.length ? allTicketIds().filter(tid=>{
      return ticketEvents(tid).some(e=> state.ffMulti.includes(e.performedBy) || state.ffMulti.includes(e.to));
    }) : [];
  } else if(state.ffMode==='requester'){
    matches = state.ffMulti.length ? allTicketIds().filter(tid=>{
      const m = master(tid); return m && state.ffMulti.includes(m.createdBy);
    }) : [];
  } else if(state.ffMode==='department'){
    const targetDeptIds = scoped ? [u.dept] : state.ffMulti;
    matches = targetDeptIds.length ? allTicketIds().filter(tid=> targetDeptIds.some(id=>ticketTouchesDept(tid, id))) : [];
  } else if(state.ffMode==='status'){
    matches = state.ffQuery ? allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      return currentOwner(tid).status===state.ffQuery;
    }) : [];
  } else if(state.ffMode==='daterange'){
    const fromMs = state.ffFrom ? new Date(state.ffFrom+'T00:00:00').getTime() : null;
    const toMs = state.ffTo ? new Date(state.ffTo+'T23:59:59').getTime() : null;
    matches = (fromMs || toMs) ? allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      const created = ticketEvents(tid)[0];
      if(!created) return false;
      if(fromMs && created.eventId < fromMs) return false;
      if(toMs && created.eventId > toMs) return false;
      return true;
    }) : [];
  }

  const resultsHtml = matches.length ? matches.map(t=>ticketRow(t)).join('') :
    `<div class="empty"><b>No matches.</b>Try a different search.</div>`;

  const subjectEmployeeOptions = uniqueSubjectEmployees();
  const handlerOptions = uniqueHandlers().filter(v => !scoped || (staff(v) && staff(v).dept===u.dept));
  const requesterOptions = uniqueRequesters();
  const departmentOptions = DEPARTMENTS;

  let queryControl;
  if(state.ffMode==='ticket'){
    queryControl = `<input type="text" id="ffQuery" placeholder="Search by ticket #, title, or Subject Employee (E-code)…" value="${state.ffQuery.replace(/"/g,'&quot;')}" style="background:var(--panel-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 12px;font-size:13.5px;flex:1;">`;
  } else if(state.ffMode==='subjectEmployee'){
    queryControl = `<select id="ffQuery" style="background:var(--panel-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 12px;font-size:13.5px;flex:1;">
      <option value="">${subjectEmployeeOptions.length ? 'Choose the Subject Employee (E2)…' : 'No Subject Employee data yet'}</option>
      ${subjectEmployeeOptions.map(v=>`<option value="${v}" ${state.ffQuery===v?'selected':''}>${v}</option>`).join('')}
    </select>`;
  } else if(state.ffMode==='handler'){
    const opts = handlerOptions.map(v=>{ const uu = userFor(v); return {value:v, label: uu ? uu.name : v, sub: uu ? uu.email : ''}; });
    queryControl = `<div style="flex:1;">${renderMultiSelect('ffHandlerMsel', opts, state.ffMulti, {
      placeholder: opts.length ? 'Select one or more handlers…' : 'No handlers yet',
      searchPlaceholder:'Search by name or email…'
    })}</div>`;
  } else if(state.ffMode==='requester'){
    const opts = requesterOptions.map(v=>{ const uu = userFor(v); return {value:v, label: uu ? uu.name : v, sub: uu ? uu.email : ''}; });
    queryControl = `<div style="flex:1;">${renderMultiSelect('ffRequesterMsel', opts, state.ffMulti, {
      placeholder: opts.length ? 'Select one or more requesters…' : 'No requesters yet',
      searchPlaceholder:'Search by name or email…'
    })}</div>`;
  } else if(state.ffMode==='department'){
    queryControl = scoped
      ? `<div class="hint" style="padding:9px 0;">Scoped to ${dept(u.dept).name} — managers see their own department only.</div>`
      : `<div style="flex:1;">${renderMultiSelect('ffDeptMsel', departmentOptions.map(d=>({value:d.id, label:d.name})), state.ffMulti, {
          placeholder: departmentOptions.length ? 'Select one or more departments…' : 'No departments yet',
          searchPlaceholder:'Search departments…'
        })}</div>`;
  } else if(state.ffMode==='status'){
    queryControl = `<select id="ffQuery" style="background:var(--panel-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 12px;font-size:13.5px;flex:1;">
      <option value="">Choose a status…</option>
      ${TICKET_STATUSES.map(v=>`<option value="${v}" ${state.ffQuery===v?'selected':''}>${v}</option>`).join('')}
    </select>`;
  } else if(state.ffMode==='daterange'){
    queryControl = `<input type="date" id="ffFrom" value="${state.ffFrom}" style="background:var(--panel-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 12px;font-size:13.5px;">
      <span style="color:var(--text-muted);">to</span>
      <input type="date" id="ffTo" value="${state.ffTo}" style="background:var(--panel-raised);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 12px;font-size:13.5px;">
      <span class="hint" style="flex-basis:100%;">Filters by each ticket's CREATED event — Event_ID doubles as its timestamp.</span>`;
  }

  return `
  <h1 class="page-title">Flow Finder</h1>
  <p class="page-sub">${scoped ? `Search tickets that have passed through ${dept(u.dept).name}.` : 'Search across every ticket ever logged.'} Open one for the full timeline.</p>
  ${!SUBJECT_EMPLOYEE_COLUMN_SEEN ? `<div class="empty" style="text-align:left;padding:12px 14px;margin-bottom:14px;border-color:var(--amber-dim);">
    <b style="color:var(--amber);font-size:13px;">No Subject Employee (E2) values found yet.</b>
    The connected ticLog master rows have a Subject_ID column, but nothing in it is filled in yet — searches by Subject Employee won't return anything until a ticket carries one.
  </div>` : ''}
  <div class="subtabs">
    ${modeOpts.map(([k,l])=>`<button data-ffmode="${k}" class="${state.ffMode===k?'active':''}">${l}</button>`).join('')}
  </div>
  <div class="ff-searchbar">${queryControl}</div>
  ${state.ffSelectedTicket ? renderTimelineView(state.ffSelectedTicket, u) : `<div class="ff-results">${resultsHtml}</div>`}
  `;
}

function kindOfAction(action){
  if(action==='CREATED') return 'created';
  if(action==='TRANSFERRED' || action==='ASSIGNED') return 'forward';
  if(action==='ACCEPTED') return 'accept';
  if(action==='ON_HOLD') return 'hold';
  if(action==='RESUMED') return 'resume';
  if(action==='COMMENT') return 'comment';
  if(action==='REMINDER' || action==='REMINDER_ALERT') return 'reminder';
  if(action==='REMINDER_ATTENDED') return 'result';
  if(action==='RESOLVED') return 'resolved';
  return 'forward';
}
function kindIcon(k){
  return {created:'◆', forward:'→', accept:'✓', hold:'⏸', resume:'▶', comment:'💬', reminder:'⏰', result:'↩', resolved:'✓'}[k] || '•';
}

function renderTimelineView(tid, u){
  const rows = ticketTimeline(tid);
  const m = master(tid);
  const owner = currentOwner(tid);
  let items = '';
  rows.forEach((r,i)=>{
    const k = kindOfAction(r.action);
    const gap = i>0 ? fmtDur(r.eventId - rows[i-1].eventId) : null;
    const whoLine = `${nameOf(r.performedBy)}${r.to && r.to!==r.performedBy ? ` → ${nameOf(r.to)}` : ''}`;
    items += `
    <div class="tl-item k-${k}">
      ${gap ? `<div class="tl-gap">+${gap}</div>` : ''}
      <div class="tl-dot">${kindIcon(k)}</div>
      <div class="tl-card">
        <div class="tl-head">
          <span class="tl-action">${actionLabel(r.action)}</span>
          <span class="tl-ts">${fmtTs(r.eventId)}</span>
        </div>
        <div class="tl-who">${whoLine} · <span class="status-chip ${statusClass(r.status)}" style="padding:1px 7px;font-size:10px;">${r.status}</span></div>
        ${r.detail ? `<div class="tl-notes">${r.detail}</div>` : ''}
      </div>
    </div>`;
  });
  return `
  <button class="btn btn-ghost btn-sm" id="ffBack">← Back to results</button>
  <div class="card" style="margin-top:12px;">
    <div class="kicker">Ticket #${tid}</div>
    <h2 style="font-family:var(--font-display);margin:0 0 4px;">${ticketTitle(tid)}</h2>
    <p class="page-sub" style="margin-bottom:2px;">
      <b style="color:var(--text-dim);">Subject Employee (E2):</b> ${owner.subjectId ? nameOf(owner.subjectId) : '<span style="color:var(--red);">not recorded</span>'}
      &nbsp;·&nbsp; Requester: ${owner.createdBy ? nameOf(owner.createdBy) : '—'}
      &nbsp;·&nbsp; Priority: ${owner.priority}
    </p>
    <p class="page-sub" style="margin-bottom:0;">Every logged event for this ticket, oldest to newest. Event_ID doubles as the timestamp (down to the second).</p>
    <div class="tl-wrap"><div class="timeline">${items}</div></div>
  </div>
  ${renderRespondPanel(tid, u)}
  `;
}

/* ═══════════ Respond panel — permission gate covers every real action:
   Accept (from a dept queue or a direct hand-off), Comment, Hold/Resume,
   Set/Attend Reminder, Transfer (to dept or delegate to a person),
   Resolve. */
function respondPermission(tid, u){
  const owner = currentOwner(tid);
  if(!owner) return {mode:'none'};
  if(isTerminal(owner.status)) return {mode:'none'};
  if(isGM(u.id)) return {mode:'none'}; // GM: read-only oversight
  if(owner.status==='NEW'){
    const target = owner.assignedTo;
    if(isDeptToken(target)){
      const td = deptByName(target);
      if(isManager(u.id) && u.dept && td && td.id===u.dept) return {mode:'accept-dept'};
      if(!isManager(u.id) && u.dept && td && td.id===u.dept) return {mode:'accept-dept'};
      return {mode:'none'};
    }
    if(target===u.id) return {mode:'accept-direct'};
    return {mode:'none'};
  }
  if(owner.assignedTo===u.id){
    return {mode:'full', ticketStatus:owner.status};
  }
  const ownerStaff = staff(owner.assignedTo);
  if(isManager(u.id) && u.dept && ownerStaff && ownerStaff.dept===u.dept){
    return {mode:'oversee'};
  }
  return {mode:'none'};
}

function renderRespondPanel(tid, u){
  const perm = respondPermission(tid, u);
  const owner = currentOwner(tid);
  if(perm.mode==='none') return '';
  if(perm.mode==='accept-dept' || perm.mode==='accept-direct'){
    return `
    <div class="card" style="margin-top:14px;">
      <div class="section-label" style="margin-top:0;">New ticket — accept it?</div>
      <p class="hint" style="margin-bottom:10px;">${perm.mode==='accept-dept' ? `Unclaimed in ${nameOf(owner.assignedTo)}. Any member of that department can accept it.` : `Directly transferred to you. Accept it to start working, or hand it off again.`}</p>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" data-respond="accept" data-tid="${tid}">Accept</button>
        <button class="btn btn-sm" data-respond="transferPerson" data-tid="${tid}">Delegate to someone else</button>
      </div>
    </div>`;
  }
  if(perm.mode==='oversee'){
    return `
    <div class="card" style="margin-top:14px;">
      <div class="section-label" style="margin-top:0;">Manager oversight</div>
      <p class="hint" style="margin-bottom:10px;">Currently with ${nameOf(owner.assignedTo)}. You can transfer it within ${u.dept ? dept(u.dept).name : 'your team'}.</p>
      <div class="btn-row">
        <button class="btn btn-sm" data-respond="transferPerson" data-tid="${tid}">Reassign</button>
      </div>
    </div>`;
  }
  // full: owner === current actor
  const canTransferDept = true;
  return `
  <div class="card" style="margin-top:14px;">
    <div class="section-label" style="margin-top:0;">Respond to this ticket</div>
    <div class="btn-row">
      ${owner.status==='ON HOLD'
        ? `<button class="btn btn-primary btn-sm" data-respond="resume" data-tid="${tid}">Resume</button>`
        : `<button class="btn btn-sm" data-respond="hold" data-tid="${tid}">Put on hold</button>`}
      <button class="btn btn-sm" data-respond="comment" data-tid="${tid}">Add comment</button>
      <button class="btn btn-amber btn-sm" data-respond="reminder" data-tid="${tid}">Set reminder</button>
      ${overdueInfo(tid).overdue ? `<button class="btn btn-sm" data-respond="attend" data-tid="${tid}">Attend reminder</button>` : ''}
      <button class="btn btn-sm" data-respond="transferPerson" data-tid="${tid}">Delegate to person</button>
      ${canTransferDept ? `<button class="btn btn-sm" data-respond="transferDept" data-tid="${tid}">Transfer to department</button>` : ''}
      <button class="btn btn-primary btn-sm" data-respond="resolve" data-tid="${tid}">Resolve</button>
    </div>
  </div>`;
}

// ----- Org Overview (GM) -----
function renderOrgOverview(u){
  const groups = DEPARTMENTS.map(d=>{
    const tids = allTicketIds().filter(tid=> deptNameOfTarget(currentOwner(tid).assignedTo)===d.name);
    return {dept:d, tids};
  });
  return `
  <h1 class="page-title">Org Overview</h1>
  <p class="page-sub">Read-only view across every department's tickets, wherever they currently sit. Use Flow Finder to inspect any of them in detail.</p>
  ${groups.map(g=>`
    <div class="section-label">${g.dept.name} (${g.tids.length})</div>
    ${g.tids.length ? `<div class="ticket-list">${g.tids.map(t=>ticketRow(t)).join('')}</div>` : `<div class="empty">Nothing currently in ${g.dept.name}.</div>`}
  `).join('')}
  `;
}

// ---------- Toast ----------
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ═══════════ Respond modal — one modal, branches per action ═══════════ */
function openRespondModal(kind, tid){
  const actor = currentUser();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  const titles = {
    accept:'Accept ticket', hold:'Put on hold', resume:'Resume', comment:'Add comment',
    reminder:'Set reminder', attend:'Attend reminder', transferPerson:'Delegate to a person',
    transferDept:'Transfer to a department', resolve:'Resolve ticket',
  };
  let extra = '';
  let needsComment = true;
  if(kind==='reminder'){
    const in1h = new Date(nowMs()+3600000);
    const defVal = `${in1h.getFullYear()}-${pad(in1h.getMonth()+1)}-${pad(in1h.getDate())}T${pad(in1h.getHours())}:${pad(in1h.getMinutes())}`;
    extra = `<div class="field"><label>Remind at</label><input type="datetime-local" id="rm-when" value="${defVal}"></div>`;
    needsComment = false;
  } else if(kind==='transferPerson'){
    const people = assignablePeopleFor(actor.id).filter(e=>e.id!==actor.id).concat(isManager(actor.id)||isGM(actor.id) ? STAFF.filter(e=>e.id!==actor.id) : []);
    const uniquePeople = [...new Map(people.map(p=>[p.id,p])).values()];
    extra = `<div class="field"><label>Delegate to</label><select id="rm-person">${uniquePeople.map(e=>`<option value="${e.id}">${nameEmailLabel(e.id)}${e.dept&&dept(e.dept)?` — ${dept(e.dept).name}`:''}</option>`).join('')}</select></div>`;
  } else if(kind==='transferDept'){
    extra = `<div class="field"><label>Transfer to department</label><select id="rm-dept">${DEPARTMENTS.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select></div>`;
  } else if(kind==='accept'){
    needsComment = false;
  }
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${titles[kind]}</h3>
      <p class="modal-sub">#${tid} · ${ticketTitle(tid)}</p>
      ${extra}
      <div class="field"><label>Comment${needsComment?' (required)':' (optional)'}</label><textarea id="rm-comment" placeholder="What's the update?"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rm-cancel">Cancel</button>
        <button class="btn btn-primary" id="rm-confirm">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#rm-cancel').onclick=()=>backdrop.remove();
  backdrop.querySelector('#rm-confirm').onclick=()=>{
    const comment = backdrop.querySelector('#rm-comment').value.trim();
    if(needsComment && !comment){ toast('A comment is required before you can respond.'); return; }
    const actorId = state.currentUserId;
    if(kind==='accept'){
      acceptTicket({ticketId:tid, actorId});
      toast('Ticket accepted.');
    } else if(kind==='hold'){
      holdTicket({ticketId:tid, actorId, reason:comment});
      toast('Put on hold.');
    } else if(kind==='resume'){
      resumeTicket({ticketId:tid, actorId, note:comment});
      toast('Resumed.');
    } else if(kind==='comment'){
      addComment({ticketId:tid, actorId, comment});
      toast('Comment added.');
    } else if(kind==='reminder'){
      const when = backdrop.querySelector('#rm-when').value;
      if(!when){ toast('Pick a date/time first.'); return; }
      setReminder({ticketId:tid, actorId, dueAtMs:new Date(when).getTime()});
      toast('Reminder set.');
    } else if(kind==='attend'){
      attendReminder({ticketId:tid, actorId, note:comment});
      toast('Reminder attended.');
    } else if(kind==='transferPerson'){
      const person = backdrop.querySelector('#rm-person').value;
      transferTicket({ticketId:tid, actorId, targetType:'person', target:person, reason:comment});
      toast(`Delegated to ${nameOf(person)} — waiting for them to accept.`);
    } else if(kind==='transferDept'){
      const deptId = backdrop.querySelector('#rm-dept').value;
      transferTicket({ticketId:tid, actorId, targetType:'department', target:dept(deptId).name, reason:comment});
      toast(`Transferred to ${dept(deptId).name} — waiting for someone to accept.`);
    } else if(kind==='resolve'){
      resolveTicket({ticketId:tid, actorId, comment});
      toast('Resolved.');
    }
    backdrop.remove();
    render();
  };
}

/* ═══════════ Wiring ═══════════ */
function wireGlobal(){
  document.querySelectorAll('[data-ff]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.ff==='reset') demoOffsetMs = 0;
      else demoOffsetMs += parseInt(b.dataset.ff,10);
      render();
    };
  });
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick=()=>{ state.view=b.dataset.view; state.ffSelectedTicket=null; render(); };
  });
  document.querySelectorAll('[data-mystatus]').forEach(b=>{
    b.onclick=()=>{ state.myStatusFilter=b.dataset.mystatus; render(); };
  });
  document.querySelectorAll('[data-deptstatus]').forEach(b=>{
    b.onclick=()=>{ state.deptStatusFilter=b.dataset.deptstatus; render(); };
  });
  document.querySelectorAll('[data-ffmode]').forEach(b=>{
    b.onclick=()=>{ state.ffMode=b.dataset.ffmode; state.ffQuery=''; state.ffMulti=[]; state.ffFrom=''; state.ffTo=''; state.ffSelectedTicket=null; render(); };
  });
  window.__mselRefresh = render;
  ['ffHandlerMsel','ffRequesterMsel','ffDeptMsel'].forEach(id=>{
    if(document.getElementById(id)){
      wireMultiSelect(id, ()=>state.ffMulti, (v)=>{ state.ffMulti = v; }, render);
    }
  });
  const ffq = document.getElementById('ffQuery');
  if(ffq){
    const ev = state.ffMode==='ticket' ? 'input' : 'change';
    ffq.addEventListener(ev, ()=>{ state.ffQuery = ffq.value; render(); });
  }
  const ffFrom = document.getElementById('ffFrom');
  if(ffFrom) ffFrom.addEventListener('change', ()=>{ state.ffFrom = ffFrom.value; render(); });
  const ffTo = document.getElementById('ffTo');
  if(ffTo) ffTo.addEventListener('change', ()=>{ state.ffTo = ffTo.value; render(); });
  document.querySelectorAll('[data-open-ticket]').forEach(row=>{
    row.onclick=()=>{
      const tid = row.dataset.openTicket;
      state.view='flow';
      state.ffSelectedTicket = tid;
      render();
    };
  });
  const ffBack = document.getElementById('ffBack');
  if(ffBack) ffBack.onclick=()=>{ state.ffSelectedTicket=null; render(); };
  document.querySelectorAll('[data-respond]').forEach(b=>{
    b.onclick=()=> openRespondModal(b.dataset.respond, b.dataset.tid);
  });
  const newTicketBtn = document.getElementById('newTicketBtn');
  if(newTicketBtn) newTicketBtn.onclick = openNewTicketDrawer;
}

/* ═══════════ New Ticket drawer ═══════════
   Captures the fixed E2 (Subject Employee) up front, and lets creation
   itself be a delegation: route straight to a Department queue OR
   directly to a named Person — both supported, matching TK-5001 (dept)
   and TK-5002 (direct-to-person) in the real sample data. */
let newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:''};
/* ═══════════ Employee search dropdown — same render method as docPortal's
   filterDrop: plain search box + highlighted name/id list, instead of the
   checkbox multi-select. Used only for the New Ticket "Subject Employee"
   field (ap2_employee cache). ═══════════ */
/* ═══════════ Employee search dropdown — same render method as docPortal's
   filterDrop: plain search box + highlighted name/id list, instead of the
   checkbox multi-select. Used only for the New Ticket "Subject Employee"
   field (ap2_employee cache).
   Like docPortal, the input/list DOM nodes are rendered once and then
   patched directly (list.innerHTML=...) rather than being torn down and
   rebuilt on every keystroke/click — a full-page re-render mid-mousedown
   was racing against the click and closing the dropdown before the
   selection registered. */
function empDropSelectedLabel(){
  const id = newTicketForm.subjectEmployee;
  if(!id) return '';
  const e = EMPLOYEES.find(x=>String(x.id)===String(id));
  return e ? employeeLabel(e) : id;
}
function empSearchDropShell(){
  return `
  <div class="emp-drop" id="ntSubjectDrop">
    <input type="text" class="emp-drop-input" id="ntSubjectInput" autocomplete="off"
      placeholder="${EMPLOYEES.length?'Search by ID or name…':'No employees in cache'}"
      value="${escAttr(empDropSelectedLabel())}">
    <div class="dropdown-list" id="ntSubjectList"></div>
  </div>`;
}
function filterEmpDrop(q){
  const list = document.getElementById('ntSubjectList');
  if(!list) return;
  const lq = q.toLowerCase().trim();
  const hits = (lq ? EMPLOYEES.filter(e=>String(e.id).toLowerCase().includes(lq)||e.name.toLowerCase().includes(lq)) : EMPLOYEES).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!EMPLOYEES.length){
    html = `<div class="di no-match">No employees in cache</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No employees found</div>`;
  }else{
    html = hits.map(e=>`<div class="di" data-emp-drop-id="${escAttr(e.id)}">
        <div class="dn">${hl(e.name)}</div>
        <div class="ds">ID: ${hl(String(e.id))}</div>
      </div>`).join('');
  }
  if(lq && !hits.some(e=>String(e.id).toLowerCase()===lq)){
    html += `<div class="di emp-drop-add" data-emp-drop-add="1"><i class="ti ti-plus"></i><span>Use "${escHtml(q.trim())}" as new employee code</span></div>`;
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ntSubjectDrop'); if(wrap) wrap.classList.add('open');
}
function openEmpDrop(){
  const input = document.getElementById('ntSubjectInput');
  filterEmpDrop(input ? input.value : '');
}
function closeEmpDrop(){
  const list = document.getElementById('ntSubjectList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ntSubjectDrop'); if(wrap) wrap.classList.remove('open');
}
function selectEmpDrop(id){
  newTicketForm.subjectEmployee = String(id);
  const input = document.getElementById('ntSubjectInput');
  if(input) input.value = empDropSelectedLabel();
  closeEmpDrop();
}

function newTicketFormHtml(u){
  const f = newTicketForm;
  const deptOptions = activeDeptOptions();
  const personOptions = activePersonOptions();
  return `
    <div class="field">
      <label>Subject Employee — who is this ticket about? (E2)
        <span class="cache-ping ${EMPLOYEE_CACHE_OK?'ok':'warn'}" title="${EMPLOYEE_CACHE_OK?'Employee roster loaded from ap2_employee cache':'ap2_employee cache unavailable — no employee roster loaded'}"></span>
      </label>
      ${empSearchDropShell()}
      <span class="hint">Fixed for the life of the ticket — stays the same through every transfer.</span>
    </div>
    <div class="field">

      <label>Ticket name</label>
      <input type="text" id="nt-title" placeholder="e.g. SIM package renewal" value="${f.title.replace(/"/g,'&quot;')}">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="nt-desc" placeholder="What's going on, and what do you need?">${f.description}</textarea>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Priority</label>
        <select id="nt-priority">
          ${['Critical','High','Medium','Low'].map(p=>`<option ${f.priority===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Route to</label>
        <div class="filter-pills">
          <button type="button" class="filter-btn ${f.targetType==='department'?'active':''}" data-target-type="department">Department</button>
          <button type="button" class="filter-btn ${f.targetType==='person'?'active':''}" data-target-type="person">Person</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>${f.targetType==='department' ? 'Department' : 'Delegate to'}</label>
      <div id="ntTargetWrap">${renderMultiSelect('ntTargetMsel',
        f.targetType==='department'
          ? deptOptions.map(d=>({value:d.name, label:d.name}))
          : personOptions.map(p=>({value:p.email, label:p.name, sub:p.email})),
        f.target ? [f.target] : [],
        {
          single:true,
          placeholder: f.targetType==='department' ? (deptOptions.length?'Select a department…':'No departments yet') : (personOptions.length?'Select a person…':'No people available'),
          searchPlaceholder: f.targetType==='department' ? 'Search departments…' : 'Search by name or email…',
          allowAdd: f.targetType==='department',
          addPlaceholder: '+ New department name…'
        }
      )}</div>
      <span class="hint">${f.targetType==='department' ? "Sits as NEW in that department's queue until someone accepts it." : "Still goes to NEW — they'll need to Accept it, exactly like a department hand-off."}</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="nt-submit">Create ticket</button>
      <button class="btn btn-ghost" id="nt-reset">Clear</button>
    </div>`;
}
function openNewTicketDrawer(){
  if(document.getElementById('ticketDrawer')) return;
  const u = currentUser();
  const drawer = document.createElement('aside');
  drawer.className = 'ticket-drawer';
  drawer.id = 'ticketDrawer';
  drawer.innerHTML = `
    <div class="drawer-head">
      <div>
        <h2>New Ticket</h2>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody">${newTicketFormHtml(u)}</div>`;
  document.body.appendChild(drawer);
  document.body.classList.add('drawer-open');
  requestAnimationFrame(()=>{ requestAnimationFrame(()=> drawer.classList.add('open')); });
  document.addEventListener('keydown', newTicketDrawerEscHandler);
  document.addEventListener('mousedown', newTicketDrawerOutsideClick);
  wireNewTicketDrawerFields(u);
  document.getElementById('drawerClose').onclick = closeNewTicketDrawer;
}
function newTicketDrawerEscHandler(e){ if(e.key==='Escape') closeNewTicketDrawer(); }
function newTicketDrawerOutsideClick(e){
  const drawer = document.getElementById('ticketDrawer');
  const fab = document.getElementById('newTicketBtn');
  if(!drawer) return;
  if(drawer.contains(e.target) || (fab && fab.contains(e.target))) return;
  closeNewTicketDrawer();
}
function closeNewTicketDrawer(){
  const drawer = document.getElementById('ticketDrawer');
  if(!drawer) return;
  drawer.classList.remove('open');
  document.body.classList.remove('drawer-open');
  document.removeEventListener('keydown', newTicketDrawerEscHandler);
  document.removeEventListener('mousedown', newTicketDrawerOutsideClick);
  setTimeout(()=>{ drawer.remove(); }, 220);
}
function refreshNewTicketDrawer(u){
  const body = document.getElementById('drawerBody');
  if(!body) return;
  body.innerHTML = newTicketFormHtml(u);
  wireNewTicketDrawerFields(u);
}
function wireNewTicketDrawerFields(u){
  const empInput = document.getElementById('ntSubjectInput');
  if(empInput){
    empInput.oninput = ()=> filterEmpDrop(empInput.value);
    empInput.onfocus = ()=> openEmpDrop();
    empInput.onblur = ()=> setTimeout(closeEmpDrop, 160);
  }
  const empList = document.getElementById('ntSubjectList');
  if(empList){
    empList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-emp-drop-id]');
      if(row){ selectEmpDrop(row.dataset.empDropId); return; }
      const addRow = e.target.closest('[data-emp-drop-add]');
      if(addRow){ const empInput2 = document.getElementById('ntSubjectInput'); selectEmpDrop((empInput2?empInput2.value:'').trim()); }
    });
  }
  const t = document.getElementById('nt-title'); if(t) t.oninput = ()=>{ newTicketForm.title = t.value; };
  const d = document.getElementById('nt-desc'); if(d) d.oninput = ()=>{ newTicketForm.description = d.value; };
  const p = document.getElementById('nt-priority'); if(p) p.onchange = ()=>{ newTicketForm.priority = p.value; };
  document.querySelectorAll('[data-target-type]').forEach(b=>{
    b.onclick = ()=>{ newTicketForm.targetType = b.dataset.targetType; newTicketForm.target=''; refreshNewTicketDrawer(u); };
  });
  if(document.getElementById('ntTargetMsel')){
    wireMultiSelect('ntTargetMsel',
      ()=> newTicketForm.target ? [newTicketForm.target] : [],
      (v)=>{ newTicketForm.target = (v && v[0]) || ''; },
      ()=> refreshNewTicketDrawer(u),
      {single:true}
    );
  }
  const submit = document.getElementById('nt-submit');
  if(submit) submit.onclick = ()=>{
    const f = newTicketForm;
    let subjectEmployee = f.subjectEmployee;
    if(!subjectEmployee){ toast('Select (or enter) the Subject Employee (E2) — who this ticket is about.'); return; }
    if(!f.title.trim()){ toast('Give this a name first.'); return; }
    let target = f.target;
    if(f.targetType==='department' && target==='__new__'){ target = (f.targetNew||'').trim(); }
    if(!target){ toast(f.targetType==='department' ? 'Choose or name a department.' : 'Choose who to delegate this to.'); return; }
    const tid = createTicket({
      creatorId: state.currentUserId, title:f.title, description:f.description||'(no description provided)',
      priority:f.priority, subjectType:'Employee', subjectEmployeeId:subjectEmployee,
      targetType:f.targetType, target,
    });
    toast(`Ticket ${tid} created for ${subjectEmployee}, routed to ${nameOf(target)}.`);
    newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:''};
    closeNewTicketDrawer();
    state.view='flow'; state.ffSelectedTicket=tid;
    render();
  };
  const reset = document.getElementById('nt-reset');
  if(reset) reset.onclick = ()=>{ newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:''}; refreshNewTicketDrawer(u); };
}

// periodic re-render so overdue flags stay live without user action
setInterval(()=>{
  if(state.view==='my' || state.view==='dept' || (state.view==='flow' && !state.ffSelectedTicket) || state.view==='org'){
    render();
  }
}, 15000);

// ---------- Boot ----------
loadStaffMeta();
loadOverlay();
applyOverlay();          // show this browser's own local tickets immediately, if any
ME = bootstrapIdentity();
discoverDirectory(EVENTS, TICKET_MASTER);
state.currentUserId = ME;
render();
loadTickets();            // then read the real ap2_ticLog cache (IndexedDB) and merge it in — Users
                          // rows arrive with it, so re-resolve identity once real data is in.
loadEmployees();          // ap2_employee cache, for the New Ticket Subject Employee picker
async function _reboundIdentityAfterLoad(){
  ME = bootstrapIdentity();
  if(!state.currentUserId || state.currentUserId===ME) return;
  state.currentUserId = ME;
  discoverDirectory(EVENTS, TICKET_MASTER);
  render();
}
setTimeout(_reboundIdentityAfterLoad, 400);
