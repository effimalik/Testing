<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Employees</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<script src="https://effimalik.github.io/Testing/shared/auth.js"></script>
<script src="https://effimalik.github.io/Testing/shared/code.js"></script>
<script src="https://effimalik.github.io/Testing/shared/dataLayer.js"></script>
<script src="https://effimalik.github.io/Testing/shared/devPre.js"></script>
<script src="https://effimalik.github.io/Testing/shared/cioView.js"></script>
<script src="https://effimalik.github.io/Testing/shared/cacheWatcher.js?v=1"></script>

<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══ DESIGN TOKENS — mirrors parent index.html exactly (all 5 themes) ══ */
:root, [data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2333;
  --surface:#21262d; --surface2:#2d333b;
  --border:#30363d; --border2:#444c56;
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
  --accent:#58a6ff; --accent-dim:rgba(88,166,255,.12); --accent-glow:rgba(88,166,255,.28);
  --teal:#39d353; --teal-dim:rgba(57,211,83,.12);
  --amber:#e3b341; --amber-dim:rgba(227,179,65,.12);
  --red:#f85149; --red-dim:rgba(248,81,73,.12);
  --purple:#a371f7; --purple-dim:rgba(163,113,247,.12);
  --orange:#f0883e; --orange-dim:rgba(240,136,62,.12);
  --radius:8px; --radius-lg:12px; --radius-xl:16px;
  --font:'Sora',sans-serif; --mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 4px 16px rgba(0,0,0,.5); --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
[data-theme="light"] {
  --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8ecf0;
  --surface:#ffffff; --surface2:#e2e7ed;
  --border:#c8d0d9; --border2:#9aa5b1;
  --text:#0d1117; --text2:#3d454f; --text3:#5a6370;
  --accent:#0550ae; --accent-dim:rgba(5,80,174,.12); --accent-glow:rgba(5,80,174,.22);
  --teal:#116329; --teal-dim:rgba(17,99,41,.13);
  --amber:#7d4e00; --amber-dim:rgba(125,78,0,.13);
  --red:#a8111b; --red-dim:rgba(168,17,27,.11);
  --purple:#6639c8; --purple-dim:rgba(102,57,200,.13);
  --orange:#953800; --orange-dim:rgba(149,56,0,.13);
  --shadow:0 1px 3px rgba(0,0,0,.10); --shadow-md:0 4px 16px rgba(0,0,0,.12); --shadow-lg:0 8px 32px rgba(0,0,0,.15);
}
[data-theme="purple"] {
  --bg:#0f0b1e; --bg2:#17112e; --bg3:#1e1840;
  --surface:#221a3a; --surface2:#2c2250;
  --border:#3a2e5e; --border2:#5a4890;
  --text:#e8e0ff; --text2:#a899d4; --text3:#7a6ca8;
  --accent:#c084fc; --accent-dim:rgba(192,132,252,.14); --accent-glow:rgba(192,132,252,.3);
  --teal:#4ade80; --teal-dim:rgba(74,222,128,.12);
  --amber:#fbbf24; --amber-dim:rgba(251,191,36,.12);
  --red:#f87171; --red-dim:rgba(248,113,113,.12);
  --purple:#c084fc; --purple-dim:rgba(192,132,252,.14);
  --orange:#fb923c; --orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-md:0 4px 16px rgba(0,0,0,.6); --shadow-lg:0 8px 32px rgba(0,0,0,.7);
}
[data-theme="ocean"] {
  --bg:#071520; --bg2:#0d2035; --bg3:#112840;
  --surface:#143050; --surface2:#1a3d60;
  --border:#1e4a72; --border2:#2e6a9e;
  --text:#d6eeff; --text2:#7db8e8; --text3:#4a87b8;
  --accent:#38bdf8; --accent-dim:rgba(56,189,248,.14); --accent-glow:rgba(56,189,248,.3);
  --teal:#34d399; --teal-dim:rgba(52,211,153,.12);
  --amber:#fbbf24; --amber-dim:rgba(251,191,36,.12);
  --red:#f87171; --red-dim:rgba(248,113,113,.12);
  --purple:#a78bfa; --purple-dim:rgba(167,139,250,.12);
  --orange:#fb923c; --orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-md:0 4px 16px rgba(0,0,0,.55); --shadow-lg:0 8px 32px rgba(0,0,0,.65);
}
[data-theme="slate"] {
  --bg:#0e1117; --bg2:#1a1f28; --bg3:#222836;
  --surface:#28303e; --surface2:#313c4e;
  --border:#3a4556; --border2:#556070;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  --accent:#60a5fa; --accent-dim:rgba(96,165,250,.13); --accent-glow:rgba(96,165,250,.28);
  --teal:#4ade80; --teal-dim:rgba(74,222,128,.12);
  --amber:#fbbf24; --amber-dim:rgba(251,191,36,.12);
  --red:#f87171; --red-dim:rgba(248,113,113,.12);
  --purple:#a78bfa; --purple-dim:rgba(167,139,250,.12);
  --orange:#fb923c; --orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-md:0 4px 16px rgba(0,0,0,.5); --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}

html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: clamp(12px, 1.5vw, 15px); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }

/* ── Page wrapper — fills the available viewport/iframe height and clips
     everything to its own box so no child can ever spill outside #allEmp ── */
.page {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  height: 100%;
  max-height: 100dvh;
  min-height: 0;
  margin: 0 auto;
  padding: clamp(8px, 2vw, 24px) clamp(10px, 2.5vw, 24px);
  box-sizing: border-box;
  overflow: hidden;
}

/* ── Page header — heading, description, search box and filter buttons
     all share a single row, with the controls pinned to the right ── */
.page-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px clamp(10px, 2vw, 20px);
  flex-shrink: 0;
  padding-bottom: clamp(8px, 1.4vw, 12px);
  margin-bottom: clamp(8px, 1.4vw, 12px);
  border-bottom: 1.5px solid var(--border);
}
.page-header-text {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1 1 160px;
}
.page-title { font-size: clamp(15px, 2.2vw, 22px); font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text); flex-shrink: 0; white-space: nowrap; }
.page-title i { color: var(--accent); font-size: clamp(17px, 2.6vw, 26px); line-height: 1; }

/* ── Description — sits inline next to the title, ellipsizes instead of
     wrapping so it never pushes the controls off the row ── */
.page-desc {
  font-size: clamp(11px, 1.1vw, 13px);
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding-left: 12px;
  border-left: 1.5px solid var(--border);
  overflow: hidden;
}
.page-desc i { color: var(--accent); font-size: clamp(14px, 1.6vw, 17px); flex-shrink: 0; line-height: 1; }
.page-desc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 760px) { .page-desc { display: none; } }

/* ── Header controls (search + filters) — right-aligned, wraps as a unit
     onto its own line on tablet widths instead of overflowing ── */
.page-header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  flex-shrink: 0;
  margin-left: auto;
  max-width: 100%;
}
.search-group { display: flex; align-items: center; gap: 6px; flex: 1 1 140px; min-width: 90px; max-width: 240px; }
.search-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: clamp(28px,4vw,34px); height: clamp(28px,4vw,34px); border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text3); flex-shrink: 0; cursor: default; font-size: clamp(14px,2vw,17px); }
.search-input { flex: 1; padding: clamp(6px,1vw,7px) clamp(8px,1.2vw,11px); border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); color: var(--text); font-family: var(--font); font-size: clamp(11px,1.3vw,13px); transition: border .18s, box-shadow .18s; min-width: 0; width: 100%; }
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.search-input::placeholder { color: var(--text3); }
.hr-filter-pills { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.hr-filter-btn { display: inline-flex; align-items: center; gap: 5px; padding: clamp(5px,.8vw,7px) clamp(9px,1.2vw,13px); border-radius: 20px; border: 1.5px solid var(--border2); background: var(--surface); color: var(--text2); font-family: var(--font); font-size: clamp(10px,1.1vw,12px); font-weight: 600; cursor: pointer; transition: all .18s; white-space: nowrap; flex-shrink: 0; }
.hr-filter-btn i { font-size: 15px; flex-shrink: 0; line-height: 1; display: inline-flex; align-items: center; }
.hr-filter-btn:hover { background: var(--surface2); color: var(--text); }
.hr-filter-btn.active   { background: var(--surface2); color: var(--text); border-color: var(--border2); box-shadow: 0 0 0 2px var(--accent); }
.hr-filter-btn.expired  { border-color: var(--red);   color: var(--red); }
.hr-filter-btn.expired.active  { background: var(--red-dim); box-shadow: 0 0 0 2px var(--red); }
.hr-filter-btn.expiring { border-color: var(--amber); color: var(--amber); }
.hr-filter-btn.expiring.active { background: var(--amber-dim); box-shadow: 0 0 0 2px var(--amber); }
.hr-filter-btn.valid    { border-color: var(--teal);  color: var(--teal); }
.hr-filter-btn.valid.active    { background: var(--teal-dim); box-shadow: 0 0 0 2px var(--teal); }

/* On smaller screens the filter buttons drop their labels and become
   icon-only "chips" so the whole controls row keeps fitting in one line. */
@media (max-width: 760px) {
  .hr-filter-btn span { display: none; }
  .hr-filter-btn { padding: 7px 8px; gap: 0; }
  .hr-filter-btn i { font-size: 16px; }
  .search-group { flex: 0 1 120px; min-width: 80px; max-width: 150px; }
}
@media (max-width: 420px) {
  .search-group { flex: 0 1 90px; min-width: 60px; max-width: 110px; }
  .hr-filter-btn { padding: 6px 7px; }
}

/* ── Table card — flex column so the header row, scrollable body and the
     footer/pagination bar always add up to exactly the available height.
     The footer never gets pushed out; the body scrolls internally instead. ── */
.emp-table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.emp-table-wrap { overflow-x: hidden; overflow-y: auto; flex: 1 1 auto; min-height: 60px; -webkit-overflow-scrolling: touch; width: 100%; }

/* ── Footer / pagination ("view controls") bar, appended by JS — pinned to
     the bottom of the table card, never shrinks, never causes overflow ── */
.emp-block-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: clamp(7px,1.2vw,9px) clamp(10px,1.6vw,14px);
  border-top: 1px solid var(--border);
  font-size: clamp(10.5px,1.1vw,12px);
  color: var(--text3);
  flex-wrap: wrap;
  flex-shrink: 0;
  background: var(--surface);
  max-width: 100%;
  box-sizing: border-box;
}
.emp-block-nav-pages { display: flex; align-items: center; gap: 4px; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.emp-block-nav-pages::-webkit-scrollbar { display: none; }
@media (max-width: 600px) {
  .emp-block-nav { justify-content: center; text-align: center; }
  .emp-block-nav-pages { order: 3; width: 100%; justify-content: center; }
}
.emp-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: clamp(11px, 1.3vw, 13px); }
.emp-table thead th { position: sticky; top: 0; z-index: 2; background: var(--bg3); text-align: left; font-size: clamp(9px, 1vw, 10.5px); font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; padding: clamp(8px,1.2vw,11px) clamp(8px,1.2vw,14px); border-bottom: 2px solid var(--border); overflow: hidden; text-overflow: ellipsis; }
.emp-table td { padding: clamp(8px,1.2vw,11px) clamp(8px,1.2vw,14px); border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
.emp-table tr:last-child td { border-bottom: none; }
.emp-table tbody tr { transition: background .12s; }
.emp-table tbody tr:hover td { background: var(--bg3); }
.emp-table th:nth-child(1), .emp-table td:nth-child(1) { width: 28%; }
.emp-table th:nth-child(2), .emp-table td:nth-child(2) { width: 15%; }
.emp-table th:nth-child(3), .emp-table td:nth-child(3) { width: 13%; }
.emp-table th:nth-child(4), .emp-table td:nth-child(4) { width: 11%; }
.emp-table th:nth-child(5), .emp-table td:nth-child(5) { width: 33%; overflow: visible; text-overflow: clip; }

/* ── Badges ── */
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge.valid, .badge.green   { background: rgba(57,211,83,.18);  color: #39d353; border: 1px solid rgba(57,211,83,.35); }
.badge.expired, .badge.red   { background: rgba(248,81,73,.18);  color: #f85149; border: 1px solid rgba(248,81,73,.35); }
.badge.expiring_soon,.badge.pink { background: rgba(227,179,65,.18); color: #e3b341; border: 1px solid rgba(227,179,65,.35); }
.badge.gray { background: rgba(110,118,129,.18); color: #8b949e; border: 1px solid rgba(110,118,129,.3); }
[data-theme="light"] .badge.valid,.badge.green   { background: rgba(17,99,41,.13);  color: #0d4f20; border-color: rgba(17,99,41,.35); }
[data-theme="light"] .badge.expired,.badge.red   { background: rgba(168,17,27,.11); color: #8b0b14; border-color: rgba(168,17,27,.35); }
[data-theme="light"] .badge.expiring_soon,.badge.pink { background: rgba(125,78,0,.13); color: #5e3900; border-color: rgba(125,78,0,.35); }

/* ── Global icon baseline — ensures Tabler icons always render ── */
[class^="ti-"], [class*=" ti-"] { font-style: normal; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }

/* ── Row action buttons ── */
.row-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; border: 1.5px solid; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .16s; white-space: nowrap; line-height: 1; }
.row-btn i { font-size: 15px; flex-shrink: 0; line-height: 1; }
.row-btn-view { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
.row-btn-view:hover { background: var(--teal); color: #fff; box-shadow: 0 0 10px var(--teal-dim); }
.row-btn-adv { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }
.row-btn-adv:hover { background: var(--purple); color: #fff; }
.row-btn-hist { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.row-btn-hist:hover { background: var(--accent); color: #fff; }
.emp-table td button:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── Spacer rows must be invisible ── */
.vs-spacer-top td, .vs-spacer-bot td { padding: 0 !important; border: none !important; }

/* ── Toast ── */
.toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface2); color: var(--text); border: 1px solid var(--border2); padding: 13px 20px; border-radius: var(--radius-lg); font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transform: translateY(12px); transition: all .28s cubic-bezier(.34,1.56,.64,1); pointer-events: none; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); max-width: 340px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--teal-dim); color: var(--teal); border-color: rgba(57,211,83,.25); }
.toast.error   { background: var(--red-dim);  color: var(--red);  border-color: rgba(248,81,73,.25); }

/* ── Form fields (used by the Advance form inside the shared panel) ── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
label { font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: .02em; }
input[type=text], input[type=date], input[type=number], input[type=tel], select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg3); color: var(--text); font-family: var(--font); font-size: 13.5px; transition: border .18s, box-shadow .18s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
input::placeholder, textarea::placeholder { color: var(--text3); }
select option { background: var(--surface2); color: var(--text); }
[data-theme="light"] input, [data-theme="light"] select, [data-theme="light"] textarea { background: var(--bg2); }

/* ── Shared right-side panel/window ──
   ONE panel shell reused by every row-action button (View / Advance /
   History / any future button) — see panel-core.js. */
#side-panel { position: fixed; inset: 0; z-index: 300; pointer-events: none; display: flex; justify-content: flex-end; }
#side-panel.open { pointer-events: auto; }
.dp-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); opacity: 0; transition: opacity .28s; }
#side-panel.open .dp-backdrop { opacity: 1; }
.dp-sheet { position: relative; width: min(440px, 100%); height: 100dvh; max-height: 95dvh; background: var(--bg2); border-left: 1px solid var(--border2); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: -8px 0 40px rgba(0,0,0,.4); overflow: hidden; }
#side-panel.open .dp-sheet { transform: translateX(0); }
.dp-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-shrink: 0; background: var(--bg2); }
.dp-header-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.dp-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.dp-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
.dp-name { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
.dp-sub  { font-size: 12px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
.dp-status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1.5px solid; }
.dp-badge-green  { background: var(--teal-dim);  color: var(--teal);  border-color: var(--teal); }
.dp-badge-amber  { background: var(--amber-dim); color: var(--amber); border-color: var(--amber); }
.dp-badge-red    { background: var(--red-dim);   color: var(--red);   border-color: var(--red); }
.dp-badge-purple { background: var(--purple-dim); color: var(--purple); border-color: var(--purple); }
.dp-badge-blue   { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.dp-badge-accent { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); border-radius: 20px; font-size: 11px; font-weight: 600; padding: 2px 9px; display: inline-block; }
.dp-close-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border2); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); transition: all .15s; }
.dp-close-btn:hover { background: var(--red-dim); color: var(--red); border-color: var(--red); }
.dp-close-btn i { font-size: 15px; }
.dp-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0; display: flex; flex-direction: column; gap: 0; min-height: 0; }
.dp-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 24px; color: var(--text3); font-size: 13px; }
.dp-spinner { width: 28px; height: 28px; border: 2.5px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: dpSpin .75s linear infinite; }

<script>
'use strict';

/* ═══════════ CONSTANTS ═══════════ */

const WARN_DAYS = 45;

const AV_FG  = ['#58a6ff','#3fb950','#e3b341','#d2a8ff','#ffa198','#22d3ee'];
const AV_BG2 = ['rgba(31,111,235,.2)','rgba(26,127,55,.2)','rgba(154,103,0,.2)','rgba(110,64,201,.2)','rgba(191,69,66,.2)','rgba(14,116,144,.2)'];

/* ── Pipeline constants ── */
const SLICE_SZ = 200;   // rows per render block
const VS_ROWS  = 40;   // visible rows in virtual-scroll window
let   ROW_H    = 56;   // px — updated at runtime from first rendered row

/* ── State ── */
let employees       = [];   // Memory-Hoist: active page array in RAM
let empSearchQuery  = '';
let currentHRFilter = 'all';
let _vsInstance     = null; // Virtual-Scroll handle
let _currentBlock   = 0;    // current Slice block index (0-based)

/* ═══════════ UTILITY ═══════════ */
function today() { return new Date(); }
function daysUntil(d) { if (!d) return Infinity; return Math.ceil((new Date(d) - today()) / 86400000); }
function isExpired(d)  { return daysUntil(d) < 0; }
function isExpiring(d) { const n = daysUntil(d); return n >= 0 && n <= WARN_DAYS; }

function computeExpiry(dateStr) {
  if (!dateStr || String(dateStr).trim() === '') return { date: null, status: 'not_available', color: 'gray' };
  const d = String(dateStr).trim();
  if (isExpired(d))  return { date: d, status: 'expired',       color: 'red'  };
  if (isExpiring(d)) return { date: d, status: 'expiring_soon', color: 'pink' };
  return               { date: d, status: 'valid',           color: 'green'};
}

function normaliseRow(r, i) {
  if (!r) return null;

  /* ── Object format (named keys from DataLayer / old cache) ── */
  if (!Array.isArray(r) && r["Name"] !== undefined) {
    return {
      id: r["Emp ID"] || (i + 1),
      name: r["Name"] || "",
      eid: String(r["EID Number"] || ""),
      dob: r["Date of Birth"] || "",
      mobile: r["UAE Mobile No"] || "",
      emergency: r["Emergency Mobile No"] || "",
      reference: r["Reference"] || "",
      timestamp: r["Timestamp"] || "",
      hrStatus: r["HR_Status"] || "",
      checkoutException: r["Checkout_Exception"] || "",
      expiry: {
        eid: computeExpiry(r["EID Expiry"]),
        license: computeExpiry(r["License Expiry"]),
        labour: computeExpiry(r["Laboure Expiry"]),
        insurance: computeExpiry(r["Insurance Expiry"])
      }
    };
  }

  /* ── Array format from ap2_employees cache / Apps Script API ──
   *  Column layout (0-based) — matches sheet header row exactly:
   *  [0]  Emp ID
   *  [1]  Name
   *  [2]  EID Number
   *  [3]  Date of Birth
   *  [4]  UAE Mobile No
   *  [5]  Emergency Mobile No
   *  [6]  Reference
   *  [7]  Timestamp
   *  [8]  HR_Status
   *  [9]  Checkout_Exception
   *  [10] EID Expiry
   *  [11] License Expiry
   *  [12] Laboure Expiry
   *  [13] Insurance Expiry
   * ─────────────────────────────────────────────────────────── */
  if (Array.isArray(r)) {
    const _str = v => (v !== null && v !== undefined && v !== '') ? String(v).trim() : '';

    // Skip the header row (first element is literally "Emp ID")
    if (_str(r[0]) === 'Emp ID') return null;

    const rawId   = r[0];
    const empId   = (rawId !== null && rawId !== undefined && rawId !== '') ? rawId : (i + 1);
    const empName = _str(r[1]);
    if (!empName) return null; // skip blank rows

    const coExc     = _str(r[9]);
    const isCoExc   = coExc.toLowerCase().replace(/[^a-z]/g,'').includes('checkout');
    const hrTag     = isCoExc ? '' : coExc;
    const coExcTag  = isCoExc ? coExc : '';

    // HR_Status is col[8]; fall back to hrTag if empty
    const hrStatusRaw = _str(r[8]) || hrTag;

    return {
      id:                empId,
      name:              empName,
      eid:               _str(r[2]),
      dob:               _str(r[3]),
      mobile:            _str(r[4]),
      emergency:         _str(r[5]),
      reference:         _str(r[6]),
      timestamp:         _str(r[7]),
      status:            hrStatusRaw || 'Active',
      hrStatus:          hrStatusRaw,
      checkoutException: coExcTag,
      expiry: {
        eid:       computeExpiry(_str(r[10])),
        license:   computeExpiry(_str(r[11])),
        labour:    computeExpiry(_str(r[12])),
        insurance: computeExpiry(_str(r[13])),
      }
    };
  }

  return null;
}

  

/* ═══════════ CACHE — via shared cacheWatcher.js, with a safe fallback ═══════════
   If cacheWatcher.js fails to load or load in time (blocked, 404, iPad
   caching a stale/broken copy, etc.) this page must NOT throw and must
   NOT stop the rest of this script from running — that's what was
   causing the login-redirect side effect. So: if AP2CacheWatcher isn't
   there, build a tiny local stand-in with the same shape, using the
   page's own direct (timeout-guarded) IndexedDB read as a fallback.
   ════════════════════════════════════════════════════════════════════════ */
const _AP2_CACHE_KEY = 'ap2_employee';

if (typeof window.AP2CacheWatcher === 'undefined') {
  console.warn('[allEmp] cacheWatcher.js did not load — using local fallback');
  window.AP2CacheWatcher = (function () {
    const _IDB_NAME = 'ap2_fleet_cache', _IDB_STORE = 'datasets';
    let _conn = null;
    function _open() {
      if (_conn) return Promise.resolve(_conn);
      return new Promise((res, rej) => {
        let done = false;
        const req = indexedDB.open(_IDB_NAME);
        const t = setTimeout(() => { if (!done) { done = true; rej(new Error('idb-open-timeout')); } }, 2000);
        req.onsuccess = e => { if (!done) { done = true; clearTimeout(t); _conn = e.target.result; res(_conn); } };
        req.onerror   = e => { if (!done) { done = true; clearTimeout(t); rej(e.target.error); } };
      });
    }
    return {
      init() {},
      subscribe() { return () => {}; }, // no cross-page notifications available in fallback mode
      notifyNow() {},
      getStatus() { return { healthy: false, mode: 'local-fallback', lastError: 'cacheWatcher.js not loaded' }; },
      async readKey(key) {
        try {
          const db  = await _open();
          if (!db.objectStoreNames.contains(_IDB_STORE)) {
            // Store doesn't exist yet — cache hasn't been warmed in this
            // browser session yet. That's normal, not an error.
            return null;
          }
          const rec = await new Promise((res, rej) => {
            const r = db.transaction(_IDB_STORE, 'readonly').objectStore(_IDB_STORE).get(key);
            r.onsuccess = () => res(r.result || null);
            r.onerror   = () => rej(r.error);
          });
          return (rec && Array.isArray(rec.data) && rec.data.length) ? rec.data : null;
        } catch (e) {
          if (e && e.name === 'NotFoundError') return null; // store not created yet — normal
          console.warn('[allEmp] fallback read failed:', e.message);
          return null;
        }
      }
    };
  })();
}

// Thin wrapper kept so the rest of this file doesn't need to change —
// actual read lives centrally in cacheWatcher.js when it's available,
// or in the fallback above when it isn't.
async function _readCache() {
  return AP2CacheWatcher.readKey(_AP2_CACHE_KEY);
}

/* ═══════════ LOAD — Stream-Query → Memory-Hoist → Slice → Virtual-Scroll ═══════════
   1. Stream-Query:   Pull only rows that pass the current filter from IDB — no full table load.
   2. Memory-Hoist:   Normalised result array lives in JS RAM as `employees` for zero-latency sort/filter.
   3. Slice (50):     renderEmpTable takes first SLICE_SZ block; user can page through blocks.
   4. Virtual-Scroll: Only VS_ROWS (20) <tr> elements exist in the DOM at any time.
   Used ONLY for the very first paint — nothing is on screen yet, so a
   brief spinner here is fine (there's nothing to blink relative to).
   ════════════════════════════════════════════════════════════════════════════════════ */
async function loadEmployees() {
  const tbody = document.getElementById('emp-tbody');
  const alreadyHaveData = employees && employees.length;

  // Only show the spinner if the screen is genuinely empty. If the parent's
  // push already rendered good data (a faster path than this IndexedDB
  // read), don't blink it away with a loading state.
  if (tbody && !alreadyHaveData) tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px 16px;">
    <div style="color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:8px;">
      <i class="ti ti-loader" style="font-size:26px;animation:spin 1s linear infinite;display:inline-flex;"></i>
      <span style="font-size:12px;">Reading ap2_employee cache…</span>
    </div></td></tr>`;

  try {
    const rows = await _readCache();
    const fresh = (rows && rows.length) ? rows.map((r, i) => normaliseRow(r, i)).filter(Boolean) : [];

    if (fresh.length) {
      // Good data — always safe to apply.
      employees = fresh;
      renderEmpTable(employees);
    } else if (!(employees && employees.length)) {
      // Only show the empty state if we don't already have better data on
      // screen from another source (e.g. the parent's push arrived first
      // and this slower IndexedDB read simply found nothing new).
      if (tbody) tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px 16px;color:var(--text3);">
        <i class="ti ti-database-off" style="font-size:26px;display:block;margin-bottom:8px;"></i>
        No data in cache yet. Data will appear automatically once
        <code style="font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:4px;">ap2_employee</code> is populated.
      </td></tr>`;
    }
    // else: this read found nothing, but we already have good data on
    // screen from elsewhere — do nothing, leave it exactly as is.
  } catch (err) {
    console.error('[allEmp] loadEmployees error:', err);
    if (!(employees && employees.length) && tbody) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px 16px;color:var(--red);">
        <i class="ti ti-wifi-off" style="font-size:24px;display:block;margin-bottom:6px;"></i>
        Failed to load employee data — ${err.message}
      </td></tr>`;
    }
  }
}

/* ═══════════ SILENT REFRESH — every update AFTER the first paint goes through here.
   No spinner, no tbody wipe unless data is genuinely gone — so nothing blinks.
   Subscribed to cacheWatcher.js, which fires this on ANY of:
     - this page's own fast poll detecting a change or deletion
     - an instant notifyNow() call from wherever the data was written
     - a broadcast relayed down from the parent shell (index.html)
   ════════════════════════════════════════════════════════════════════════ */
let _emptyReadStreak = 0; // guards against one flaky/transient empty read wiping good data
async function _applyFromIDB() {
  try {
    const rows = await _readCache();
    if (rows && rows.length) {
      _emptyReadStreak = 0;
      employees = rows.map((r, i) => normaliseRow(r, i)).filter(Boolean);
      renderEmpTable(employees);
    } else if (employees && employees.length) {
      // Don't trust a single empty read — iPad's IndexedDB reads can be
      // flaky/transient. Only treat it as a genuine deletion after seeing
      // it twice in a row.
      _emptyReadStreak++;
      if (_emptyReadStreak >= 2) {
        employees = [];
        renderEmpTable(employees);
        _emptyReadStreak = 0;
      }
    }
  } catch (e) {
    console.warn('[allEmp] silent refresh error:', e.message);
  }
}

try {
  AP2CacheWatcher.init();
  AP2CacheWatcher.subscribe(() => { _applyFromIDB(); });
} catch (e) {
  console.warn('[allEmp] cacheWatcher wiring failed, continuing without live updates:', e.message);
}

/* ═══════════ FILTER / TABLE ═══════════ */
function calcOverall(ex) {
  const ss = [ex.eid?.status, ex.license?.status, ex.labour?.status, ex.insurance?.status];
  const present = ss.filter(s => s && s !== 'not_available');
  if (present.length === 0) return 'expired';
  if (present.includes('expired') || present.includes('invalid')) return 'expired';
  if (present.includes('expiring_soon')) return 'expiring_soon';
  return 'valid';
}

function getFilteredEmps(list) {
  const lq = (empSearchQuery || '').toLowerCase().trim();
  return list.filter(emp => {
    if (lq) {
      const m = (emp.name||'').toLowerCase().includes(lq) || (emp.eid||'').toLowerCase().includes(lq) || (String(emp.id)||'').includes(lq) || (emp.reference||'').toLowerCase().includes(lq) || (emp.ref||'').toLowerCase().includes(lq);
      if (!m) return false;
    }
    if (currentHRFilter !== 'all') {
      const overall = calcOverall(emp.expiry || {});
      if (overall !== currentHRFilter) return false;
    }
    return true;
  });
}

function buildEmpRow(emp, idx) {
  const ex      = emp.expiry || {};
  const overall = calcOverall(ex);
  let rowStyle  = overall === 'expired' ? 'style="border-left:3px solid var(--red);background:rgba(248,81,73,.04);"' : overall === 'expiring_soon' ? 'style="border-left:3px solid var(--amber);background:rgba(227,179,65,.04);"' : 'style="border-left:3px solid transparent;"';
  const dotColor = overall === 'expired' ? 'var(--red)' : overall === 'expiring_soon' ? 'var(--amber)' : 'var(--teal)';
  const dotTitle = overall === 'expired' ? 'Expired' : overall === 'expiring_soon' ? 'Expiring Soon' : 'Valid';
  const initials = (emp.name || '?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const avBg = AV_BG2[idx % AV_BG2.length];
  const avFg = AV_FG [idx % AV_FG.length];
  const eidDisplay = emp.eid
    ? `<span style="font-family:var(--mono);font-size:10.5px;color:var(--text3);letter-spacing:.03em;">${emp.eid}</span>`
    : `<span style="color:var(--text3);font-size:11px;">No EID</span>`;
  const hrBadge = emp.hrStatus
    ? `<span class="badge" style="background:rgba(88,166,255,.15);color:var(--accent);border:1px solid rgba(88,166,255,.3);font-size:11px;white-space:nowrap;">${emp.hrStatus}</span>`
    : `<span style="color:var(--text3);font-size:12px;">—</span>`;
  const coExc = emp.checkoutException
    ? `<span class="badge" style="background:rgba(227,179,65,.18);color:var(--amber);border:1px solid rgba(227,179,65,.3);font-size:11px;">${emp.checkoutException}</span>`
    : `<span style="color:var(--text3);font-size:12px;">—</span>`;
  const mob = emp.mobile
    ? `<a href="tel:${emp.mobile}" style="font-family:var(--mono);font-size:12px;color:var(--text);text-decoration:none;">${emp.mobile}</a>`
    : `<span style="color:var(--text3);">—</span>`;

  // Advance button: disabled if expired, unless HR status or CO exception provides override
  const hasHROverride = !!(emp.hrStatus && emp.hrStatus.trim());
  const hasCOOverride = !!(emp.checkoutException && emp.checkoutException.trim());
  const advDisabled   = overall === 'expired' && !hasHROverride && !hasCOOverride;
  let advBtn;
  if (advDisabled) {
    advBtn = `<button class="row-btn row-btn-adv" disabled title="Advance unavailable — employee documents expired" style="opacity:.38;cursor:not-allowed;filter:grayscale(.6);">
      <i class="ti ti-cash"></i><span>Advance</span>
    </button>`;
  } else if (overall === 'expired' && (hasHROverride || hasCOOverride)) {
    const overrideLabel = hasHROverride ? `HR: ${emp.hrStatus}` : `CO: ${emp.checkoutException}`;
    advBtn = `<button class="row-btn row-btn-adv" title="Override active — ${overrideLabel}" data-action="adv" data-emp-id="${emp.id}" style="border-style:dashed;">
      <i class="ti ti-cash"></i><span>Advance</span>
    </button>`;
  } else {
    advBtn = `<button class="row-btn row-btn-adv" title="Advance request" data-action="adv" data-emp-id="${emp.id}">
      <i class="ti ti-cash"></i><span>Advance</span>
    </button>`;
  }

  return `
    <tr class="vs-row" ${rowStyle} data-emp-id="${emp.id}">
      <td style="padding:10px 14px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;flex-shrink:0;background:${avBg};color:${avFg};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;position:relative;">
            ${initials}
            <span title="${dotTitle}" style="position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:${dotColor};border:2px solid var(--bg2);"></span>
          </div>
          <div style="min-width:0;">
            <div style="font-family:var(--mono);font-size:10.5px;color:var(--text3);line-height:1.2;">#${emp.id || '—'}</div>
            <div style="font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;">${emp.name || '—'}</div>
            <div style="margin-top:1px;">${eidDisplay}</div>
          </div>
        </div>
      </td>
      <td style="white-space:nowrap;">${mob}</td>
      <td>${hrBadge}</td>
      <td>${coExc}</td>
      <td style="white-space:nowrap;padding:8px 12px;">
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:nowrap;">
          <button class="row-btn row-btn-view" title="View details" data-action="view" data-emp-id="${emp.id}"><i class="ti ti-eye"></i><span>View</span></button>
          ${advBtn}
          <button class="row-btn row-btn-hist" title="Work history" data-action="hist" data-emp-id="${emp.id}"><i class="ti ti-history"></i><span>History</span></button>
        </div>
      </td>
    </tr>`;
}

/* ═══════════ VIRTUAL-SCROLL ENGINE ═══════════
   AP2VirtualScroll creates a window of VS_ROWS (20) visible <tr> elements.
   Spacer <tr> rows above and below maintain total scroll height so the
   browser scrollbar thumb stays accurate.  Renders only what the eye sees.
   ════════════════════════════════════════════ */
function _buildVS(rows) {
  const wrap = document.querySelector('.emp-table-wrap');
  if (!wrap) return;

  // Clear any previous VS instance
  if (_vsInstance) { _vsInstance.destroy(); _vsInstance = null; }

  // Remove any old pagination
  const oldPg = document.getElementById('emp-pagination');
  if (oldPg) oldPg.remove();

  // Empty check
  if (!rows.length) {
    const tbody = document.getElementById('emp-tbody');
    if (tbody) tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px 16px;">
      <div style="color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:10px;">
        <i class="ti ti-users-minus" style="font-size:36px;opacity:.4;"></i>
        <span style="font-size:13px;">No employees match this filter</span>
      </div></td></tr>`;
    _renderBlockNav(0, 0);
    return;
  }

  // ── SLICE: render first block of SLICE_SZ rows ──
  _currentBlock = 0;
  const block = rows.slice(0, SLICE_SZ);

  // ── VIRTUAL-SCROLL: mount on the tbody ──
  const tbody = document.getElementById('emp-tbody');
  if (!tbody) return;

  // Spacer rows for virtual scroll math
  let _trTop = tbody.querySelector('tr.vs-spacer-top');
  let _trBot = tbody.querySelector('tr.vs-spacer-bot');
  if (!_trTop) {
    _trTop = document.createElement('tr'); _trTop.className = 'vs-spacer-top';
    const tdT = document.createElement('td'); tdT.colSpan = 5; tdT.style.cssText = 'padding:0;height:0;';
    _trTop.appendChild(tdT);
    tbody.prepend(_trTop);
  }
  if (!_trBot) {
    _trBot = document.createElement('tr'); _trBot.className = 'vs-spacer-bot';
    const tdB = document.createElement('td'); tdB.colSpan = 5; tdB.style.cssText = 'padding:0;height:0;';
    _trBot.appendChild(tdB);
    tbody.append(_trBot);
  }

  let _startIdx = 0;

  function _setSpacers(start) {
    const bot = Math.max(0, block.length - start - VS_ROWS);
    _trTop.firstChild.style.height = (start * ROW_H) + 'px';
    _trBot.firstChild.style.height = (bot   * ROW_H) + 'px';
  }

  function _paint(start) {
    _startIdx = Math.max(0, Math.min(start, Math.max(0, block.length - VS_ROWS)));
    const visible = block.slice(_startIdx, _startIdx + VS_ROWS);
    // Remove old vs rows
    tbody.querySelectorAll('tr.vs-row').forEach(r => r.remove());
    // Insert rows directly before the bottom spacer — preserves onclick handlers
    const html = visible.map((emp, i) => buildEmpRow(emp, _startIdx + i)).join('');
    _trBot.insertAdjacentHTML('beforebegin', html);
    _setSpacers(_startIdx);
  }

  function _onScroll() {
    const newStart = Math.floor(wrap.scrollTop / ROW_H);
    if (Math.abs(newStart - _startIdx) >= 1) _paint(newStart);
  }

  wrap.addEventListener('scroll', _onScroll, { passive: true });
  _paint(0);

  _vsInstance = {
    refresh(newRows) { /* re-mount VS on new block */ _buildVS(newRows); },
    destroy() { wrap.removeEventListener('scroll', _onScroll); },
  };

  _renderBlockNav(rows.length, _currentBlock);
}

/* ── Block navigation bar (Slice navigation) ── */
function _renderBlockNav(total, blockIdx) {
  const tableCard = document.querySelector('.emp-table-card');
  if (!tableCard) return;

  let nav = document.getElementById('emp-block-nav');
  const totalBlocks = Math.ceil(total / SLICE_SZ);

  if (!nav) {
    nav = document.createElement('div');
    nav.id = 'emp-block-nav';
    nav.className = 'emp-block-nav';
    tableCard.appendChild(nav);
  }

  if (!total || totalBlocks <= 1) { nav.innerHTML = total ? `<span style="color:var(--text3);">${total} employee${total!==1?'s':''}</span>` : ''; return; }

  const start = blockIdx * SLICE_SZ + 1;
  const end   = Math.min((blockIdx + 1) * SLICE_SZ, total);
  const btnStyle = (dis, act) => `flex-shrink:0;padding:4px 11px;font-size:11.5px;border-radius:6px;border:1px solid var(--border);background:${act?'var(--accent)':'var(--surface)'};color:${act?'#fff':'var(--text2)'};cursor:${dis?'default':'pointer'};opacity:${dis?'.4':'1'};font-family:var(--font);`;

  let pageButtons = '';
  for (let b = 0; b < totalBlocks; b++) {
    pageButtons += `<button onclick="_goBlock(${b})" style="${btnStyle(false, b===blockIdx)}">${b+1}</button>`;
  }

  nav.innerHTML = `
    <span style="color:var(--text3);white-space:nowrap;">${start}–${end} <span style="color:var(--text3);opacity:.6;">of</span> ${total}</span>
    <div class="emp-block-nav-pages">
      <button onclick="_goBlock(${blockIdx-1})" style="${btnStyle(blockIdx===0,false)}">‹</button>
      ${pageButtons}
      <button onclick="_goBlock(${blockIdx+1})" style="${btnStyle(blockIdx>=totalBlocks-1,false)}">›</button>
    </div>
    <span style="color:var(--text3);font-size:11px;white-space:nowrap;">Block ${blockIdx+1}/${totalBlocks} · ${SLICE_SZ} rows</span>`;
}

function _goBlock(blockIdx) {
  const filtered = getFilteredEmps(employees);
  const totalBlocks = Math.ceil(filtered.length / SLICE_SZ);
  if (blockIdx < 0 || blockIdx >= totalBlocks) return;
  _currentBlock = blockIdx;
  const start = blockIdx * SLICE_SZ;
  const block = filtered.slice(start, start + SLICE_SZ);
  _buildVS_block(block, filtered.length, blockIdx);
  document.querySelector('.emp-table-wrap')?.scrollTo({ top: 0, behavior: 'smooth' });
}

function _buildVS_block(block, total, blockIdx) {
  const wrap  = document.querySelector('.emp-table-wrap');
  const tbody = document.getElementById('emp-tbody');
  if (!wrap || !tbody) return;

  if (_vsInstance) { _vsInstance.destroy(); _vsInstance = null; }

  if (!block.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px 16px;">
      <div style="color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:10px;">
        <i class="ti ti-users-minus" style="font-size:36px;opacity:.4;"></i>
        <span style="font-size:13px;">No employees match this filter</span>
      </div></td></tr>`;
    _renderBlockNav(0, 0); return;
  }

  // Rebuild spacers
  tbody.innerHTML = '';
  const _trTop = document.createElement('tr'); _trTop.className = 'vs-spacer-top';
  const tdT = document.createElement('td'); tdT.colSpan = 5; tdT.style.cssText = 'padding:0;height:0;';
  _trTop.appendChild(tdT);

  const _trBot = document.createElement('tr'); _trBot.className = 'vs-spacer-bot';
  const tdB = document.createElement('td'); tdB.colSpan = 5; tdB.style.cssText = 'padding:0;height:0;';
  _trBot.appendChild(tdB);

  tbody.appendChild(_trTop);
  tbody.appendChild(_trBot);

  let _startIdx = 0;
  const baseIdx = blockIdx * SLICE_SZ;

  function _setSpacers(start) {
    const bot = Math.max(0, block.length - start - VS_ROWS);
    tdT.style.height = (start * ROW_H) + 'px';
    tdB.style.height = (bot   * ROW_H) + 'px';
  }

  function _paint(start) {
    _startIdx = Math.max(0, Math.min(start, Math.max(0, block.length - VS_ROWS)));
    const visible = block.slice(_startIdx, _startIdx + VS_ROWS);
    tbody.querySelectorAll('tr.vs-row').forEach(r => r.remove());
    const html = visible.map((emp, i) => buildEmpRow(emp, baseIdx + _startIdx + i)).join('');
    // Insert directly before bottom spacer — preserves onclick handlers in live DOM
    _trBot.insertAdjacentHTML('beforebegin', html);
    _setSpacers(_startIdx);
  }

  // Measure actual rendered row height so spacer math stays accurate
  // regardless of padding/font-size/clamp values
  function _measureRowH() {
    const firstRow = tbody.querySelector('tr.vs-row');
    if (firstRow) ROW_H = Math.max(firstRow.getBoundingClientRect().height, 1);
  }

  // Throttled to ONE read + ONE write per animation frame — not once per
  // raw scroll event. Reading scrollTop right after a DOM write (or right
  // before another one) forces the browser to do a synchronous layout
  // recalculation — that's the "forced reflow" / slow rAF handler warning.
  // Batching via rAF, and skipping duplicate calls within the same frame,
  // removes that entirely. This matters on every OS, but shows up worst
  // on iPad because Safari fires scroll events far more often mid-swipe.
  let _scrollTicking = false;
  function _onScroll() {
    if (_scrollTicking) return;
    _scrollTicking = true;
    requestAnimationFrame(() => {
      const newStart = Math.floor(wrap.scrollTop / ROW_H); // read (layout)
      if (Math.abs(newStart - _startIdx) >= 1) _paint(newStart); // write (DOM)
      _scrollTicking = false;
    });
  }

  wrap.addEventListener('scroll', _onScroll, { passive: true });
  _paint(0);
  requestAnimationFrame(_measureRowH); // measure after browser lays out the rows

  // ── iPad/iOS Safari guard: a container sized with 100vh (or similar)
  // can end up with 0 visible height when Safari's toolbar shows/hides —
  // rows are correctly in the DOM, but there's no visible box to see them
  // in. Detect that and force a usable height instead of silently
  // rendering into nothing.
  requestAnimationFrame(() => {
    if (wrap.clientHeight < 40) {
      console.warn('[allEmp] scroll container has near-zero height (' + wrap.clientHeight + 'px) — forcing a usable height');
      wrap.style.height = Math.max(window.innerHeight - wrap.getBoundingClientRect().top - 16, 240) + 'px';
      wrap.style.minHeight = '240px';
    }
  });

  _vsInstance = {
    destroy() { wrap.removeEventListener('scroll', _onScroll); }
  };

  _renderBlockNav(total, blockIdx);
}

/* ── Main render entry — Memory-Hoist → Slice → Virtual-Scroll ── */
function renderEmpTable(list) {
  const filtered = getFilteredEmps(list);
  _currentBlock  = 0;
  const firstBlock = filtered.slice(0, SLICE_SZ);
  // Memory-Hoist: `filtered` already lives in RAM — no re-fetch needed
  _buildVS_block(firstBlock, filtered.length, 0);
}

function filterEmps(q) {
  empSearchQuery = q || '';
  renderEmpTable(employees);
  document.querySelector('.emp-table-wrap')?.scrollTo({ top: 0 });
}

function filterHR(type) {
  currentHRFilter = type;
  document.querySelectorAll('.hr-filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === type));
  renderEmpTable(employees);
  document.querySelector('.emp-table-wrap')?.scrollTo({ top: 0 });
}

/* ═══════════ TOAST ═══════════ */
let toastTimer;
function toast(msg, type='success') {
  const el=document.getElementById('toast'), msgEl=document.getElementById('toast-msg'), icon=document.getElementById('toast-icon');
  clearTimeout(toastTimer); el.className='toast'; msgEl.textContent=msg;
  icon.className=type==='error'?'ti ti-x-circle':'ti ti-circle-check';
  requestAnimationFrame(()=>{ el.classList.add('show',type); });
  toastTimer=setTimeout(()=>{ el.classList.remove('show'); }, 3500);
}

/* ═══════════ INIT ═══════════ */
document.addEventListener('DOMContentLoaded', () => {
  loadEmployees();

  /* ── Event delegation for row action buttons ──
     Generic for View / Advance / History — and for any future button:
     just give it a data-action + data-emp-id and register a handler
     for that action name in its own js/actions/action-*.js file
     (see panel-core.js). Nothing here needs to change.
     Also handles virtual-scroll repaint and avoids inline onclick with
     JSON.stringify(emp.id), which breaks when emp.id contains quotes. */
  document.querySelector('.emp-table-wrap')?.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const empId = btn.dataset.empId;
    if (!empId) return;
    SidePanel.open(btn.dataset.action, empId);
  });
});

/* Listen for messages from parent index.html
   ── PRIMARY data path on this page: the parent (index.html) already has
   a working push system that has nothing to do with cacheWatcher.js:
     - 'ap-cache-preload' : parent proactively pushes ALL cached datasets
                            the moment they're ready (from its own memory
                            — no IndexedDB read needed here at all)
     - 'ap-cache-ready'   : parent's direct reply to our 'ap-cache-request'
     - 'ap-cache-updated' : parent says something changed — ask it again
   This sidesteps iPad's IndexedDB flakiness entirely for the common case
   (page running inside the app). cacheWatcher.js / IndexedDB reads remain
   as the fallback for when this page is opened standalone (no parent). */
window.addEventListener('message', (e) => {
  if (!e.data) return;

  // Parent proactively pushed everything it has — take our slice directly.
  if (e.data.type === 'ap-cache-preload' && e.data.datasets) {
    const rows = e.data.datasets[_AP2_CACHE_KEY];
    if (Array.isArray(rows) && rows.length) {
      employees = rows.map((r, i) => normaliseRow(r, i)).filter(Boolean);
      renderEmpTable(employees);
    }
  }

  // Parent's direct reply to our own ap-cache-request below.
  if (e.data.type === 'ap-cache-ready' && e.data.key === _AP2_CACHE_KEY) {
    const rows = e.data.data;
    if (Array.isArray(rows) && rows.length) {
      employees = rows.map((r, i) => normaliseRow(r, i)).filter(Boolean);
      renderEmpTable(employees);
    }
  }

  // Parent says something changed somewhere — ask it for our dataset again.
  if (e.data.type === 'ap-cache-updated') {
    try { window.parent.postMessage({ type: 'ap-cache-request', key: _AP2_CACHE_KEY }, '*'); } catch (err) {}
  }

  // Instant theme sync — parent pushes on every theme change
  if (e.data.type === 'ap-theme' && e.data.theme) {
    document.documentElement.setAttribute('data-theme', e.data.theme);
  }
});

// Ask the parent for our data right away, in parallel with the IndexedDB
// read in loadEmployees(). Whichever answers first wins — if there's no
// parent (page opened standalone), this simply gets no reply and the
// IndexedDB path (loadEmployees / cacheWatcher.js) still works on its own.
try { window.parent.postMessage({ type: 'ap-cache-request', key: _AP2_CACHE_KEY }, '*'); } catch (e) {}
</script>
